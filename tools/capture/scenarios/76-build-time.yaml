schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: build-time
title: Construction time with one builder (UNK-18, TIME column)
resolves: [UNK-18]
priority: 3
minutes: 2
experimental: true
description: |
  No cheats needed: a starting peasant next to the castle of MP2 builds a lumber mill (B, L: the command-card letters
  of MENU.INI) two tiles away; the site is selected and the selection panel captured every 500 ms. The panel turns into
  the mill's card when it is finished: the last change of the panel is the completion (minus a walk of about 2 s).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: lumber-mill
    vars: {measure: build, subject: lumber, expected_s: "30", count: "1"}
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  # The castle view of MP2 (first session, smoke/castle): the castle at the lower right, peasants at (747, 480),
  # (1005, 480) and (747, 710), trees, two rock piles at (380, 660) and (605, 665), cows around y = 395.
  - key: {key: C, ctrl: true}
  - key: Space
  - wait: 1
  - click: [747, 480]               # a starting peasant
  - key: B
  - key: L
  - click: [660, 560]               # place the mill on open grass next to the castle
  - wait: 0.5
  - click: [660, 560]               # select the site
  - move: [70, 400]
  - burst: {name: panel, count: 140, interval_ms: 500, region: [4, 165, 142, 140]}
  - snapshot: {name: after, game: false}
analysis: [region-timing]
