  - wait: 5
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
  - click: {at: [486, 432], button: right}   # stay (t = 50 s; run 5's went off to chop wood)
  - wait: 5
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
  - click: {at: [486, 432], button: right}   # stay (t = 55 s; run 5's went off to chop wood)
  - wait: 5
  # B: kingdom 2's own spy, set up as the owner advised (2026-10-21). With nothing selected, hmkingdom 1 first (after
  # hmkingdom 2 the next spawn is kingdom 2's: runs 5-6's detector spawned red and walked off); spawned ours at tile
  # (24, 53), walked one tile west so that it faces the way the peasant will come (a spy unmasks only what is in front
  # of it), told to stand its ground, and only then given to kingdom 2.
  - minimap: [0.297, 0.719]
  - click: [774, 496]               # nothing selected: open ground at tile (19, 55)
  - chat: "${cheat}kingdom 1"
  - move: [934, 432]
  - chat: "${cheat}spawn spy"
  - click: [934, 432]               # place
  - wait: 0.5
  - click: [934, 432]               # select
  - click: {at: [902, 432], button: right}   # one tile west, to tile (23, 53): it now faces west
  - wait: 2
  - key: N                          # stand ground
  - chat: "${cheat}kingdom 2"
  - wait: 1
  - snapshot: {name: b-ready, game: false}
  - drag: {from: [440, 392], to: [532, 468]}   # the disguised peasant again (a box takes only our own units)
  - move: [70, 400]
  - snapshot: {name: start, game: false, tags: {a_tile: "10", b_tile: "23"}}
