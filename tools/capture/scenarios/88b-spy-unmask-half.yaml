schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: spy-unmask-half
title: How close the copied kingdom's spy must come to unmask a half-full disguise meter (MAG-012, MAG-021)
resolves: []
priority: 3
minutes: 4
default: false                      # batch J
experimental: true
description: |
  As spy-unmask, but the look is kept for 55 s before B comes, so the meter is about 50 to 75 during the approach.
  Runs 4-7 never gave the clean case. On MP2 our base, its cows and kingdom 2's army got in the way, the camera jumped
  to a fight (run 6), and the detecting spy spawned in kingdom 2's colours and walked off; run 7's MP1 row was forest
  (snow maps keep trees in tile cells the converter's reading missed), and the impersonation never happened. The owner
  (2026-10-21) also saw that a spy unmasks only what is in front of it. So this is MP2's bottom-left corner again, the
  open band of rows 51-55 that the speed runs used (tile (x, y) at screen (150 + 32x, 32y - 1280), ADR 0171), with the
  owner's set-up of the detector, facing west, the view put back before every step, and the disguised peasant coming
  from the west into the detector's face, one tile at a time. The step at which its look turns into a spy's, with B's
  position in that capture, gives the distance; the meter is in the selection view. Analysed by hand (manual.yaml).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: half
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  - minimap: [0.297, 0.719]          # map tile (6, 60): the view clamped to the bottom-left corner
  - wait: 1
  - snapshot: view
  # A: our spy at tile (12, 53), standing its ground first (run 4: spawned next to an enemy, it went for it).
  - move: [550, 432]
  - chat: "${cheat}spawn spy"
  - click: [550, 432]               # place
  - wait: 0.5                       # longer than the double-click time
  - click: [550, 432]               # select
  - key: N                          # stand ground: it attacks only what is in reach
  # P: a peasant at tile (10, 52), out of A's reach, given to kingdom 2; A impersonates it (runs 5 and 6: the spy is
  # gone and the peasant, in kingdom 2's colours, is ours).
  - move: [486, 400]
  - chat: "${cheat}spawn peon"
  - click: [486, 400]               # place
  - wait: 0.5
  - click: [486, 400]               # select
  - chat: "${cheat}kingdom 2"
  - click: [550, 432]               # A again
  - key: I                          # impersonate (MENU.INI spy_add)
  - click: [486, 400]               # P
  - wait: 4
  - snapshot: {name: disguised, game: false}
  - click: {at: [486, 432], button: right}   # to tile (10, 53), the start of the approach
  - wait: 2
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
  - click: {at: [486, 432], button: right}   # stay (t = 5 s; run 5's went off to chop wood)
  - wait: 5
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
  - click: {at: [486, 432], button: right}   # stay (t = 10 s; run 5's went off to chop wood)
  - wait: 5
