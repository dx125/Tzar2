  - click: {at: [486, 432], button: right}   # stay (t = 25 s; run 5's went off to chop wood)
  - wait: 5
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
  - click: {at: [486, 432], button: right}   # stay (t = 30 s; run 5's went off to chop wood)
  - wait: 5
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
  - click: {at: [486, 432], button: right}   # stay (t = 35 s; run 5's went off to chop wood)
  - wait: 5
  - minimap: [0.297, 0.719]          # the view back to the corner, should it have jumped to a fight (run 6)
