schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: spy-unmask
title: How close another kingdom's spy must come to unmask a fresh disguise (MAG-012, MAG-021)
resolves: []
priority: 3
minutes: 2.5
default: false                      # batch J
experimental: true
description: |
  The owner (2026-10-21): another kingdom's spy that comes close enough unmasks a disguised spy; towers do not. The
  data has no distance. Here A's meter is fresh, about 5 to 15.
  Run 2 tried MP6 for a kingdom without an AI: the map loads slower (the first cheats were lost), the camera starts in
  the middle, and every kingdom there has an AI. So this runs on MP2 again, in the bottom-left corner (tile (x, y) at
  screen (150 + 32x, 32y - 1280), ADR 0171), with kingdom 2's AI driving the detector:
  * our spy A impersonates one of our own peasants (run 1: it takes the peasant's place and look); any other
    kingdom's spy may unmask that disguise;
  * a spy B is spawned 8 tiles away and given to kingdom 2; A is the enemy nearest to it;
  * A attacks B, so the two close in whatever B's AI does, and the whole view is captured every 200 ms. The frame in
    which A's look turns from a peasant's into a spy's gives the distance; A's meter is in the selection view.
  Analysed by hand (manual.yaml).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: fresh
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  - minimap: [0.297, 0.719]          # map tile (6, 60): the view clamped to the bottom-left corner
  - wait: 1
  - snapshot: view
  # P: the look to copy, one of our own peasants at tile (10, 52) (run 1: the spy takes its place).
  - move: [486, 400]
  - chat: "${cheat}spawn peon"
  - click: [486, 400]               # place
  - wait: 0.5                       # longer than the double-click time
  # A: our spy, two tiles off; it impersonates P and stands its ground.
  - move: [550, 432]
  - chat: "${cheat}spawn spy"
  - click: [550, 432]               # place
  - wait: 0.5
  - click: [550, 432]               # select
  - key: I                          # impersonate (MENU.INI spy_add)
  - click: [486, 400]               # P
  - wait: 4
  - key: N                          # stand ground: no walking off to fight while it waits
  - snapshot: {name: disguised, game: false}
  # B: the detector, spawned 8 tiles from A at tile (18, 53) and given to kingdom 2. Its AI takes it over (batch E);
  # A, in a peasant's look of ours, is the enemy nearest to it (our cows and peasants are 9 tiles or more away).
  - move: [742, 432]
  - chat: "${cheat}spawn spy"
  - click: [742, 432]               # place
  - wait: 0.5
  - click: [742, 432]               # select
  - chat: "${cheat}kingdom 2"
  - drag: {from: [430, 350], to: [620, 470]}   # A again (a box takes only our own units)
  - click: {at: [742, 432], button: right}   # A attacks B: the two close in (fighting keeps the disguise, the owner)
  - move: [70, 400]
  # The whole view every 200 ms: the frame in which A's look turns from a peasant's into a spy's gives the distance.
  - burst: {name: approach, count: 75, interval_ms: 200, region: [150, 30, 874, 738]}
  - snapshot: {name: closed, game: false}
  - wait: 3
  - snapshot: after
analysis: [capture-quality]
