schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: spy-unmask
title: How close the copied kingdom's spy must come to unmask a fresh disguise (MAG-012, MAG-021)
resolves: []
priority: 3
minutes: 3
default: false                      # batch J
experimental: true
description: |
  The owner (2026-10-21): the copied kingdom's spies unmask a disguised spy that comes close enough, in front of
  them; towers do not. Here the meter is fresh, about 5 to 30 during the approach; the peasant reveals itself at the end.
  Runs 4-6 on MP2 never gave the clean case: our base, its cows and kingdom 2's army kept getting in the way (run 6's
  camera jumped to a fight at our castle), and the detecting spy spawned in kingdom 2's colours and walked off (the
  owner: after hmkingdom 2 the next spawn is kingdom 2's). The owner also saw that a spy unmasks only what is in front
  of it: run 6's peasant stood right next to the detector's back, meter 45, and was not unmasked. So this runs on MP1,
  on the open row 36 between the river and our base (16 rows from our peasants, kingdom 2 in the far corner, no
  castles on the map), the detector is set up facing west, and the disguised peasant comes from the west, one tile at
  a time, into its face. The step at which the peasant's look turns into a spy's, with B's position in that capture,
  gives the distance; the meter is in the selection view. Analysed by hand (manual.yaml).
launch: [-nomovies, -map, MP1.wmp]
trials:
  - name: fresh
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  # MP1 (64 x 64, drawn like MP2 in the middle of the minimap): map tile (10, 36), so the view is clamped to the left
  # edge (columns 0-27) and centred on row 36, open ground between the river and our base.
  - minimap: [0.328, 0.531]
  - wait: 1
  - snapshot: view
  # A: our spy at tile (12, 36), standing its ground first (run 4: spawned next to an enemy, it went for it).
  - move: [550, 400]
  - chat: "${cheat}spawn spy"
  - click: [550, 400]               # place
  - wait: 0.5                       # longer than the double-click time
  - click: [550, 400]               # select
  - key: N                          # stand ground: it attacks only what is in reach
  # P: a peasant at tile (10, 36), out of A's reach, given to kingdom 2; A impersonates it (run 5: A is gone, P stays
  # in kingdom 2's colours and is ours).
  - move: [486, 400]
  - chat: "${cheat}spawn peon"
  - click: [486, 400]               # place
  - wait: 0.5
  - click: [486, 400]               # select
  - chat: "${cheat}kingdom 2"
  - click: [550, 400]               # A again
  - key: I                          # impersonate (MENU.INI spy_add)
  - click: [486, 400]               # P
  - wait: 4
  - snapshot: {name: disguised, game: false}
  - click: {at: [486, 400], button: right}   # stay at tile (10, 36)
  - wait: 2
  # B: kingdom 2's own spy, set up as the owner advised (2026-10-21): with nothing selected, hmkingdom 1 first (run 6's
  # spawned red and wandered off under kingdom 2's AI); spawned ours at tile (26, 36), walked one tile west so that it
  # faces the way A will come (the owner: a spy unmasks only what is in front of it), told to stand its ground, and
  # only then given to kingdom 2.
  - click: [742, 400]               # nothing selected: open ground at tile (18, 36)
  - chat: "${cheat}kingdom 1"
  - move: [998, 400]
  - chat: "${cheat}spawn spy"
  - click: [998, 400]               # place
  - wait: 0.5
  - click: [998, 400]               # select
  - click: {at: [966, 400], button: right}   # one tile west: it now faces west
  - wait: 2
  - key: N                          # stand ground
  - chat: "${cheat}kingdom 2"
  - wait: 1
  - snapshot: {name: b-ready, game: false}
  - drag: {from: [440, 360], to: [532, 436]}   # the disguised peasant again (a box takes only our own units)
  - move: [70, 400]
  - snapshot: {name: start, game: false, tags: {a_tile: "10", b_tile: "25"}}
  # The approach from the west, into B's face, one tile at a time, the window captured after each step.
  - click: {at: [518, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-11, game: false, tags: {a_tile: "11", b_tile: "25"}}
  - click: {at: [550, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-12, game: false, tags: {a_tile: "12", b_tile: "25"}}
  - click: {at: [582, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-13, game: false, tags: {a_tile: "13", b_tile: "25"}}
  - click: {at: [614, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-14, game: false, tags: {a_tile: "14", b_tile: "25"}}
  - click: {at: [646, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-15, game: false, tags: {a_tile: "15", b_tile: "25"}}
  - click: {at: [678, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-16, game: false, tags: {a_tile: "16", b_tile: "25"}}
  - click: {at: [710, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-17, game: false, tags: {a_tile: "17", b_tile: "25"}}
  - click: {at: [742, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-18, game: false, tags: {a_tile: "18", b_tile: "25"}}
  - click: {at: [774, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-19, game: false, tags: {a_tile: "19", b_tile: "25"}}
  - click: {at: [806, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-20, game: false, tags: {a_tile: "20", b_tile: "25"}}
  - click: {at: [838, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-21, game: false, tags: {a_tile: "21", b_tile: "25"}}
  - click: {at: [870, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-22, game: false, tags: {a_tile: "22", b_tile: "25"}}
  - click: {at: [902, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-23, game: false, tags: {a_tile: "23", b_tile: "25"}}
  - click: {at: [934, 400], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-24, game: false, tags: {a_tile: "24", b_tile: "25"}}
  # What revealing turns the taken-over peasant into (run 6: a spy, attack 20, the meter still counting).
  - key: V                          # reveal (MENU.INI spy_add)
  - wait: 2
  - snapshot: {name: revealed, game: false}
  - wait: 3
  - snapshot: after
analysis: [capture-quality]
