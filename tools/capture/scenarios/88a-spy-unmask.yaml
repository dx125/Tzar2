schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: spy-unmask
title: How close the copied kingdom's spy must come to unmask a fresh disguise (MAG-012, MAG-021)
resolves: []
priority: 3
minutes: 2.5
default: false                      # batch J
experimental: true
description: |
  The owner (2026-10-21): the copied kingdom's spies unmask a disguised spy that comes close enough; towers do not.
  Here the meter is fresh, about 5 to 30 during the approach, and the peasant reveals itself at the end (V).
  Run 5 (2026-10-21): A copied a peasant of kingdom 2 and took it over (the peasant stays, in kingdom 2's colours, and
  is ours, with its own attack); kingdom 2's spy, spawned about 6 tiles off, turned it back into a spy's look within
  seconds while its meter was about 3, and its meter went on counting. That bounds the distance from below only. Here
  the disguised peasant is moved to tile (8, 53) and kept there with a move order every 5 s (run 5's went off to chop
  wood by itself), kingdom 2's spy B is spawned 14 tiles off, beyond a spy's sight, and the peasant walks to it one tile
  at a time, the whole window captured after each step. The step at which its look turns into a spy's, with B's
  position in that capture, gives the distance; the meter is in the selection view. MP2's bottom-left corner: tile
  (x, y) at screen (150 + 32x, 32y - 1280), ADR 0171. Analysed by hand (manual.yaml).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: fresh
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  - minimap: [0.297, 0.719]          # map tile (6, 60): the view clamped to the bottom-left corner
  - wait: 1
  - snapshot: view
  # A: our spy at tile (12, 53), standing its ground first (run 4: spawned next to an enemy, it went for it).
  - move: [550, 432]
  - chat: "${cheat}spawn spy"
  - click: [550, 432]               # place
  - wait: 0.5                       # longer than the double-click time
  - click: [550, 432]               # select
  - key: N                          # stand ground: it attacks only what is in reach
  # P: a peasant at tile (10, 52), out of A's reach, given to kingdom 2; A impersonates it (run 5: A is gone, P stays
  # in kingdom 2's colours and is ours).
  - move: [486, 400]
  - chat: "${cheat}spawn peon"
  - click: [486, 400]               # place
  - wait: 0.5
  - click: [486, 400]               # select
  - chat: "${cheat}kingdom 2"
  - click: [550, 432]               # A again
  - key: I                          # impersonate (MENU.INI spy_add)
  - click: [486, 400]               # P
  - wait: 4
  - snapshot: {name: disguised, game: false}
  # The disguised peasant to tile (8, 53), and kept there: run 5's went off to chop wood by itself while it waited.
  - click: {at: [422, 432], button: right}
  - wait: 3
  # B: kingdom 2's own spy, 14 tiles off at tile (22, 53), beyond the 12 tiles a spy sees.
  - move: [902, 432]
  - chat: "${cheat}spawn spy"
  - click: [902, 432]               # place
  - wait: 0.5
  - click: [902, 432]               # select
  - chat: "${cheat}kingdom 2"
  - drag: {from: [380, 390], to: [470, 470]}   # the disguised peasant again (a box takes only our own units)
  - move: [70, 400]
  - snapshot: {name: start, game: false, tags: {a_tile: "8", b_tile: "22"}}
  # The approach: one tile at a time, the whole window captured after each step (B may walk: its AI moves it).
  - click: {at: [454, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-9, game: false, tags: {a_tile: "9", b_tile: "22"}}
  - click: {at: [486, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-10, game: false, tags: {a_tile: "10", b_tile: "22"}}
  - click: {at: [518, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-11, game: false, tags: {a_tile: "11", b_tile: "22"}}
  - click: {at: [550, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-12, game: false, tags: {a_tile: "12", b_tile: "22"}}
  - click: {at: [582, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-13, game: false, tags: {a_tile: "13", b_tile: "22"}}
  - click: {at: [614, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-14, game: false, tags: {a_tile: "14", b_tile: "22"}}
  - click: {at: [646, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-15, game: false, tags: {a_tile: "15", b_tile: "22"}}
  - click: {at: [678, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-16, game: false, tags: {a_tile: "16", b_tile: "22"}}
  - click: {at: [710, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-17, game: false, tags: {a_tile: "17", b_tile: "22"}}
  - click: {at: [742, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-18, game: false, tags: {a_tile: "18", b_tile: "22"}}
  - click: {at: [774, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-19, game: false, tags: {a_tile: "19", b_tile: "22"}}
  - click: {at: [806, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-20, game: false, tags: {a_tile: "20", b_tile: "22"}}
  - click: {at: [838, 432], button: right}
  - move: [70, 400]
  - wait: 2.5
  - snapshot: {name: at-21, game: false, tags: {a_tile: "21", b_tile: "22"}}
  # What revealing turns the taken-over peasant into.
  - key: V                          # reveal (MENU.INI spy_add)
  - wait: 2
  - snapshot: {name: revealed, game: false}
  - wait: 3
  - snapshot: after
analysis: [capture-quality]
