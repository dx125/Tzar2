    vars: {a: knight, b: maceman, a_hp: "120", a_attack: "12", a_defence: "6", a_rate: "4", b_hp: "120", b_attack: "8", b_defence: "0", b_rate: "3", a_bonus: "0", b_bonus: "0"}
