schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: combat-outcomes
title: Per-pair combat outcomes, 8 duels per game (UNK-08, S4)
resolves: [UNK-08]
priority: 5
minutes: 20
default: false                      # batch H (ADR 0113)
experimental: true
description: |
  Eight duels of the same pair at once (2 x 4 spots in the open middle of MP2), side b (kingdom 2) spawned first, then
  side a; the game runs at its top speed (the outcome does not depend on it). 35 s later a game snapshot tagged with the
  spots shows who is left. Twelve pairs, including mirror pairs: if the 8 duels of a mirror pair do not all end the same
  way, the original is random and the batch must be repeated (7 games per pair for 100 trials). Neighbouring duels are
  120 px apart (inside each other's sight): the analysis counts winners per spot, so cross-fights blur rather than fake
  an outcome.
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: footman-vs-footman
    vars: {a: footman, b: footman, a_hp: "65", a_attack: "6", a_defence: "3", a_rate: "5", b_hp: "65", b_attack: "6", b_defence: "3", b_rate: "5", a_bonus: "0", b_bonus: "0"}
  - name: peon-vs-peon
    vars: {a: peon, b: peon, a_hp: "50", a_attack: "5", a_defence: "0", a_rate: "3", b_hp: "50", b_attack: "5", b_defence: "0", b_rate: "3", a_bonus: "0", b_bonus: "0"}
  - name: archer-vs-archer
    vars: {a: archer, b: archer, a_hp: "50", a_attack: "5", a_defence: "0", a_rate: "4", b_hp: "50", b_attack: "5", b_defence: "0", b_rate: "4", a_bonus: "0", b_bonus: "0"}
  - name: knight-vs-footman
    vars: {a: knight, b: footman, a_hp: "120", a_attack: "12", a_defence: "6", a_rate: "4", b_hp: "65", b_attack: "6", b_defence: "3", b_rate: "5", a_bonus: "0", b_bonus: "0"}
  - name: maceman-vs-pikeman
    vars: {a: maceman, b: pikeman, a_hp: "120", a_attack: "8", a_defence: "0", a_rate: "3", b_hp: "75", b_attack: "8", b_defence: "4", b_rate: "2", a_bonus: "0", b_bonus: "0"}
  - name: pikeman-vs-knight
    vars: {a: pikeman, b: knight, a_hp: "75", a_attack: "8", a_defence: "4", a_rate: "2", b_hp: "120", b_attack: "12", b_defence: "6", b_rate: "4", a_bonus: "600", b_bonus: "0"}
  - name: footman-vs-pikeman
    vars: {a: footman, b: pikeman, a_hp: "65", a_attack: "6", a_defence: "3", a_rate: "5", b_hp: "75", b_attack: "8", b_defence: "4", b_rate: "2", a_bonus: "150", b_bonus: "0"}
  - name: maceman-vs-footman
    vars: {a: maceman, b: footman, a_hp: "120", a_attack: "8", a_defence: "0", a_rate: "3", b_hp: "65", b_attack: "6", b_defence: "3", b_rate: "5", a_bonus: "0", b_bonus: "0"}
  - name: knight-vs-knight
    vars: {a: knight, b: knight, a_hp: "120", a_attack: "12", a_defence: "6", a_rate: "4", b_hp: "120", b_attack: "12", b_defence: "6", b_rate: "4", a_bonus: "0", b_bonus: "0"}
  - name: archer-vs-peon
    vars: {a: archer, b: peon, a_hp: "50", a_attack: "5", a_defence: "0", a_rate: "4", b_hp: "50", b_attack: "5", b_defence: "0", b_rate: "3", a_bonus: "0", b_bonus: "0"}
  - name: footman-vs-archer
