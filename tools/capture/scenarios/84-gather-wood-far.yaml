schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: gather-wood-far
title: Gathering time: wood from a far tree (UNK-17)
resolves: [UNK-17]
priority: 5
minutes: 1.8
default: false                      # batch E (ADR 0113)
description: |
  As gather-wood, from a tree about 350 px from the castle; the trial records the tree and the castle's near edge, so the
  walk can be removed with the peasant's measured speed: what is left of a trip is the gathering time of one load.
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: wood-far
    vars: {target: tree, target_xy: "465,325", dropoff_xy: "790,560"}
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  # The castle view of MP2 (session 1, smoke/castle): castle lower right, peasants around (747, 480), trees, rocks.
  - key: {key: C, ctrl: true}
  - key: Space
  - wait: 1
  - snapshot: {name: before, game: false}
  - memscan: {name: res-all, value: "1000", width: 4}
  - wait: 1
  - memscan: {name: res-stable, from: res-all, mode: unchanged}
  # A starting peasant, selected with a box (units only; the castle starts right of x = 790).
  - drag: {from: [705, 440], to: [785, 525]}
  - click: {at: [465, 325], button: right}
  - memsample: {name: res-stable-series, scan: res-stable, max_addresses: 4096, interval_ms: 100, duration_s: 70}
  - wait: 30
  - memscan: {name: res-up, from: res-stable, mode: increased}
  - memsample: {name: res-series, scan: res-up, max_addresses: 256, interval_ms: 50, duration_s: 40}
  - wait: 41
  - snapshot: {name: after, game: false}
analysis: [gather-rates]
