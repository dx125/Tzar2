schema: tzar2-capture-scenario/1
id: shadow-blend
title: Shadow darkening factor and overlap behaviour (UNK-03)
resolves: [UNK-03]
priority: 1
minutes: 3
description: |
  Snapshots of busy areas (towns with buildings, forests) on two more maps, day/night and weather off. Shadowed
  terrain pixels are compared with the known texel underneath (terrain tiles are identified exactly), which gives
  the darkening rule; applying the rule twice tests whether overlapping shadows darken twice.
launch: [-nomovies, -explore, -nofog, -map, "${map}"]
trials:
  - name: mp3-grass
    vars: {map: MP3}
  - name: mp6-snow
    vars: {map: MP6}
steps:
  - key: {key: C, ctrl: true}   # own castle: buildings and their shadows
  - key: Space
  - wait: 1
  - snapshot: {name: castle, window: false}
  - minimap: [0.25, 0.25]
  - snapshot: {name: q1, window: false}
  - minimap: [0.75, 0.25]
  - snapshot: {name: q2, window: false}
  - minimap: [0.25, 0.75]
  - snapshot: {name: q3, window: false}
  - minimap: [0.75, 0.75]
  - snapshot: {name: q4, window: false}
  - minimap: [0.5, 0.5]
  - snapshot: {name: centre, window: false}
analysis: [shadow-blend, terrain-tiles]
