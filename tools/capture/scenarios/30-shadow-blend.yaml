schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: shadow-blend
title: Shadow darkening factor and overlap behaviour (UNK-03)
resolves: [UNK-03]
priority: 1
minutes: 3
description: |
  Snapshots of busy areas (towns with buildings, forests) on two more maps, day/night and weather off. Shadowed
  terrain pixels are compared with the known texel underneath (terrain tiles are identified exactly), which gives
  the darkening rule; applying the rule twice tests whether overlapping shadows darken twice.
launch: [-nomovies, -map, "${map}"]
trials:
  - name: mp3-grass
    vars: {map: MP3.wmp}
  - name: mp6-snow
    vars: {map: MP6.wmp}
steps:
  # Start (first session, 2026-10-18): "-map <name>.wmp" opens the setup screen; an empty-background click absorbs a
  # wrapper cursor grab, if any; PLAY starts the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - key: {key: C, ctrl: true}   # own castle: buildings and their shadows
  - key: Space
  - wait: 1
  - snapshot: {name: castle, window: false}
  - minimap: [0.25, 0.25]
  - snapshot: {name: q1, window: false}
  - minimap: [0.75, 0.25]
  - snapshot: {name: q2, window: false}
  - minimap: [0.25, 0.75]
  - snapshot: {name: q3, window: false}
  - minimap: [0.75, 0.75]
  - snapshot: {name: q4, window: false}
  - minimap: [0.5, 0.5]
  - snapshot: {name: centre, window: false}
analysis: [shadow-blend, terrain-tiles]
