schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: group-speed
title: Speed of a mixed group (UNK-12)
resolves: [UNK-12]
priority: 5
minutes: 1.3
default: false                      # batch E (ADR 0113)
experimental: true
description: |
  A knight (SPEED 6) and a pikeman (SPEED 2) are spawned side by side, selected together and ordered 300 px west and
  back. The analysis tracks the moving pixels; the suite compares the group's speed with the members' speeds measured
  by unit-speed (the engine moves a group at its slowest member's speed).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: knight-pikeman
    vars: {unit: group, speed_stat: none, members: "knight,pikeman"}
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # LOCAL: lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  - minimap: [0.5, 0.5]
  - wait: 1
  - move: [600, 320]
  - chat: "${cheat}spawn knight"
  - click: [600, 320]               # place
  - move: [600, 370]
  - chat: "${cheat}spawn pikeman"
  - click: [600, 370]               # place
  - drag: {from: [560, 285], to: [640, 400]}
  - wait: 0.5
  - click: {at: [300, 345], button: right}
  - move: [70, 400]
  - burst: {name: west, count: 120, interval_ms: 100, region: [150, 270, 874, 140]}
  - click: {at: [900, 345], button: right}
  - move: [70, 400]
  - burst: {name: east, count: 140, interval_ms: 100, region: [150, 270, 874, 140]}
analysis: [unit-speed]
