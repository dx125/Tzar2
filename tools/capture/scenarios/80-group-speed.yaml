schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: group-speed
title: Speed of a mixed group (UNK-12)
resolves: [UNK-12]
priority: 5
minutes: 1.3
default: false                      # batch E (ADR 0113)
experimental: true
description: |
  A knight (SPEED 6) and a pikeman (SPEED 2) are spawned side by side, selected together and ordered 400 px west and
  back. The analysis tracks the moving pixels; the suite compares the group's speed with the members' speeds measured
  by unit-speed (the engine moves a group at its slowest member's speed). Same place as unit-speed: the open rows
  51-53 by our base, away from Nature's cows in the middle of the map, which idle military units attack (ADR 0171).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: knight-pikeman
    vars: {unit: group, speed_stat: none, members: "knight,pikeman"}
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  # Map tile (6, 60) on the minimap (MP2 is drawn in the middle 64 px of the box) clamps the view to the bottom-left
  # corner: tile (x, y) at (150 + 32x, 32y - 1280).
  - minimap: [0.297, 0.719]
  - wait: 1
  - snapshot: view
  - move: [880, 380]                # tile (22.8, 51.9)
  - chat: "${cheat}spawn knight"
  - click: [880, 380]               # place
  - move: [880, 430]                # tile (22.8, 53.4)
  - chat: "${cheat}spawn pikeman"
  - click: [880, 430]               # place
  - drag: {from: [840, 345], to: [925, 470]}
  - wait: 0.5
  - click: {at: [480, 405], button: right}
  - move: [70, 400]
  # x 440-990 leaves out our cows (columns 0-6 and 27) and the peasants of row 55.
  - burst: {name: west, count: 120, interval_ms: 100, region: [440, 320, 550, 160]}
  - click: {at: [960, 405], button: right}
  - move: [70, 400]
  - burst: {name: east, count: 140, interval_ms: 100, region: [440, 320, 550, 160]}
  - snapshot: end
analysis: [unit-speed]
