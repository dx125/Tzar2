schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: spy-unmask-full
title: Whether another kingdom's spy unmasks a full disguise meter (MAG-012, MAG-021)
resolves: []
priority: 3
minutes: 4.5
default: false                      # batch J
experimental: true
description: |
  As spy-unmask, but A keeps its look for 125 s before the approach, so its meter is 100 (the owner: at 100 the spy
  can hardly be unmasked). A walks up to the tile next to B.
launch: [-nomovies, -map, MP6.wmp]
trials:
  - name: full
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  - snapshot: view                  # the start view: our peasants in the bottom-left corner
  # P: the look to copy, a peasant of kingdom 3.
  - move: [422, 272]
  - chat: "${cheat}spawn peon"
  - click: [422, 272]               # place
  - wait: 0.5                       # longer than the double-click time
  - click: [422, 272]               # select
  - chat: "${cheat}kingdom 3"
  - wait: 1
  - snapshot: {name: p-given, game: false}
  # A: our spy, two tiles from P; it impersonates P and stands its ground.
  - move: [486, 304]
  - chat: "${cheat}spawn spy"
  - click: [486, 304]               # place
  - wait: 0.5
  - click: [486, 304]               # select
  - key: I                          # impersonate (MENU.INI spy_add)
  - click: [422, 272]               # P
  - wait: 4
  - key: N                          # stand ground: no walking off to fight while it waits
  - snapshot: {name: disguised, game: false}
  # B: the detector, a spy of kingdom 3 that stands its ground at tile (22, 240).
  - move: [870, 272]
  - chat: "${cheat}spawn spy"
  - click: [870, 272]               # place
  - wait: 0.5
  - click: [870, 272]               # select
  - key: N                          # stand ground, before it changes hands
  - chat: "${cheat}kingdom 3"
  - wait: 1
  # A again (a box selects only our own units).
  - drag: {from: [380, 220], to: [600, 340]}
  - move: [70, 400]
  - snapshot: {name: start, game: false, tags: {a_tile: "8-11", b_tile: "22"}}
  # The look kept for 125 s before the approach; the panel every 5 s (the meter, one point per 1.25 s in run 1).
  - burst: {name: meter, count: 25, interval_ms: 5000, region: [4, 165, 142, 140]}
  # The approach: one tile at a time, 3 s per tile, the mouse parked so the cursor hides nothing.
  - click: {at: [550, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-12, game: false, tags: {a_tile: "12", b_tile: "22"}}
  - click: {at: [582, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-13, game: false, tags: {a_tile: "13", b_tile: "22"}}
  - click: {at: [614, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-14, game: false, tags: {a_tile: "14", b_tile: "22"}}
  - click: {at: [646, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-15, game: false, tags: {a_tile: "15", b_tile: "22"}}
  - click: {at: [678, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-16, game: false, tags: {a_tile: "16", b_tile: "22"}}
  - click: {at: [710, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-17, game: false, tags: {a_tile: "17", b_tile: "22"}}
  - click: {at: [742, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-18, game: false, tags: {a_tile: "18", b_tile: "22"}}
  - click: {at: [774, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-19, game: false, tags: {a_tile: "19", b_tile: "22"}}
  - click: {at: [806, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-20, game: false, tags: {a_tile: "20", b_tile: "22"}}
  - click: {at: [838, 272], button: right, alt: true}
  - move: [70, 400]
  - wait: 3
  - snapshot: {name: at-21, game: false, tags: {a_tile: "21", b_tile: "22"}}
  - wait: 4
  - snapshot: after
analysis: [capture-quality]
