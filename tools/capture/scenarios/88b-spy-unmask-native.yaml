schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: spy-unmask-native
title: Whether a spy spawned in kingdom 2's colours unmasks a fresh disguise, and from how far (MAG-012)
resolves: []
priority: 3
minutes: 3
default: false                      # batch J
experimental: true
description: |
  Run 8 (2026-10-22) did everything the owner advised and the peasant was never unmasked, from 13 tiles to right in
  front of the detector, at meters of 12-53, 69-100 and 100; run 5's detector unmasked a fresh look from 6 tiles. Run 5's
  spawned in kingdom 2's colours and was never told to stand; run 8's was spawned ours, stood its ground and was handed
  over. This run tells the two apart, both with a fresh look: spy-unmask hands the detector over without stand ground,
  spy-unmask-native spawns it red. MP2's bottom-left band (tile (x, y) at screen (150 + 32x, 32y - 1280), ADR 0171);
  the disguised peasant comes from the west, one tile at a time; the view is put back before every step. Analysed by
  hand (manual.yaml).
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: native
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  - minimap: [0.297, 0.719]          # map tile (6, 60): the view clamped to the bottom-left corner
  - wait: 1
  - snapshot: view
  # A: our spy at tile (12, 53), standing its ground first (run 4: spawned next to an enemy, it went for it).
  - move: [550, 432]
  - chat: "${cheat}spawn spy"
  - click: [550, 432]               # place
  - wait: 0.5                       # longer than the double-click time
  - click: [550, 432]               # select
  - key: N                          # stand ground: it attacks only what is in reach
  # P: a peasant at tile (10, 52), out of A's reach, given to kingdom 2; A impersonates it (runs 5 and 6: the spy is
  # gone and the peasant, in kingdom 2's colours, is ours).
  - move: [486, 400]
  - chat: "${cheat}spawn peon"
  - click: [486, 400]               # place
  - wait: 0.5
  - click: [486, 400]               # select
  - chat: "${cheat}kingdom 2"
  - click: [550, 432]               # A again
  - key: I                          # impersonate (MENU.INI spy_add)
  - click: [486, 400]               # P
  - wait: 4
  - snapshot: {name: disguised, game: false}
  - click: {at: [486, 432], button: right}   # to tile (10, 53), the start of the approach
  - wait: 2
  # B: spawned in kingdom 2's colours at once (the owner: after hmkingdom 2 the next spawn is kingdom 2's), as in
  # run 5, whose detector unmasked the peasant from 6 tiles; nobody tells it anything, so its AI may walk it: every
  # capture shows where it is.
  - minimap: [0.297, 0.719]
  - move: [902, 432]
  - chat: "${cheat}spawn spy"
  - click: [902, 432]               # place
  - wait: 1
  - snapshot: {name: b-ready, game: false}
  - drag: {from: [440, 392], to: [532, 468]}   # the disguised peasant again (a box takes only our own units)
  - move: [70, 400]
  - snapshot: {name: start, game: false, tags: {a_tile: "10", b_tile: "23 at spawn"}}
  - minimap: [0.297, 0.719]
  - click: {at: [518, 432], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-11, game: false, tags: {a_tile: "11", b_tile: "23"}}
  - minimap: [0.297, 0.719]
  - click: {at: [550, 432], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-12, game: false, tags: {a_tile: "12", b_tile: "23"}}
  - minimap: [0.297, 0.719]
  - click: {at: [582, 432], button: right}
  - move: [70, 400]
  - wait: 2
  - snapshot: {name: at-13, game: false, tags: {a_tile: "13", b_tile: "23"}}
  - minimap: [0.297, 0.719]
