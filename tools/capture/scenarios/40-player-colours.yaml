schema: tzar2-capture-scenario/1
id: player-colours
title: Player slot -> colour ramp mapping (UNK-01a follow-up)
resolves: [UNK-01a]
priority: 1
minutes: 4
description: |
  On the 8-kingdom map MP6. (1) Swatches: the kingdom colour squares of the setup screen (kingdoms 1-2) and of the
  diplomacy dialog (kingdoms 2-8 seen from kingdom 1) are matched to the GAME.PAL ramps. (2) Sprites: for every
  kingdom N, one knight is spawned at its own spot of an open snow field and given to kingdom N, and the ramp colours
  around that spot are counted. The first session's version (switch with "hmkingdom N", then Ctrl+C / Space to the
  castle) never left kingdom 1, so each spot is made to work whichever of two readings of the cheat is right:
  "hmkingdom N" before the spawn covers "switches the controlled kingdom", the same command with the new knight
  selected covers "gives the selection to kingdom N". If neither holds, every knight shows ramp 1 and the analysis
  reports no identity. The view is restored by a minimap click after every switch (a switch may move the camera).
launch: [-nomovies, -map, MP6.wmp]
steps:
  - snapshot: {name: setup, game: false, tags: {swatches: "191,120,35,1,2"}}
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - key: F5                         # diplomacy: kingdoms 2-8 with their colours
  - wait: 1
  - snapshot: {name: diplomacy, game: false, tags: {swatches: "309,254,32,2,7"}}
  - key: Escape
  - wait: 1
  # kingdom 1
  - chat: "${cheat}kingdom 1"
  - minimap: [0.59, 0.54]           # the start view (an open snow field in the upper right)
  - wait: 1
  - move: [640, 100]
  - chat: "${cheat}spawn knight"
  - click: [640, 100]                # place
  - click: [640, 100]                # select
  - chat: "${cheat}kingdom 1"
  - wait: 1
  - snapshot: {name: slot-1, tags: {slot: "1", region: "615,50,50,70"}}
