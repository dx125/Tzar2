schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: attack-timing
title: Attack period and damage per hit from the defender's hit points (UNK-07, UNK-08)
resolves: [UNK-07, UNK-08]
priority: 3
minutes: 8.5
experimental: true
description: |
  Spawns a defender for kingdom 2 and an attacker for kingdom 1 next to it in an open grass band of MP2, and orders
  the attack. Before the attacker exists, the game's writable memory is scanned (read-only) for the defender's
  HEALTH value and narrowed to the values that stay put for a second. Three seconds into the fight the values that
  went down are the defender's hit points; they are sampled every 10 ms for 20 s (the first 4,096 stable addresses
  are sampled as well, as a fallback). The analysis picks the address that steps down repeatedly: the times between
  steps are the attack period, the steps the damage. HEALTH, RATE, ATTACK and DEFENCE are the reference build's (European table; the first three pairs have the same
  values in every civilization, so they do not depend on which civilization the cheat spawns).
  In the first session (2026-10-18) nothing fought: the spawned units stayed all-green figures (apparently waiting
  to be placed by a click) and "hmkingdom" changed nothing visible. Now every spawn is placed with a click, and the
  owner is set so that either reading of "hmkingdom N" works: it is sent before the spawn (if it switches the
  controlled kingdom) and again with the new unit selected (if it gives the selection to kingdom N); an empty-ground
  click clears the selection before switching back, and a minimap click restores the view after every switch.
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: archer-vs-peon
    vars: {attacker: archer, defender: peon, defender_hp: "50", rate_stat: "4", attack_stat: "5", defence_stat: "0"}
  - name: peon-vs-peon
    vars: {attacker: peon, defender: peon, defender_hp: "50", rate_stat: "3", attack_stat: "5", defence_stat: "0"}
  - name: archer-vs-archer
    vars: {attacker: archer, defender: archer, defender_hp: "50", rate_stat: "4", attack_stat: "5", defence_stat: "0"}
  - name: knight-vs-footman
    vars: {attacker: knight, defender: footman, defender_hp: "65", rate_stat: "4", attack_stat: "12", defence_stat: "3"}
  - name: footman-vs-footman
    vars: {attacker: footman, defender: footman, defender_hp: "65", rate_stat: "5", attack_stat: "6", defence_stat: "3"}
  - name: maceman-vs-pikeman
    vars: {attacker: maceman, defender: pikeman, defender_hp: "75", rate_stat: "3", attack_stat: "8", defence_stat: "4"}
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # LOCAL: lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  # The defender, for kingdom 2.
  - chat: "${cheat}kingdom 2"
  - minimap: [0.5, 0.5]
  - wait: 1
  - move: [600, 340]
  - chat: "${cheat}spawn ${defender}"
  - click: [600, 340]               # place
  - click: [600, 340]               # select
  - chat: "${cheat}kingdom 2"
  - wait: 1
  - snapshot: defender
  - memscan: {name: hp-all, value: "${defender_hp}", width: 4}
  - memscan: {name: hp-all16, value: "${defender_hp}", width: 2}
  - wait: 1
  - memscan: {name: hp-stable, from: hp-all, mode: unchanged}
  - memscan: {name: hp-stable16, from: hp-all16, mode: unchanged}
  # The attacker, for kingdom 1, ordered onto the defender.
  - click: [720, 280]               # empty ground: clear the selection
  - chat: "${cheat}kingdom 1"
  - minimap: [0.5, 0.5]
  - wait: 1
  - move: [660, 340]
  - chat: "${cheat}spawn ${attacker}"
  - memsample: {name: hp-stable-series, scan: hp-stable, max_addresses: 4096, interval_ms: 20, duration_s: 25}
  - click: [660, 340]               # place
  - click: [660, 340]               # select
  - click: {at: [600, 340], button: right}   # attack the defender
  - wait: 3
  - memscan: {name: hp-hit, from: hp-stable, mode: decreased}
  - memscan: {name: hp-hit16, from: hp-stable16, mode: decreased}
  - memsample: {name: hp-series, scan: hp-hit, max_addresses: 256, interval_ms: 10, duration_s: 20}
  - memsample: {name: hp-series16, scan: hp-hit16, max_addresses: 256, interval_ms: 10, duration_s: 20}
  - move: [70, 400]
  - burst: {name: fight, count: 20, interval_ms: 1000, region: [150, 30, 874, 738]}
  - snapshot: after
analysis: [attack-timing]
