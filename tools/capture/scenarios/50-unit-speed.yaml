schema: tzar2-capture-scenario/1
# Invariants (ScenarioLoaderTests.The_repository_scenarios_and_session_are_valid): -map <name>.wmp, a PLAY click,
# no -explore/-nofog, and a left click after every spawn.
id: unit-speed
title: Unit movement speed vs. SPEED stat (UNK-12, RE-06)
resolves: [UNK-12]
priority: 2
minutes: 15.5
default: false                      # batch B
experimental: true
description: |
  Spawns one unit on the open rows 51-53 of MP2 next to our own base (the view clamped to the map's bottom-left
  corner: tile (x, y) at screen (150 + 32x, 32y - 1280)), places it with a click, selects it with a second click
  there (not with a box: one dragged to the window edge scrolls the view), orders a move 400 px west and later 480 px
  east, and records window captures every 100 ms. The analysis tracks the moving unit and fits pixels per second.
  Until 2026-10-19 it ran in the middle of the map, beside Nature's wild cows (rows 33-34): idle military units went for
  them before they were selected and most trials measured the fight (ADR 0171). Here the nearest Nature cow is 18
  rows away; the only animals near the path are our own cows (row 52, columns 0-6 and 27, outside the band). SPEED
  values are the reference build's (DATA/<CIV> UNITS.TXT: the European value where the class exists).
  Every land class of the tables (air and ships excluded), in two halves: unit-speed and unit-speed-more. Game speed: the default.
launch: [-nomovies, -map, MP2.wmp]
trials:
  - name: peon
    vars: {unit: peon, speed_stat: "4"}
  - name: footman
    vars: {unit: footman, speed_stat: "4"}
  - name: archer
    vars: {unit: archer, speed_stat: "4"}
  - name: maceman
    vars: {unit: maceman, speed_stat: "3"}
  - name: pikeman
    vars: {unit: pikeman, speed_stat: "2"}
  - name: longbowman
    vars: {unit: longbowman, speed_stat: "3"}
  - name: knight
    vars: {unit: knight, speed_stat: "6"}
  - name: crusader
    vars: {unit: crusader, speed_stat: "5"}
  - name: priest
    vars: {unit: priest, speed_stat: "4"}
  - name: spy
    vars: {unit: spy, speed_stat: "4"}
  - name: mage
    vars: {unit: mage, speed_stat: "4"}
  - name: horse-archer
    vars: {unit: horse_archer, speed_stat: "6"}
  - name: horse-samurai
    vars: {unit: horse_samurai, speed_stat: "6"}
  - name: ninja
    vars: {unit: ninja, speed_stat: "6"}
  - name: monk
    vars: {unit: monk, speed_stat: "4"}
steps:
  # Start (first session, 2026-10-18): an empty-background click absorbs a wrapper cursor grab, if any; PLAY starts
  # the map. -explore / -nofog reveal nothing, the cheats do.
  - click: [450, 300]
  - click: [772, 596]               # PLAY
  - wait: 10                        # map load
  - chat: "${cheat}reveal"
  - wait: 1
  - chat: "${cheat}nofog"
  - wait: 1
  - chat: "${cheat}nopop"             # lifts the population limit; without it hmspawn fails ("Not enough houses")
  - wait: 1
  # Map tile (6, 60) on the minimap clamps the view to the bottom-left corner (tiles 0-27 x 41-63). MP2's 64 x 64
  # tiles are drawn 1 px each in the middle of the 128-px box (x 36-99, y 63-126); a click outside is ignored, and
  # [0.1, 0.95] left the start view in place (2026-10-19 run: the path crossed our cows).
  - minimap: [0.297, 0.719]
  - wait: 1
  - snapshot: view
  - move: [880, 400]                # tile (22.8, 52.5)
  - chat: "${cheat}spawn ${unit}"
  - click: [880, 400]               # place the spawned unit (harmless if it is already placed: selects it)
  - wait: 0.5                       # longer than the double-click time: a double click selects every peasant in view
  - click: [880, 400]               # select it (batch B: a box dragged to (1015, 760) reached the window edge and scrolled the camera away)
  - wait: 0.5
  - click: {at: [480, 400], button: right}   # tile 10.3
  - move: [70, 400]
  # The band (x 440-990, rows 51-55) leaves out our cows (columns 0-6 and 27) and the peasants of row 55; the trees of
  # row 50 at its top stand still.
  - burst: {name: west, count: 100, interval_ms: 100, region: [440, 330, 550, 140]}
  - click: {at: [960, 400], button: right}   # tile 25.3
  - move: [70, 400]
  - burst: {name: east, count: 140, interval_ms: 100, region: [440, 330, 550, 140]}
  - snapshot: end
analysis: [unit-speed]
