# Capture session defaults (ADR 0030). Every scenario in scenarios/ runs with these, and may override them.
schema: tzar2-capture-session/1

# tzar.ini settings written into the work copy before every launch (SECTION.KEY: value).
ini:
  DEFAULTS.LAYOUT: LAYOUT1024L    # 1024x768, HUD on the left; geometry below is from DATA/LAYOUT.INI [LAYOUT1024L]
  DEFAULTS.DAYNIGHT: 0            # no day/night darkening: terrain colours must be the art's colours
  DEFAULTS.WEATHER: 0             # no rain/snow/cloud overlays
  DEFAULTS.LANGPROMPT: 0          # no language question at start-up
  DEFAULTS.HWCURSOR: 0            # software cursor (the default); snapshots park it on the HUD panel
  DEFAULTS.SCROLLSPEED: 2
  SOUND.MUSIC: 0
  SOUND.SOUND: 0
  VIDEO.DIRECTXDEVICE: 0          # DirectDraw, which cnc-ddraw wraps. GOG ships -1 (GDI: the game switches the desktop to
                                  # 16 bpp itself, which works only under GOG's DWM8And16BitMitigation layer for the
                                  # install's own path, not in the work copy). cnc-ddraw's [Tzar] profile says the same.
  # Never put machine values here in git: the DirectDraw/sound device counts and CPUSPEED are detected on the operator's
  # PC for every session (MachineSettings.cs); a value set here locally overrides the detected one.

# ddraw.ini [ddraw] overrides for the cnc-ddraw renderer (defaults in CncDdraw.cs: windowed, GDI, no scaling,
# devmode and adjmouse on).
wrapper: {}

# Variables usable as ${name} in scenarios.
vars:
  # Chat cheat prefix (confirmed by the first session: hmreveal / hmnofog work).
  cheat: hm

layout:
  name: LAYOUT1024L
  size: [1024, 768]
  view: [150, 30, 874, 738]       # the world view
  minimap: [4, 31, 128, 128]
  park: [70, 400]                 # mouse rest position on the HUD panel (no edge scrolling, not over the world)

timing:
  key_hold_ms: 60
  step_gap_ms: 250
  chat_open_ms: 400
  snapshot_timeout_ms: 6000
  window_timeout_s: 90
  load_s: 5                       # until the setup screen that "-map <name>.wmp" opens; scenarios click PLAY and wait for the map
  close_timeout_s: 3              # then the game is terminated (it may ask "quit?" on close)
