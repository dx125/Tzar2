schema: tzar2-fidelity-facts/1
scenario: manual
title: Values read by hand from capture images (no automatic analysis yet)
resolves: [UNK-20]
provenance:
  edition: GOG v1.10 English (reference build)
  install_matches_reference: true
  session: capture-20261018-024524
  method: read by hand from capture frames; every value names its session, trial, frame, reader and date under sources (ADR 0113)
analyses:
  setup-screen:
    status: ok
    notes: []
    facts:
      source: smoke/plain window capture "setup" (single-player setup screen of MP2)
      population_limit_default: 200
      starting_resources_default: map  # the control shows "Default": the map's own amounts on a preset map
      sources:
        population_limit_default: {session: capture-20261018-024524, trial: smoke/plain, frame: window/setup.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-18}
        starting_resources_default: {session: capture-20261018-024524, trial: smoke/plain, frame: window/setup.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-18}
  spy-disguise:
    status: ok
    notes: ["batch J, run 1 (2026-10-21). The install differed from the reference in tzar.ini and Demos/tzar.wdm only, both written by the game when the owner played it (run with -AllowModified).", "hmkingdom 3 did nothing on MP2 (only kingdoms 1 and 2 exist there), so the copied peasant and the detecting spy stayed ours: no unmasking could happen, and the spy copied its own kingdom's peasant."]
    facts:
      source: spy-unmask/fresh and spy-mastery/seasoned, the selection view of our spy (the window captures and the panel bursts)
      meter_shown_as: name  # the number in brackets after the unit's name in the selection view, "Spy (N)"
      meter_undisguised: 100
      meter_start_new_look: 0  # 3 about 3 s after the impersonation, 2 one second after a second impersonation
      meter_seconds_per_point: 1.25  # 8 at 0 s, 99 at 114 s of the burst, every 2 s in between on the line
      meter_max: 100  # reached at 120 s of the burst and held for the remaining 150 s
      meter_restarts_with_a_new_look: true  # after reveal and a second impersonation: 2, 3, ... 10 over 10 s
      copied_own_unit_disappears: true  # population 11 before, 10 after; the copied peasant is gone from the map
      disguised_panel: copied  # portrait and attack 5 / defence 0 of the copied peasant; the name stays "Spy (N)"
      disguised_card: [move, build, capture, harvest, pick_item, explore, stop, reveal_self]  # first page; the spy's own card is move, attack, guard, patrol, pick_item, explore, impersonate, stop
      third_kingdom_spy_unmasks: false  # run 3: in our own peasant's look, kingdom 2's spy never unmasked it, not even while they fought, at meters of about 10, 55 and 100
      copied_enemy_unit_taken_over: true  # run 5: the copied peasant of kingdom 2 stays where it was, in kingdom 2's colours even to us, with its own portrait and attack 5, as "Tzar 1 / Spy (N)"; a box selects it as ours; the spy itself is gone
      taken_over_peasant_works_when_idle: true  # run 5: left alone, it went to chop wood (10 wood carried after 70 s)
      revealed_takeover_is_a_spy: true  # run 6: after V the taken-over peasant had a spy's look, portrait, attack 20 and 50/50, and its name still counted on, "Spy (51)"
      handed_over_standing_spy_unmasks: false  # run 8: a spy spawned ours, walked a tile west, told to stand its ground and then given to kingdom 2 never unmasked the peasant of kingdom 2's look, from 13 tiles to right in front of it, at meters 12-53, 69-100 and 100; after the reveal it struck at once
      enemy_spy_unmasks_fresh_at_tiles: 3.4  # run 10: kingdom 2's spies spawned red north of the peasant walked up to it; with the meter at about 10 the look turned into a spy's when the nearest stood about 3.4 tiles off (the owner, by hand: 4 tiles at a meter of 8)
      enemy_spy_unmasks_full_at_tiles: 1  # run 10: with the meter at 100, unmasked only when a spy stood right next to it
      copied_kingdom_spy_unmasks_fresh_from_tiles: 6  # NOT a bound after all (run 10: enemy spies walk up first): run 5, meter about 3; kingdom 2's spy appeared 6.2 tiles off and within about 4 s the peasant had a spy's look, portrait and attack 20 (the spy 8.4 tiles off by then); the meter went on counting
      sources:
        meter_shown_as: {session: capture-20261021-203846, trial: spy-unmask/fresh, frame: window/disguised.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        meter_undisguised: {session: capture-20261021-203846, trial: spy-unmask/fresh, frame: window/spy-card.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        meter_start_new_look: {session: capture-20261021-203846, trial: spy-mastery/seasoned, frame: burst/meter-again/0000.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        meter_seconds_per_point: {session: capture-20261021-203846, trial: spy-mastery/seasoned, frame: burst/meter/0000.bmp-0057.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        meter_max: {session: capture-20261021-203846, trial: spy-mastery/seasoned, frame: burst/meter/0060.bmp-0149.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        meter_restarts_with_a_new_look: {session: capture-20261021-203846, trial: spy-mastery/seasoned, frame: burst/meter-again/0000.bmp-0010.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        copied_own_unit_disappears: {session: capture-20261021-203846, trial: spy-unmask/fresh, frame: 'window/spy-card.bmp, window/disguised.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        disguised_panel: {session: capture-20261021-203846, trial: spy-unmask/fresh, frame: window/disguised.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        disguised_card: {session: capture-20261021-203846, trial: spy-unmask/fresh, frame: 'window/disguised.bmp, window/spy-card.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        copied_enemy_unit_taken_over: {session: capture-20261021-230259, trial: spy-unmask/fresh, frame: 'window/disguised.bmp, window/start.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        taken_over_peasant_works_when_idle: {session: capture-20261021-230259, trial: spy-unmask-full/full, frame: burst/meter/0014.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        revealed_takeover_is_a_spy: {session: capture-20261021-232712, trial: spy-unmask/fresh, frame: 'window/at-20.bmp, window/revealed.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        handed_over_standing_spy_unmasks: {session: capture-20261022-002145, trial: 'spy-unmask/fresh, spy-unmask-half/half, spy-unmask-full/full', frame: 'window/start.bmp-at-22.bmp, window/revealed.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-22}
        enemy_spy_unmasks_fresh_at_tiles: {session: capture-20261022-011438, trial: spy-unmask/fresh, frame: 'window/start.bmp, window/d-10.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-22}
        enemy_spy_unmasks_full_at_tiles: {session: capture-20261022-011438, trial: spy-unmask-full/full, frame: 'window/d-7.bmp, window/d-6.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-22}
        copied_kingdom_spy_unmasks_fresh_from_tiles: {session: capture-20261021-230259, trial: spy-unmask/fresh, frame: 'window/disguised.bmp, window/start.bmp, window/at-11.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        third_kingdom_spy_unmasks: {session: capture-20261021-220250, trial: 'spy-unmask/fresh, spy-unmask-half/half, spy-unmask-full/full', frame: 'burst/approach/0000.bmp-0074.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
  repair:
    status: ok
    notes: ["batch J, run 3 (2026-10-21), install as in run 1 (-AllowModified). The hit points per blow are in repair-mill.yaml, repair-barracks.yaml and repair-castle.yaml (counter-rate): 6, 5 and 16, the original's max / (4 x TIME) rounded down."]
    facts:
      source: repair-mill, repair-barracks and repair-castle, the resource bar and the view around the mill
      repair_costs_resources: false  # gold, wood, food and stone the same before and after each repair
      idle_peasants_join: true  # our base peasants came to repair the damaged mill unasked; about seven stood around it
      repairers_full_strength: true  # about seven repairers restored ~31 HP/s on the mill, 6 HP per blow each about every 1.3 s
      blow_interval_s: 1.25  # one repairer alone: blows 1.2-1.3 s apart (mill 7.8, 9.0, 10.2 s; barracks 6.9, 8.2, 9.4 s)
      sources:
        repair_costs_resources: {session: capture-20261021-220250, trial: 'repair-mill/lumber-mill, repair-barracks/barracks, repair-castle/castle', frame: 'window/damaged.bmp, window/after.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        idle_peasants_join: {session: capture-20261021-220250, trial: repair-mill/lumber-mill, frame: window/after.bmp, read_by: implementation agent (Claude), read_utc: 2026-10-21}
        repairers_full_strength: {session: capture-20261021-220250, trial: repair-mill/lumber-mill, frame: 'mem/hp-repair.bin, window/after.bmp', read_by: implementation agent (Claude), read_utc: 2026-10-21}
        blow_interval_s: {session: capture-20261021-220250, trial: 'repair-mill/lumber-mill, repair-barracks/barracks', frame: mem/hp-repair.bin, read_by: implementation agent (Claude), read_utc: 2026-10-21}
