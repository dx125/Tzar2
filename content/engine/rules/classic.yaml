# ---- GAME-07...11 constants (ADRs 0090-0095; docs/mechanics/m3-placeholders.md, stream E) ---------------------------
combat:
  # GAME-08 experience. Manual (ch. 6 Hints): "each experience point adds one point to the attack and half a point to the
  # defense"; strategy guide: "as each experience level is earned, the next level requires more effort" and
  # "Researching Learning allows your units to gain experience" (so no levels before Learning).
  experiencePerDamagePercent: 100     # UNVERIFIED (UNK-23): experience per point of damage dealt to an enemy
  experiencePerKill: 0                # UNVERIFIED (UNK-23)
  levelBaseXp: 100                    # UNVERIFIED (UNK-23): level n needs 100 x n x (n + 1) / 2 experience
  baseLevelCap: 0                     # strategy guide: Learning allows experience; te_learning / te_heroism raise the cap
  attackPerLevel: 1                   # manual
  defenceHalvesPerLevel: 1            # manual: half a point per level (truncated: UNVERIFIED rounding, UNK-08)
  heroLevel: 12                       # TDD GAME-08: level 12 = named hero
  leadershipTechnology: te_nobility   # manual: Leadership "makes the units around a hero gain experience along with him"
  leadershipRadiusTiles: 4            # UNVERIFIED (UNK-23)
  leadershipSharePercent: 50          # UNVERIFIED (UNK-23)
  honorTechnology: te_honor           # manual: Honor "increases the attack damage of heroes, when fighting other heroes"
  honorAttackPercent: 25              # UNVERIFIED (UNK-23)
  dummyMaxLevel: 3                    # UNVERIFIED (UNK-23): training dummies teach the first levels only
  heroNames: legacy                   # DATA/HEROES.INI
  # GAME-09 holders.
  exitRadiusTiles: 3                  # UNVERIFIED: units leaving a holder take free tiles this close
  unitKeywords:                       # the [accept]/[enter] keywords of the object INIs
    allunits: [foot, mounted, large]
    earthunits: [foot, mounted, large]
    infantryunits: [foot]
    mountedunits: [mounted]
  # GAME-10 crafting (Arabian Magic Workshop: "better items cost more and take more time", manual ch. 5 §6).
  craftGoldPerPower: 50               # UNVERIFIED (UNK-25)
  craftMsPerPower: 2000               # UNVERIFIED (UNK-25)
  craftMaxPower: 20                   # UNVERIFIED (UNK-25)
  # GAME-11.
  bribeCostPercent: 200               # UNVERIFIED (UNK-26): gold = 200% of the unit's cost
  crusadeAnchor: euro.crusadeanchor   # OBJECTS CRUSADE_ANCHOR.INI (cost from the data)
  crusader: euro.crusader
  crusadeSize: 5                      # ⚠ HYPOTHESIS (UNK-26): crusaders raised at the anchor
  crusadeAnchorRadiusTiles: 4         # TDD GAME-11: anchor <= 4 tiles from the cathedral
  crusadeCooldownMs: 60000            # UNVERIFIED (1.09: a cooldown after the crusaders die)
  # GAME-07 projectiles (speeds, homing and splash are UNVERIFIED, UNK-22; strategy guide: peasants step away from
  # catapult stones "just as the projectiles are about to land", so stones land where the target stood).
  projectiles:
    arrow: { pixelsPerSecond: 400, homing: true }
    bolt: { pixelsPerSecond: 480, homing: true }
    stone: { pixelsPerSecond: 200, homing: false, hitRadiusPx: 24, splashRadiusPx: 32, splashPercent: 50 }
    cannon: { pixelsPerSecond: 320, homing: false, hitRadiusPx: 20, splashRadiusPx: 24, splashPercent: 50 }
    rocket_arrow: { pixelsPerSecond: 360, homing: true, splashRadiusPx: 16, splashPercent: 50 }
    magic: { pixelsPerSecond: 320, homing: true }
    flame_ball: { pixelsPerSecond: 280, homing: true, splashRadiusPx: 16, splashPercent: 50 }
    freeze_bolt: { pixelsPerSecond: 320, homing: true }
    flame_bolt: { pixelsPerSecond: 320, homing: true }

# ---- spells (GAME-11, ADR 0095) -----------------------------------------------------------------------------------
# Which caster has which spell and which technology unlocks it come from the data (command cards, TECHTREE [orders]);
# the spells themselves are rules entries keyed by their order (the data only names them).
# Every magnitude below is UNVERIFIED (UNK-26). Ranges and radii in tiles; amounts by effect (damage / healing / bonus
# percent / experience); summons pay the summoned type's mana and resource cost on top of the spell's mana.
spell_heal: { new: true, Spell: { effect: heal, amount: 40, mana: 10, range: 6, cooldownMs: 1500, castMs: 500, targets: { category: unit } } }
spell_bless: { new: true, Spell: { effect: bless, amount: 25, durationMs: 30000, mana: 30, range: 6, cooldownMs: 3000, castMs: 500, targets: { category: unit } } }
spell_lightning: { new: true, Spell: { effect: damage, amount: 40, mana: 30, range: 10, cooldownMs: 3000, castMs: 500 } }
spell_freeze: { new: true, Spell: { effect: freeze, durationMs: 10000, mana: 40, range: 10, cooldownMs: 5000, castMs: 500, projectile: freeze_bolt, targets: { category: unit } } }
spell_cloak: { new: true, Spell: { effect: cloak, durationMs: 30000, mana: 40, range: 6, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }
spell_spawnbat: { new: true, Spell: { effect: summon, summon: comm.bat, range: 2, cooldownMs: 2000, castMs: 500 } }
spell_spawnstonegolem: { new: true, Spell: { effect: summon, summon: comm.troll, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_spawndragon: { new: true, Spell: { effect: summon, summon: comm.dragon, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_spawncarpet: { new: true, Spell: { effect: summon, summon: comm.carpet, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_spawnjin: { new: true, Spell: { effect: summon, summon: comm.jinn, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_firerain: { new: true, Spell: { effect: areaDamage, amount: 10, radius: 2, durationMs: 5000, pulseMs: 1000, mana: 50, range: 12, cooldownMs: 5000, castMs: 500 } }   # manual: hits own units too
spell_whirlpool: { new: true, Spell: { effect: areaDamage, affects: enemy, amount: 30, radius: 2, durationMs: 6000, pulseMs: 1000, mana: 50, range: 12, cooldownMs: 5000, castMs: 500, targets: { locomotor: ship } } }   # manual: "to destroy ships"
spell_flamebolt: { new: true, Spell: { effect: damage, amount: 30, mana: 25, range: 10, cooldownMs: 2000, castMs: 500, projectile: flame_bolt } }
spell_turntostone: { new: true, Spell: { effect: stone, durationMs: 15000, mana: 50, range: 8, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }
spell_berserk: { new: true, Spell: { effect: confuse, durationMs: 15000, mana: 50, range: 8, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }   # manual: Confusion, "hostile to all"
