# The `classic` ruleset (TDD §11.3, DEC-06): v1.10 behaviour of the GOG reference build.
#
# This file holds NO original data. The numbers (costs, times, hit points, attack, defence, sight, range, speed, rate,
# population, footprints, resource amounts, starting resources, damage bonuses, technology and upgrade costs and times,
# technology trees, what each building researches) are read from the user's own imported tables (`legacy:` below;
# ADRs 0032, 0040). What this file adds is the mapping of those tables onto traits, and the constants and effects the
# tables do not contain.
#
# Values marked `UNVERIFIED (UNK-nn)` are placeholders: not in any original table and not yet measured in the running
# game. They are listed with their unknowns in docs/mechanics/m2-placeholders.md and docs/mechanics/m3-placeholders.md
# and get replaced by capture facts (`t2 fidelity`, ADR 0030). Do not tune them for balance: replace them with
# measurements.
#
# Format (ADR 0031): top-level keys are the sections below or entries. `^Name` entries are templates; `inherits` lists
# templates; `-Trait:` removes an inherited trait; `field+=`/`field-=` append to/remove from inherited lists. A patch
# must name an existing entry; a new one says `new: true`. Imported entries inherit `^Unit`/`^Building`/`^Resource`,
# then `^class.<class>` and `^<civ>.<class>` when they exist.

ruleset:
  name: classic
  maxPlayers: 8
  occupancyCellsPerTileAxis: 2        # UNVERIFIED (UNK-11): unit packing per tile
  corpseTtlMs: 120000                 # REQ-PATH-08 default; UNVERIFIED corpse lifetime of the original
  decalCap: 4000
  hudResources: [food, wood, stone, gold]   # GAME-01: iron exists in the data but not in the HUD (UNK-14)

# GAME-01. Resource type ids are positions in this list. Iron exists in the data (RES.INI, te_ironplus) but not in the
# HUD (UNK-14). Mana is per caster (trait ManaPool), not a stockpile.
resources: [food, wood, stone, gold, iron]

gameplay:
  # Owner decision for M2: a group move travels at its slowest member's speed in both rulesets until UNK-12 is captured
  # (ADR 0024 question).
  groupMoveSpeed: slowest             # VERIFIED (capture-20261019-221300, group-speed: knight 72 + pikeman 40 px/s walked 40 together)
  populationLimit: 200                # VERIFIED (capture-20261018-024524, smoke/plain setup screen): the setup screen's default
  startingResources: legacy           # RES.INI [Low]/[Medium]/[High] (lobby STARTING RESOURCES)
  defaultStartingResources: medium    # UNVERIFIED: the lobby's default level
  # Compile-time conversions of table columns.
  # Only for types with neither a measured Mobile.pixelsPerSecond nor a walk sheet stride (ADRs 0172, 0190).
  speedPixelsPerSecondPerPoint: 10    # UNVERIFIED (UNK-12): px/s per SPEED point
  attackCycleMs: 6000                 # UNVERIFIED (UNK-07): time between hits = attackCycleMs / RATE
  hitDelayPercent: 50                 # UNVERIFIED (UNK-07): hit frame at this share of the cycle, for types whose attack
                                      # animation does not mark it (IMAGES.INI actionrow gives the others, WAR-014)
  manaRegenPerMinute: 60              # UNVERIFIED (UNK-26): mana a caster regains per minute
  # Combat and work constants.
  minimumDamage: 1                    # UNVERIFIED (UNK-08)
  resistanceScale: 1000               # UNVERIFIED (UNK-08): building damage x 1000 / (1000 + RESISTANCE) (manual ch. 4); owner
                                      # decision: 100 made castles (1000) practically immune to melee; capture uses RESISTANCE alone
  meleeReachPx: 8                     # UNVERIFIED (UNK-07/11): edge-to-edge reach of hand-to-hand attacks
  interactionReachPx: 32              # UNVERIFIED (UNK-17/18): worker reach to a node, drop-off or site, once stopped
  interactionTouchPx: 12              # UNVERIFIED (UNK-17/18): the same while still walking there: units go up to the wall
                                      # (owner play-test 2026-10-20: they stood a tile away from what they worked on)
  acquireIntervalMs: 200              # UNVERIFIED: target scan cadence of idle armed units
  nodeSearchRadiusTiles: 12           # UNVERIFIED (UNK-17): where a worker looks for the next node of a resource
  queueCapacity: 24                   # different items queued per building at once; any number of each (ADR 0180)
  constructionRefundPercent: 100      # BLD-020 (ReTzar, 0x41d6a8): all of it before any work, then half of what is left to build
  productionRefundPercent: 100        # UNVERIFIED: refund of a cancelled queued unit
  researchRefundPercent: 100          # UNVERIFIED: refund of a cancelled research or upgrade
  # GAME-03: repair, fire, ruins, walls, gates (ADR 0043).
  repairTimePercent: 400              # VERIFIED (BLD-022, batch J 2026-10-21): a repairer's blow restores max x blow /
                                      # (build time x 4), rounded down: 6 for the mill (800 / TIME 30), 5 for the barracks
                                      # (1400 / 60), 16 for the castle (8000 / 120); one repairer takes ~4x the build time
  repairBlowMs: 1250                  # VERIFIED (BLD-022, batch J): one blow per repairer every 1.25 s (the time unit)
  burnThresholdPercent: 50            # UNVERIFIED (UNK-42): buildings below this share of their hit points burn
  burnDamagePerMinute: 60             # UNVERIFIED (UNK-42): hit points a burning building loses per minute
  wallContinueRadiusTiles: 6          # UNVERIFIED: builders move on to the next segment of a dragged wall within this
  maxWallSegments: 64                 # UNVERIFIED: most segments one dragged wall places
  idleWorkAfterMs: 10000              # UNVERIFIED: an idle peasant finds work by itself after this (owner: the original's did)
  idleWorkRadiusTiles: 12             # UNVERIFIED: where an idle peasant looks for a site, a repair or a resource
  repairCostPercent: 0                # VERIFIED (BLD-022, batch J): repairs cost nothing (the stockpiles did not move)
  repairerFalloffPercent: 0           # VERIFIED (BLD-022, batch J): every repairer strikes full blows (seven helpers
                                      # restored ~31 HP/s on the mill, 6 HP per blow each)
  disguiseMasteryMs: 125000           # VERIFIED (MAG-021, batch J 2026-10-21: one point per 1.25 s): a spy's disguise meter
                                      # fills (0 -> 100) in this long in one look
  unmaskReachFreshPercent: 400        # MAG-012 (the owner: 4 tiles at a meter of 8; batch J run 10 about 3.4): how close, in
                                      # % of a tile, a spy of the copied kingdom must come in front of an empty meter's disguise
  unmaskReachFullPercent: 100         # ... and of a full one (batch J run 10: right next to it); in between in proportion
  gateOpenReachPx: 32                 # UNVERIFIED: an automatic gate opens for its owner's units this close
  gateCloseReachPx: 64                # UNVERIFIED: ... and closes when none is this close (hysteresis)
  gateChangeIntervalMs: 1000          # UNVERIFIED: least time between two changes of one gate (owner decision)
  maxGateChangesPerTick: 4            # engine bound: gate changes applied per tick (the rest wait); 16 cost 15 ms p99 (review)
  # GAME-04: capture (ADR 0044; ⚠ HYPOTHESIS UNK-19 for the EMIT influence).
  capturePointsPerSecond: 10          # UNVERIFIED (UNK-19): capture points per capturing peasant per second
  minimumCaptureResistance: 1         # UNVERIFIED (UNK-19)
  captureResetMs: 5000                # UNVERIFIED (UNK-19): progress is lost after this long without a capturer
  influenceRadiusTiles: 16            # UNVERIFIED (UNK-19): EMIT fades linearly to 0 at this distance

# World systems (M3 stream F, ADRs 0100-0106; docs/mechanics/m3-placeholders.md, stream F). Nothing here is in an original
# table except where noted; every value is UNVERIFIED until captured.
world:
  # GAME-12 fog and visibility (ADR 0101).
  defaultSightTiles: 2                # UNVERIFIED: sight of a kingdom's unit or building whose table row has none
  nightSightPercent: 100              # UNVERIFIED (UNK-09): sight at night (100 = night does not change sight)
  memoryRefreshTicks: 4               # engine: a seen structure's last-seen state is refreshed every 4 ticks (staggered)
  # GAME-13 diplomacy (ADR 0102).
  diplomacyChangeIntervalMs: 10000    # engine bound (anti flip-flop): least time between two changes towards one kingdom
  tributeIntervalMs: 1000             # engine bound: least time between two tributes of one kingdom
  maxTributeAmount: 100000            # engine bound: most of one resource in one tribute
  stockpileCap: 1000000000            # engine bound: overflow guard of every stockpile
  # GAME-14 trade and tavern (ADR 0103; UNK-28).
  tradeProfitPerTileBasisPoints: 100  # UNVERIFIED (UNK-28): profit per tile between the docks (1% of the load per tile)
  tradeMinDistanceTiles: 8            # UNVERIFIED: closer docks give no profit (anti trade loop)
  tradeMaxProfitPercent: 300          # UNVERIFIED: most profit of one delivery
  tradeDockMs: 2000                   # UNVERIFIED: time to unload and load at a dock
  convertRatio: 10                    # manual ch. 5 §7: "you give ten times more than you receive"
  gambleOdds: [2, 3, 5, 10]           # UNVERIFIED (UNK-28): the proportions a player may choose
  gambleHouseEdgePercent: 10          # UNVERIFIED (UNK-28): win chance = (1 - edge) / odds
  maxGambleStake: 10000               # engine bound
  loanStartAmount: 1000               # manual ch. 5 §10: the first loan is 1,000
  loanStepAmount: 200                 # manual ch. 5 §10: then 1,200
  loanGrowDelayMs: 120000             # UNVERIFIED (UNK-28): "after some time"
  loanInterestPercent: 0              # UNVERIFIED (UNK-28): the manual names no interest
  # GAME-15 gateways and nature (ADR 0104).
  claimReachPx: 16                    # UNVERIFIED: a touch claims a gateway or a wild cow from this close
  claimIntervalMs: 500                # engine: claim scan cadence
  guardRadiusTiles: 10                # UNVERIFIED: guarding Nature units return home beyond this
  wanderRadiusTiles: 6                # UNVERIFIED: animals wander this far from home
  wanderIntervalMs: 8000              # UNVERIFIED: mean time between two wander moves
  # GAME-16 day/night and weather (ADR 0105; UNK-09, UNK-32).
  # The clock globe is a 24-hour clock (24 frames) that steps once per game hour, every 93.7 s (capture-20261019-195053,
  # day-clock: 8 steps from 10:00 to 18:00; ADR 0173). The night's hours were not seen; they are assumed as long.
  dayLengthMs: 2250000                # VERIFIED (UNK-32): 24 hours of 93.75 s
  dayStartMinute: 600                 # VERIFIED (same capture): the globe shows 10:00 when a match starts
  nightStartMinute: 1140              # UNVERIFIED: night from 19:00
  nightEndMinute: 360                 # UNVERIFIED: to 06:00
  weatherPeriodMs: 180000             # UNVERIFIED (UNK-09): weather comes and goes in 3-minute periods
  weatherChancePercent: 25            # UNVERIFIED: share of periods with weather
  weather: { grass: rain, summer: rain, snow: snow, desert: clear }   # the rain/snow flags of <SET>.TERRAIN.INI (structural facts)
  # GAME-17 victory and scoring (ADR 0106; UNK-29).
  scoreGatherDivisor: 10              # UNVERIFIED (UNK-29): 1 point per 10 resources gathered
  scoreKillDivisor: 10                # UNVERIFIED (UNK-29): 1 point per 10 resources of value killed or destroyed
  scoreBuildDivisor: 10               # UNVERIFIED (UNK-29): 1 point per 10 resources of value built or trained
  scorePerTechnology: 100             # UNVERIFIED (UNK-29)
  victoryIntervalTicks: 20            # engine: victory is evaluated once per second
  deathmatchStartingResources: high   # UNVERIFIED: a Deathmatch starts every kingdom on the High level
  # GAME-19 cheats (UNK-30).
  cheatSmallResources: 2000           # UNVERIFIED (UNK-30): hmdvaleva
  cheatLargeResources: 5000           # UNVERIFIED (UNK-30): hmpetleva
  # GAME-14 tavern hiring (ADR 0108; manual ch. 6: Mercenaries "small groups of soldiers", Heroes' Quest, Fame "more,
  # and better, mercenaries who will be cheaper and more experienced"; MENU.INI [tavern_merc]/[tavern_hero] are filled
  # by the game at run time, so the offers below are ours).
  tavernRefreshMs: 120000             # UNVERIFIED (UNK-28): the offers change every 2 minutes
  mercenaryOffers: 3                  # UNVERIFIED (UNK-28): mercenary groups offered at a time
  heroOffers: 1                       # UNVERIFIED (UNK-28): heroes offered at a time
  mercenaryGroupMin: 3                # UNVERIFIED (UNK-28): "small groups"
  mercenaryGroupMax: 5                # UNVERIFIED (UNK-28)
  mercenaryCostPercent: 150           # UNVERIFIED (UNK-28): of the soldiers' training cost
  heroCostPercent: 600                # UNVERIFIED (UNK-28): of the hero's type's training cost
  mercenaryLevel: 1                   # UNVERIFIED (UNK-23): mercenaries' starting level
  fameGroupBonus: 1                   # UNVERIFIED (UNK-28): Fame "more"
  fameLevelBonus: 2                   # UNVERIFIED (UNK-23): Fame "more experienced"
  fameCostPercent: 75                 # UNVERIFIED (UNK-28): Fame "cheaper"

# Terrain types of the M2 test maps (the terrain-set conversion of §9.1 replaces this list with the original sets).
terrain:
  - { key: grass, passable: [foot, mounted, large, air] }
  - { key: water, passable: [ship, air], water: true }

legacy:
  # Table prefixes: DATA/<civ> UNITS.TXT, DATA/<civ> BUILDINGS.TXT; also the `[civ]` sections of OBJECTS/*.INI.
  civilizations: [euro, asia, arab, comm]
  # Every unit and building of the tables (M3: GAME-01...06). Classes in both tables (towers) are buildings that take
  # their armament and hit points from the unit table.
  units: all
  buildings: all
  # Cost suffixes (GAME-01; "m" = mana is paid by the caster, not from the stockpile).
  costSuffixes: { f: food, w: wood, s: stone, g: gold, i: iron, m: mana }
  # Producer column of the unit tables -> building class (common units are trained in every civilization's building).
  producers: { Gate: magicgateway, Castle: castle, Barracks: barrack, Workshop: workshop, Harbor: harbor, "Mage Tower": magetower, Cathedral: cathedral, Mosque: mosque, Market: market, Farm: farm, Monastey: shaolinn, "War Guild": academy }
  # Resource nodes: amount from RES.INI [Others]. Fish patches sit on water and have no footprint (ADR 0042).
  resourceNodes:
    res_gold: { resource: gold, amount: golden rocks }
    res_stone: { resource: stone, amount: rocks }
    fishpatch: { resource: food, amount: fish patch, footprint: false }
  # ⚠ HYPOTHESIS (ADR 0042): cows keep their milk as max_manna; it becomes the food they hold.
  milkClasses: [cow]
  # Technology trees per civilization: [depend] prerequisites, [required] buildings, [orders] gated orders (ADR 0040).
  techTrees: { euro: "data/techtree euro.ini", asia: "data/techtree asia.ini", arab: "data/techtree arab.ini" }
  # Starting-resource levels -> RES.INI sections.
  startingResources: { low: Low, medium: Medium, high: High }
  # Civilization prefixes of class names in BONUS.INI.
  bonusCivPrefixes: { e: euro, a: asia, r: arab }
  # GAME-10 (ADR 0094): item object classes -> item kind (OBJECTS/ITEM*.INI; armor shares the generic ITEM class, see
  # comm.item_armor); who may carry each comes from its [enter] list. ITEM_PLUSPLUS is the power item (ADR 0186): the
  # original's maps give its swords and bows an attack and its shields a defence.
  items: { item: weapon, item_flag: flag, item_health: potion, item_magic: spellbook, item_plusplus: weapon, item_scroll: scroll, item_soul: soul, resitem: resource }
  # GAME-11: objects outside the tables imported with their cost and fog_range (crusade anchor, magic vision's revealer).
  objects: [CrusadeAnchor, fog_revealer]
  # Hash of what the compiler reads from the tables of the clean reference build; another value means a modified
  # installation (a warning in the import and ruleset reports, not an error). Changes with the lists above and with the
  # importer's output: re-pin it from the local-only tests (TZAR2_ORIGIN) whenever those change. Re-pinned 2026-10-20 on a
  # clean GOG v1.10 EN install (2,916/2,916 files identical): the pin had not followed the importer since #24 (TIME in
  # 1.25-s units, #61, among others) because nobody ran the local-only tests. Re-pinned 2026-10-22: the importer gives
  # armaments the hit frame of their attack animation (WAR-014); the pin had drifted again before that (E716BE64DED8009D).
  # Then (ITEM-016) ITEM_PLUSPLUS is imported as a weapon, the power item; then (WORLD-015) land units get a body from
  # their object box.
  referenceEdition: GOG v1.10 EN
  referenceDataHash: "D13ECBADA7B58867"

# ---- templates ---------------------------------------------------------------------------------------------------

^Unit:
  Mobile: { locomotor: foot }
  # WORLD-015: the importer gives each land unit a body of 7/16 of its IMAGES.INI object box (14 px for 32 x 32, batch K);
  # radius here is for types without one. terrain: the footprint units slide along walls with (UNVERIFIED, UNK-11).
  Collision: { radius: 7, terrain: 7 }
  CorpseOnDeath: {}
  PopulationCost: { amount: 1 }       # GAME-05: 1 population per unit in classic
  Experience: {}                      # GAME-08: units gain experience in combat (manual ch. 5 §2.1)

^Building:
  Armor: { defence: 0 }               # RESISTANCE (from the table) reduces damage instead, see gameplay.resistanceScale
  Repairable: {}                      # GAME-03: peasants repair buildings
  Burnable: {}                        # GAME-03: badly damaged buildings burn (threshold and damage UNVERIFIED, UNK-42)
  RuinOnDeath: {}                     # GAME-03: ruins (a decal that never blocks, ORIG-01)

^Resource: {}

^Cavalry:
  Mobile: { locomotor: mounted }
  Collision: { radius: 10, terrain: 10 }   # UNVERIFIED (UNK-11)

^Ship:
  Mobile: { locomotor: ship }
  Collision: { radius: 16 }           # UNVERIFIED (UNK-11)
  Repairable: {}                      # GAME-03: peasants repair ships (manual ch. 5)
  -CorpseOnDeath:                     # ships sink

^Siege:
  Mobile: { locomotor: large }
  Collision: { radius: 12, terrain: 12 }   # UNVERIFIED (UNK-11)
  Repairable: {}                      # GAME-03: peasants repair siege weapons (manual ch. 5)
  -CorpseOnDeath:

# Walking speeds (UNK-12, ADR 0172). The original ignores the SPEED column for walking: measured in both directions
# (capture-20261019-163231 and -190321, r² ≥ 0.99), every foot class walks 40 px/s whatever its SPEED (2-4), knights and
# crusaders 72, trolls 47, ghosts 67 (66.6), cows and bears 26 (25.7); the speed follows the stride of the walk sheet
# (IMAGES.INI move_len 50, 85, 56, 80, 32). Measured classes set Mobile.pixelsPerSecond (VERIFIED); the others walk by
# the original's rule for the stride the importer reads (Mobile.stride: a pixel every (32000 / move_len) >> 5 of its ms,
# 1.25 of ours; ReTzar's reading of the original, ADR 0190), and only what has no stride by SPEED x
# gameplay.speedPixelsPerSecondPerPoint (UNVERIFIED).
^class.footman: { Mobile: { pixelsPerSecond: 40 } }    # VERIFIED (ADR 0172)
^class.maceman: { Mobile: { pixelsPerSecond: 40 } }    # VERIFIED (ADR 0172)
^class.pikeman: { Mobile: { pixelsPerSecond: 40 } }    # VERIFIED (ADR 0172)
^class.dwarf: { Mobile: { pixelsPerSecond: 40 } }      # VERIFIED (ADR 0172)
^class.ork: { Mobile: { pixelsPerSecond: 40 } }        # VERIFIED (ADR 0172)
^class.troll: { Mobile: { pixelsPerSecond: 47 } }      # VERIFIED (ADR 0172)

# Peasants (manual §5.4: build, repair, capture, harvest...).
^class.peon:
  Mobile: { pixelsPerSecond: 40 }    # VERIFIED (ADR 0172)
  Armament: { autoAcquire: false }    # UNVERIFIED: idle peasants do not start fights
  Builder: { civilizations: [own, comm] }
  Capturer: {}                        # GAME-04
  Briber: {}                          # GAME-11: order bribe (Bribery)
  BribeImmune: {}                     # TDD GAME-11: peasants cannot be bribed
  Harvester:
    capacity: 10                      # UNVERIFIED (UNK-17)
    # Measured once and applied to every resource (ADR 0174): a peasant chopped a load of 10 wood in ~9.0 s
    # (capture-20261019-232318, gather-rate burst: chopping from ~41.3 s, the log carried off at 50.3 s; ADR 0175)
    gatherMs: { food: 900, wood: 900, stone: 900, gold: 900, iron: 900 }   # per unit

^class.fishing_boat:
  inherits: [^Ship]
  Armament: { projectile: arrow }     # UNVERIFIED (UNK-22)
  Harvester:
    capacity: 20                      # UNVERIFIED (UNK-17)
    gatherMs: { food: 1000 }          # UNVERIFIED (UNK-17)
^class.galleon: { inherits: [^Ship], Trader: { capacity: 200, access: water, technology: te_traderoutes }, Armament: { damage: cannon, projectile: cannon } }   # UNVERIFIED (UNK-28, UNK-22)
^class.hulk: { inherits: [^Ship], Trader: { capacity: 150, access: water, technology: te_traderoutes }, Armament: { damage: cannon, projectile: cannon } }      # UNVERIFIED (UNK-28, UNK-22)
^class.xebec: { inherits: [^Ship], Trader: { capacity: 100, access: water, technology: te_traderoutes }, Armament: { projectile: arrow } }     # UNVERIFIED (UNK-28); BONUS.INI arrow_attack lists xebecs
^class.catapult: { inherits: [^Siege], Armament: { damage: cannon, projectile: stone } }    # UNVERIFIED (UNK-22): stones land where the target stood
^class.hcatapult: { inherits: [^Siege], Armament: { damage: cannon, projectile: stone } }   # UNVERIFIED (UNK-22)
^class.ballista: { inherits: [^Siege], Armament: { projectile: bolt } }                     # UNVERIFIED (UNK-22)

# The tables give armored chariots and caravans no SPEED.
^class.chariot: { Mobile: { speed: 4 }, Armament: { rate: 3 } }   # UNVERIFIED (UNK-12, UNK-07): the tables give armored chariots no SPEED and no RATE
^class.trader:                             # caravans: cycle between two markets (GAME-14, ADR 0103)
  Mobile: { speed: 4 }                     # UNVERIFIED (UNK-12)
  Trader: { capacity: 100, access: land, technology: te_traderoutes }
# TRADE-004 (ReTzar's reading of the original, 0x4e8060): the load per trip is 500 for European caravans, 300 for Arabian
# ones and 100 for Asian peasants, who trade instead of caravans (MENU.INI [a_peon] trade; TECHTREE ASIA trade).
^euro.trader: { Trader: { capacity: 500 } }
^arab.trader: { Trader: { capacity: 300 } }
^asia.peon: { Trader: { capacity: 100, access: land, technology: te_traderoutes } }

^class.knight: { inherits: [^Cavalry], Mobile: { pixelsPerSecond: 72 } }    # VERIFIED (ADR 0172)
^class.heavy_cavalry: { inherits: [^Cavalry] }
^class.horse_samurai: { inherits: [^Cavalry] }

# Cows (GAME-02): peasants milk them (the food they hold regrows) and butcher them for meat; Arab peasants steal enemy
# cows after Cow Poaching (manual ch. 6).
^class.cow:
  Mobile: { pixelsPerSecond: 26 }    # VERIFIED (ADR 0172)
  ResourceNode:
    regenMs: 4000                     # UNVERIFIED (UNK-17): milk regrows one unit per 4 s
    gatherMs: 200                     # UNVERIFIED (UNK-17): milking time per unit; batch B bounds it (a 50-unit trip, walk included, took 10.6 s; ADR 0170)
    carry: 50                         # VERIFIED (batch B, capture-20261018-222649): a peasant brings 50 food per trip from a cow (ADR 0170)
    keepWhenEmpty: true
  SpawnOnDeath: { type: comm.meat }
  Capturable: { instant: true, technology: te_cowpoaching }
  ClaimOnTouch: { by: any }           # UNVERIFIED: a wild (Nature) cow joins the first kingdom whose unit touches it (GAME-15)
  Animal: { wanders: true }           # UNVERIFIED: wild cows wander around their spot
^class.bear:
  Mobile: { pixelsPerSecond: 26 }    # VERIFIED (ADR 0172)
  Animal: { wanders: true, guards: true }   # UNVERIFIED: bears roam their area and return when lured away
# Magic gateways (manual ch. 5 §4.4.2): neutral until a military unit touches them; they summon dwarves, orcs, ghosts and
# skeletons (producer column "Gate"; ghosts and skeletons by the gateway's command card, MENU.INI [magic_gateway]).
^class.magicgateway:
  ClaimOnTouch: { by: military }
  -Burnable:
  -RuinOnDeath:
^class.ghost: { Producible: { by: [comm.magicgateway] }, Mobile: { pixelsPerSecond: 67 }, Banshee: {} }    # speed VERIFIED (ADR 0172); WAR-009
# WAR-010 (ReTzar's reading of the original, 0x4ef200): freeze, stone, confusion, hypnosis and the curse do not take on the
# campaign's Messiah.
^class.messiah: { MagicImmune: {} }
^class.skeleton: { Producible: { by: [comm.magicgateway] }, Mobile: { pixelsPerSecond: 40 } }    # speed VERIFIED (ADR 0172)
# Trade docks and the tavern (GAME-14, ADR 0103).
^class.market: { TradeDock: { access: land } }
^class.tavern: { Tavern: {} }
# Spies and ninjas see cloaked units near them (GAME-12; radius UNVERIFIED).
# The owner (2026-10-21): a spy copies any man of any civilization, from next to him, but no machine, flyer or magic
# creature; fighting keeps the disguise; another kingdom's spy close by unmasks it (MAG-012, ADR 0184).
^class.spy: { Detector: { radius: 5 }, Impersonator: { never: [machines, ships, magic_creatures], except: [mage] }, Mobile: { pixelsPerSecond: 40 } }    # speed VERIFIED (ADR 0172)
^class.ninja: { Detector: { radius: 5 } }

# Drop-offs (GAME-02; manual §5.4.1.2 and ch. 6: castle stores all resources, farm food, lumbermill wood; storage per
# civilization; the harbor stores fish). Lumber mills and storages send their builders gathering (1.05).
^class.castle:
  DropOff: { resources: [food, wood, stone, gold, iron] }
  ProtectedDelete: {}                 # GAME-04: Shift + Del
  Holder: { healPerMinute: 120 }      # UNVERIFIED (UNK-24): garrisoned units "heal themselves quickly" (strategy guide)
^class.farm:
  DropOff: { resources: [food] }
^class.lumber:
  DropOff: { resources: [wood], autoGather: true }
# The owner (2026-10-21): every civilization's storage takes gold and stone, as the lumber mill takes wood (the
# manual's per-civilization lists and its iron are not the game's; ECO-014).
^class.storage:
  DropOff: { resources: [stone, gold], autoGather: true }
^class.harbor:
  DropOff: { resources: [food], access: [water] }   # UNVERIFIED: only boats deliver here
  Building: { placement: coast }
  TradeDock: { access: water }        # GAME-14: ships trade between harbors

# Guilds are deletable only with Shift + Del (GAME-04).
^class.cathedral: { ProtectedDelete: {}, CrusadePreacher: {} }   # GAME-11: crusades are preached at the cathedral
^class.mosque: { ProtectedDelete: {} }
^class.shaolinn: { ProtectedDelete: {} }
^class.magetower: { ProtectedDelete: {} }
^class.tcguild: { ProtectedDelete: {} }
^class.academy: { ProtectedDelete: {} }

# Fields produce unlimited food (manual §5.5) and need constant care: neglected, they decay and disappear.
^class.field:
  ResourceNode: { resource: food, amount: unlimited, workers: 1 }   # help HT_TEND_FIELDS: only one peasant tends each field (ECO-021)
  WalkableFootprint: {}               # UNVERIFIED: units walk over fields and the farmer works on the field (play-test 2026-10-20)
  DropOff: { autoGather: true }       # UNVERIFIED: the builder starts farming the new field
  Decay: { afterMs: 60000, healthPerMinute: 30 }   # UNVERIFIED (UNK-17)
  -Burnable:
  -RuinOnDeath:

# Walls are dragged as lines; gates open; bridges carry land units over water (GAME-03, ADR 0043).
^class.wall_wood:
  Wall: {}
  -Burnable:
  -RuinOnDeath:
^class.wall_stone:
  Wall: {}
  -Burnable:
  -RuinOnDeath:
# A gate's cells are those of its drawbridge picture (gw0_anim 7 x 1, gw2_anim 1 x 6); its door is the middle three across
# and the three below the top down (ReTzar's reading of the original, 0x456210, 0x4576bc; CTRL-024).
^class.gate_wood:
  Gate: { passage: ["0011100"], turnedPassage: ["0", "1", "1", "1", "0", "0"] }
  -Burnable:
^class.gate_stone:
  Gate: { passage: ["0011100"], turnedPassage: ["0", "1", "1", "1", "0", "0"] }
  -Burnable:
^class.bridge:
  Building: { placement: bridge }
  Bridge: {}
  -Burnable:
  -RuinOnDeath:

# ---- GAME-07...11: combat, experience, holders, items, magic (ADRs 0090-0095) ----------------------------------------
# Projectiles per shooter (TDD §10 GAME-07: arrow, bolt, cannon, rocket arrow, stone). Which unit fires which is not in
# a table: the BONUS.INI group arrow_attack names the arrow shooters; the rest follows the manual's descriptions.
^class.archer: { Armament: { projectile: arrow }, Mobile: { pixelsPerSecond: 40 } }    # speed VERIFIED (ADR 0172)
^class.longbowman: { Armament: { projectile: arrow }, Mobile: { pixelsPerSecond: 40 } }    # speed VERIFIED (ADR 0172)
^class.horse_archer: { Armament: { projectile: arrow } }
^class.tower_wood: { Armament: { projectile: arrow } }
^class.tower_wood2: { Armament: { projectile: arrow } }
^class.tower_stone: { Armament: { projectile: arrow } }
^class.tower_stone2: { Armament: { damage: cannon, projectile: cannon } }        # cannon tower
^class.tower_rocket: { Armament: { damage: cannon, projectile: rocket_arrow } }  # UNVERIFIED (UNK-22)
^class.mage: { Armament: { projectile: magic }, Mobile: { pixelsPerSecond: 40 } }    # UNVERIFIED: the mage's bolt (OBJECTS MAGIC); speed VERIFIED (ADR 0172)
^class.priest: { Armament: { projectile: magic }, Mobile: { pixelsPerSecond: 40 } }    # exorcism (order exorcism = attack); speed VERIFIED (ADR 0172)
^class.dragon: { Armament: { projectile: flame_ball } }                          # UNVERIFIED (OBJECTS FLAME_BALL)
^class.crusader: { BribeImmune: {}, Mobile: { pixelsPerSecond: 72 } }    # TDD GAME-11: crusaders cannot be bribed; speed VERIFIED (ADR 0172)
^class.dummy:
  TrainingDummy: {}                   # GAME-08: training against dummies (Tactics); they take no damage
  -Burnable:
  -RuinOnDeath:
^class.outpost:
  Holder: { healPerMinute: 120 }      # UNVERIFIED (UNK-24): "units garrisoned ... heal themselves quickly" (strategy guide)
^class.jihad_warrior:
  ConvertsFrom: { classes: [peon], order: become_jihadw }   # manual ch. 5: Jihad warriors are made from peasants
  Armament: { rate: 3 }               # UNVERIFIED (UNK-07): the table gives an ATTACK but no RATE
^euro.priest: { Armament: { rate: 2 } }   # UNVERIFIED (UNK-07): RATE 0 in the table, but priests attack (exorcism)
^arab.priest: { Armament: { rate: 2 } }   # UNVERIFIED (UNK-07): no RATE in the table
^class.carpet:
  Mobile: { locomotor: air, speed: 5 }    # UNVERIFIED (UNK-12): the table gives magic carpets no SPEED
  Collision: { radius: 12 }               # UNVERIFIED (UNK-11)
^asia.priest:
  ConvertsFrom: { classes: [monk], order: become_priest }   # TDD E.2: Asian priests from monks
^class.magicworkshop:
  # manual ch. 5 §6.1; the panel's three kinds (STRINGS3 book_itm, potion_itm, power_itm), each with its items (ITEM-016)
  ItemCrafter: { items: [comm.item_health, comm.item_magic, comm.item_plusplus] }
^Item: {}

# ---- entries not in the unit/building tables ----------------------------------------------------------------------

# One tree per tile (§9.1). Trees come from the terrain sets (TREES.INI), which hold no amount.
comm.tree:
  new: true                           # not in the tables: a new entry (ADR 0031)
  inherits: [^Resource]
  Legacy: { class: tree, civ: comm }
  Building: { width: 1, height: 1 }
  ResourceNode: { resource: wood, amount: 100 }   # UNVERIFIED (UNK-17): wood per tree

# Meat left by a slaughtered cow (GAME-02): a footprint-less pile that rots (never blocks, ORIG-01/05).
comm.meat:
  new: true
  inherits: [^Resource]
  Legacy: { class: meat, civ: comm }
  ResourceNode: { resource: food, amount: 100 }   # UNVERIFIED (UNK-17)
  Lifetime: { ms: 120000 }                        # UNVERIFIED (UNK-17)

# Ambient birds (OBJECTS BIRD.INI / EAGLE.INI, teren = 0; not in the tables): they fly around, nobody fights them.
comm.bird:
  new: true
  Legacy: { class: bird, civ: comm }
  Mobile: { locomotor: air, speed: 5 }          # UNVERIFIED
  Health: { max: 10 }                           # UNVERIFIED
  Animal: { wanders: true, ambient: true }
comm.eagle:
  new: true
  Legacy: { class: eagle, civ: comm }
  Mobile: { locomotor: air, speed: 6 }          # UNVERIFIED
  Health: { max: 10 }                           # UNVERIFIED
  Animal: { wanders: true, ambient: true }

# Map decorations that a legacy trigger or conversation refers to (a sign that speaks, ruins that vanish): an inert
# visual object, so the converter keeps them as objects and the references survive (ADR 0121). No footprint, no
# health, no behaviour; the trigger engine may still make it appear, disappear or change owner.
comm.ground_object:
  new: true
  Legacy: { class: ground_object, civ: comm }

# ---- technology effects (GAME-06, ADR 0040) ------------------------------------------------------------------------
# Costs, times, prerequisites and which building researches what come from the tables. The effects are not in any
# table (the original hard-codes them): the manual (ch. 6) says what each technology does; every magnitude below is
# UNVERIFIED (UNK-21). Technologies that only unlock units, buildings, spells or orders need no effect: their trees do
# that. Stats marked (GAME-08/09/11/14) are kept in the modifier tables for the later systems that consume them.

# TECH-006, TECH-010: the gathering technologies raise what a peasant carries, as the help says, not how fast it
# gathers: 10 + 2 for the resource's "plus" technology, + 4 of Irrigation for food (ReTzar's reading of the original,
# 0x4ae720). The bonus goes by the node gathered from; cows keep their own load (ADR 0170).
te_fields: { Technology: { effects: [{ stat: carryCapacity, add: 2, classes: [field] }] } }
te_irrigation: { Technology: { effects: [{ stat: carryCapacity, add: 4, classes: [field] }] } }
te_woodplus: { Technology: { effects: [{ stat: carryCapacity, add: 2, classes: [tree] }] } }
te_stoneplus: { Technology: { effects: [{ stat: carryCapacity, add: 2, classes: [res_stone] }] } }
te_goldplus: { Technology: { effects: [{ stat: carryCapacity, add: 2, classes: [res_gold] }] } }
te_ironplus: { Technology: { effects: [{ stat: carryCapacity, add: 2, classes: [res_iron] }] } }      # UNVERIFIED (UNK-14): no iron rock exists
te_orefloatation: { Technology: { effects: [{ stat: depletion, percent: -50, classes: [res_gold, res_stone] }] } }   # ReTzar: a mine loses half of each load (ADR 0191)
# Technology effects as ReTzar read them from the original's code (ADR 0191; the research handlers at 0x4d33d0):
# Feudalism and Slavery cut a peasant's food to 80 % (0x4d4159); Horsemanship every cost of horse archers and heavy
# cavalry, and Meditation the Asian monk's, to 75 %; Architecture a building's TIME to 70 % (0x4d347e, here a 43 % faster
# rate); Great Wall adds 30 % to the hit points of stone towers, walls and gates; Fanaticism and Buddhism add half to a
# building's resistance (0x4d4064).
te_feudalism: { Technology: { effects: [{ stat: cost, percent: -20, classes: [peon] }] } }
te_slavery: { Technology: { effects: [{ stat: cost, percent: -20, classes: [peon] }] } }
te_horsemanship: { Technology: { effects: [{ stat: cost, percent: -25, classes: [horse_archer, heavy_cavalry] }] } }
te_meditation: { Technology: { effects: [{ stat: cost, percent: -25, classes: [monk], civ: asia }] } }
te_architecture: { Technology: { effects: [{ stat: buildRate, percent: 43, category: building }] } }
te_greatwall: { Technology: { effects: [{ stat: maxHealth, percent: 30, classes: [wall_stone, gate_stone, tower_stone, tower_stone2] }] } }
te_fanaticism: { Technology: { effects: [{ stat: resistance, percent: 50, category: building }] } }
te_budhism: { Technology: { effects: [{ stat: resistance, percent: 50, category: building }] } }
# Supply Storage and Seafood raise the kingdom's population limit by a quarter each (ReTzar, 0x4d3819, 0x4d385a; ADR 0191).
te_supplystorage: { Technology: { effects: [{ stat: populationLimit, percent: 25 }] } }
te_seafood: { Technology: { effects: [{ stat: populationLimit, percent: 25 }] } }
# Weapons and armour (ReTzar, 0x4de7d0 and 0x4de880): Temper Iron and Scimitar +1 attack to hand-to-hand units, Crossbow
# and Chemistry +1 to bows (archers, horse archers, ballistas, xebecs, the arrow towers), Engineering +5 to catapults,
# cannon ships and towers; Kung Fu +1 to peasants; Scale Armor +1 and Chain Mail +2 defence to the units on foot.
te_temperiron: { Technology: { effects: [{ stat: attack, add: 1, damage: sword, category: unit }] } }
te_scimitar: { Technology: { effects: [{ stat: attack, add: 1, damage: sword, category: unit }] } }
te_crossbow: { Technology: { effects: [{ stat: attack, add: 1, damage: arrow }] } }
te_chemistry: { Technology: { effects: [{ stat: attack, add: 1, damage: arrow }] } }
te_engineering: { Technology: { effects: [{ stat: attack, add: 5, classes: [catapult, hcatapult, galleon, hulk, tower_stone2, tower_rocket] }] } }
te_kungfu: { Technology: { effects: [{ stat: attack, add: 1, classes: [peon] }] } }
te_scalearmor: { Technology: { effects: [{ stat: defence, add: 1, classes: [peon, footman, archer, maceman, longbowman, pikeman, monk, ninja, spy, mage, priest, dwarf, ork, enichar, jinn, ghost, jihad_warrior, skeleton] }] } }
te_chainmail: { Technology: { effects: [{ stat: defence, add: 2, classes: [peon, footman, archer, maceman, longbowman, pikeman, monk, ninja, spy, mage, priest, dwarf, ork, enichar, jinn, ghost, jihad_warrior, skeleton] }] } }
te_ridinghorses:
  Technology:
    effects:
      - { stat: attack, add: 2, classes: [horse_archer, heavy_cavalry] }   # ReTzar (ADR 0191)
      - { stat: defence, add: 1, classes: [horse_archer, heavy_cavalry] }
te_concentration: { Technology: { effects: [{ stat: manaRegen, percent: 200, category: unit }] } }   # ReTzar (0x502ea2): 2 a second, +4 (ADR 0191)
# Consumed by GAME-08 (experience), GAME-09 (holders), GAME-11 (spells), GAME-14 (trade/tavern).
te_learning: { Technology: { effects: [{ stat: experienceCap, add: 4, category: unit }] } }          # UNVERIFIED (UNK-23)
te_heroism: { Technology: { effects: [{ stat: experienceCap, add: 1000, category: unit }] } }        # UNVERIFIED (UNK-23): "unlimited"
# te_nobility (Leadership) and te_honor act through combat.leadership* / combat.honor* (GAME-08, ADR 0092).
# Warfare, Tactics and Sun Tzu set the experience a level needs to 70, 50 and 35 % (ReTzar, 0x4d33d0); they come in
# that order, so as gains they add up to 1/0.7, 1/0.5 and 1/0.35 (ADR 0191).
te_warfare: { Technology: { effects: [{ stat: experienceGain, percent: 43, category: unit }] } }
te_tactics: { Technology: { effects: [{ stat: experienceGain, percent: 57, category: unit }] } }
te_suntzubook: { Technology: { effects: [{ stat: experienceGain, percent: 86, category: unit }] } }
te_bodybuilding: { Technology: { effects: [{ stat: healthPerLevel, add: 5, category: unit }] } }     # UNVERIFIED (UNK-23)
te_philosophy: { Technology: { effects: [{ stat: startingLevel, add: 2, classes: [monk, priest] }] } }   # ReTzar: monks and priests start at level 2 (ADR 0191)
te_landingtactics: { Technology: { effects: [{ stat: holderCapacity, percent: 50, groups: [ships] }] } } # help HT_USE_SHIPS: 50 % more units
te_inquisition: { Technology: { effects: [{ stat: attack, add: 5, classes: [priest] }] } }     # ReTzar: +5 (ADR 0191); exorcism is the priests' attack
te_medicine: { Technology: { effects: [{ stat: abilityRange, add: 4, classes: [priest] }] } }        # UNVERIFIED (UNK-26): +4 tiles of spell range
# TECH-023, TECH-024: Trade Taxes and Banking add 2 and 3 to the base 40 of the trade profit (ReTzar's reading of the
# original, K+0x11a): 5 % and 7.5 % more profit (7 here: whole percents).
te_tradetaxes: { Technology: { effects: [{ stat: income, percent: 5, classes: [market] }] } }
# Banking: "increases trade profit" (STRINGS.INI orders_add); the manual says it adds to the treasury over time (TECH-024).
# Income is trade profit by the selling market, so it targets the markets: on the castle it did nothing (2026-10-21).
te_banking: { Technology: { effects: [{ stat: income, percent: 7, classes: [market] }] } }
# Gunpowder (Asian): "increases cannon tower's attack power" (STRINGS.INI orders_add; TECH-013).
te_gunpowder: { Technology: { effects: [{ stat: attack, add: 10, classes: [tower_stone2] }] } }  # ReTzar: +10 (ADR 0191)

# Ship cannon levels (UPGRADES.INI to_ship_level2-6): bought per galleon in order; "the cannons fire more frequently"
# (help HT_UPGRADE_SHIPS; TECH-036): the firing period goes 3000, 2400, 1900, 1500, 1200, 800 (ReTzar's reading of the
# original, 0x4e8f00), so the fire rate 100, 125, 158, 200, 250, 375 %.
comm.galleon:
  Researcher: { upgrades+=: [to_ship_level3, to_ship_level4, to_ship_level5, to_ship_level6] }
to_ship_level2: { Upgrade: { effects: [{ stat: fireRate, add: 25 }] } }
to_ship_level3: { Upgrade: { after: [to_ship_level2], effects: [{ stat: fireRate, add: 33 }] } }
to_ship_level4: { Upgrade: { after: [to_ship_level3], effects: [{ stat: fireRate, add: 42 }] } }
to_ship_level5: { Upgrade: { after: [to_ship_level4], effects: [{ stat: fireRate, add: 50 }] } }
to_ship_level6: { Upgrade: { after: [to_ship_level5], effects: [{ stat: fireRate, add: 125 }] } }

# ---- GAME-07...11 constants (ADRs 0090-0095; docs/mechanics/m3-placeholders.md, stream E) ---------------------------
combat:
  # GAME-08 experience. Manual (ch. 6 Hints): "each experience point adds one point to the attack and half a point to the
  # defense"; strategy guide: "as each experience level is earned, the next level requires more effort" and
  # "Researching Learning allows your units to gain experience" (so no levels before Learning).
  experiencePerDamagePercent: 100     # UNVERIFIED (UNK-23): experience per point of damage dealt to an enemy
  experiencePerKill: 0                # UNVERIFIED (UNK-23)
  levelBaseXp: 100                    # UNVERIFIED (UNK-23): level n needs 100 x n x (n + 1) / 2 experience
  baseLevelCap: 0                     # strategy guide: Learning allows experience; te_learning / te_heroism raise the cap
  attackPerLevel: 1                   # manual
  defenceHalvesPerLevel: 1            # manual: half a point per level (truncated: UNVERIFIED rounding, UNK-08)
  heroLevel: 12                       # TDD GAME-08: level 12 = named hero
  leadershipTechnology: te_nobility   # manual: Leadership "makes the units around a hero gain experience along with him"
  leadershipRadiusTiles: 4            # UNVERIFIED (UNK-23)
  leadershipSharePercent: 100         # ReTzar: the whole of it (ADR 0191)
  honorTechnology: te_honor           # manual: Honor "increases the attack damage of heroes, when fighting other heroes"
  honorAttackPercent: 50              # ReTzar: +50 % hero against hero (ADR 0191)
  dummyMaxLevel: 3                    # UNVERIFIED (UNK-23): training dummies teach the first levels only
  heroNames: legacy                   # DATA/HEROES.INI
  # GAME-09 holders.
  exitRadiusTiles: 3                  # UNVERIFIED: units leaving a holder take free tiles this close
  unitKeywords:                       # the [accept]/[enter] keywords of the object INIs
    allunits: [foot, mounted, large]
    earthunits: [foot, mounted, large]
    infantryunits: [foot]
    mountedunits: [mounted]
  # GAME-10 crafting (Arabian Magic Workshop: "better items cost more and take more time", manual ch. 5 §6).
  craftGoldPerPower: 50               # UNVERIFIED (UNK-25)
  craftHealthPerPower: 10             # UNVERIFIED (UNK-25): a crafted potion's hit points per point of power
  craftManaPerPower: 5                # UNVERIFIED (UNK-25): its mana per point
  craftPowerPerLevel: 5               # UNVERIFIED (UNK-25): points per level of a potion of levels
  craftMsPerPower: 2000               # UNVERIFIED (UNK-25)
  craftMaxPower: 20                   # UNVERIFIED (UNK-25)
  craftBookCostPercent: 400           # patch 1.05: magic books in the magic workshop are four times more expensive
  craftBookTimePercent: 200           # patch 1.05: and take twice as long
  # GAME-11.
  bribeCostPercent: 200               # UNVERIFIED (UNK-26): gold = 200% of the unit's cost
  crusadeAnchor: euro.crusadeanchor   # OBJECTS CRUSADE_ANCHOR.INI (cost from the data)
  crusader: euro.crusader
  # MAG-016, MAG-017 (ReTzar's reading of the original, 0x439640, 0x422ca0, 0x43a010): a kingdom starts with 16 crusaders
  # gathered; each cathedral gathers one more every 12 s (8 s after 15 minutes, 4 s after 20, 1 s after 30) up to the
  # ceiling, 16 + 4 per full crusade, at most 36; a crusade takes them all, and once they have all died the kingdom starts
  # again from 4: one preached early brings fewer for the same price (1.09).
  crusadeStart: 16
  crusadeRestart: 4
  crusadeCeilingStep: 4
  crusadeCeilingMax: 36
  crusadeAnchorRadiusTiles: 4         # TDD GAME-11: anchor <= 4 tiles from the cathedral
  # WAR-009 (ReTzar's reading of the original, 0x4ee780): after its blow a ghost curses the enemies around it, for free,
  # in 71 draws of 1001.
  bansheeSpell: spell_curse
  bansheeChance: 71
  bansheeOutOf: 1001
  # WAR-010 (ReTzar's reading of the original, damage category 3): the attacks of mages, dragons, the Messiah and priests
  # are magic, and the Messiah takes none. ITEM-010: a soul item's berserk order casts this spell's confusion.
  magicAttackers: { classes: [mage, dragon, messiah, priest] }
  soulBerserkSpell: spell_berserk
  # TECH-029 (ReTzar's reading of the original, 0x4de900): with Tournaments, every 75 points the kingdom's units learn
  # teach each of its Asian peasants, monks, ninjas and priests one more; what is over 75 is lost.
  tournamentTechnology: te_tournaments
  tournamentEvery: 75
  tournamentGrant: 1
  tournamentPupils: { civ: asia, classes: [peon, monk, ninja, priest] }
  # GAME-07 projectiles (speeds, homing and splash are UNVERIFIED, UNK-22; strategy guide: peasants step away from
  # catapult stones "just as the projectiles are about to land", so stones land where the target stood).
  projectiles:
    arrow: { pixelsPerSecond: 400, homing: true }
    bolt: { pixelsPerSecond: 480, homing: true }
    stone: { pixelsPerSecond: 200, homing: false, hitRadiusPx: 24, splashRadiusPx: 32, splashPercent: 50, friendlyFire: true }   # WAR-013: siege weapons hurt every unit
    cannon: { pixelsPerSecond: 320, homing: false, hitRadiusPx: 20, splashRadiusPx: 24, splashPercent: 50 }
    rocket_arrow: { pixelsPerSecond: 360, homing: true, splashRadiusPx: 16, splashPercent: 50 }
    magic: { pixelsPerSecond: 320, homing: true }
    flame_ball: { pixelsPerSecond: 280, homing: true, splashRadiusPx: 16, splashPercent: 50 }
    freeze_bolt: { pixelsPerSecond: 320, homing: true }
    flame_bolt: { pixelsPerSecond: 320, homing: true }

# ---- spells (GAME-11, ADR 0095) -----------------------------------------------------------------------------------
# Which caster has which spell and which technology unlocks it come from the data (command cards, TECHTREE [orders]);
# the spells themselves are rules entries keyed by their order (the data only names them).
# Every magnitude below is UNVERIFIED (UNK-26). Ranges and radii in tiles; amounts by effect (damage / healing / bonus
# percent / experience); summons pay the summoned type's mana and resource cost on top of the spell's mana.
# MAG-022 (ReTzar's reading of the original, query 0x2719): healing, freezing, the curse and raise dead skip the machines;
# raise dead also skips the creatures that leave no body (0x271c: bats, golems, carpets, mages, dwarves, orcs, jinns,
# ghosts, skeletons, dragons).
spell_heal: { new: true, Spell: { effect: heal, amount: 40, mana: 10, range: 6, cooldownMs: 1500, castMs: 500, targets: { category: unit, except: [troll, catapult, hcatapult, ballista, carpet, galleon, hulk, xebec, ghost, skeleton, fishing_boat] } } }
spell_bless: { new: true, Spell: { effect: bless, amount: 25, durationMs: 30000, mana: 30, range: 6, cooldownMs: 3000, castMs: 500, targets: { category: unit } } }
spell_lightning: { new: true, Spell: { effect: damage, amount: 40, mana: 30, range: 10, cooldownMs: 3000, castMs: 500 } }
spell_freeze: { new: true, Spell: { effect: freeze, durationMs: 10000, mana: 40, range: 10, cooldownMs: 5000, castMs: 500, projectile: freeze_bolt, targets: { category: unit, except: [troll, catapult, hcatapult, ballista, carpet, galleon, hulk, xebec, ghost, skeleton, fishing_boat] } } }
spell_cloak: { new: true, Spell: { effect: cloak, durationMs: 30000, mana: 40, range: 6, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }
spell_spawnbat: { new: true, Spell: { effect: summon, summon: comm.bat, range: 2, cooldownMs: 2000, castMs: 500 } }
spell_spawnstonegolem: { new: true, Spell: { effect: summon, summon: comm.troll, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_spawndragon: { new: true, Spell: { effect: summon, summon: comm.dragon, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_spawncarpet: { new: true, Spell: { effect: summon, summon: comm.carpet, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_spawnjin: { new: true, Spell: { effect: summon, summon: comm.jinn, range: 2, cooldownMs: 5000, castMs: 1000 } }
spell_firerain: { new: true, Spell: { effect: areaDamage, amount: 10, radius: 2, durationMs: 5000, pulseMs: 1000, mana: 50, range: 12, cooldownMs: 5000, castMs: 500 } }   # manual: hits own units too
spell_whirlpool: { new: true, Spell: { effect: areaDamage, affects: enemy, amount: 30, radius: 2, durationMs: 6000, pulseMs: 1000, mana: 50, range: 12, cooldownMs: 5000, castMs: 500, targets: { locomotor: ship } } }   # manual: "to destroy ships"
spell_flamebolt: { new: true, Spell: { effect: damage, amount: 30, mana: 25, range: 10, cooldownMs: 2000, castMs: 500, projectile: flame_bolt } }
