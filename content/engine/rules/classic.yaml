# The `classic` ruleset (TDD §11.3, DEC-06): v1.10 behaviour of the GOG reference build.
#
# This file holds NO original data. The numbers (costs, times, hit points, attack, defence, sight, range, speed, rate,
# population, footprints, resource amounts, starting resources, damage bonuses, technology and upgrade costs and times,
# technology trees, what each building researches) are read from the user's own imported tables (`legacy:` below;
# ADRs 0032, 0040). What this file adds is the mapping of those tables onto traits, and the constants and effects the
# tables do not contain.
#
# Values marked `UNVERIFIED (UNK-nn)` are placeholders: not in any original table and not yet measured in the running
# game. They are listed with their unknowns in docs/mechanics/m2-placeholders.md and docs/mechanics/m3-placeholders.md
# and get replaced by capture facts (`t2 fidelity`, ADR 0030). Do not tune them for balance: replace them with
# measurements.
#
# Format (ADR 0031): top-level keys are the sections below or entries. `^Name` entries are templates; `inherits` lists
# templates; `-Trait:` removes an inherited trait; `field+=`/`field-=` append to/remove from inherited lists. A patch
# must name an existing entry; a new one says `new: true`. Imported entries inherit `^Unit`/`^Building`/`^Resource`,
# then `^class.<class>` and `^<civ>.<class>` when they exist.

ruleset:
  name: classic
  maxPlayers: 8
  occupancyCellsPerTileAxis: 2        # UNVERIFIED (UNK-11): unit packing per tile
  corpseTtlMs: 120000                 # REQ-PATH-08 default; UNVERIFIED corpse lifetime of the original
  decalCap: 4000
  hudResources: [food, wood, stone, gold]   # GAME-01: iron exists in the data but not in the HUD (UNK-14)

# GAME-01. Resource type ids are positions in this list. Iron exists in the data (RES.INI, te_ironplus) but not in the
# HUD (UNK-14). Mana is per caster (trait ManaPool), not a stockpile.
resources: [food, wood, stone, gold, iron]

gameplay:
  # Owner decision for M2: a group move travels at its slowest member's speed in both rulesets until UNK-12 is captured
  # (ADR 0024 question).
  groupMoveSpeed: slowest             # UNVERIFIED (UNK-12)
  populationLimit: 200                # VERIFIED (capture-20261018-024524, smoke/plain setup screen): the setup screen's default
  startingResources: legacy           # RES.INI [Low]/[Medium]/[High] (lobby STARTING RESOURCES)
  defaultStartingResources: medium    # UNVERIFIED: the lobby's default level
  # Compile-time conversions of table columns.
  speedPixelsPerSecondPerPoint: 12    # UNVERIFIED (UNK-12): px/s per SPEED point (SPEED 4 = 48 px/s)
  attackCycleMs: 6000                 # UNVERIFIED (UNK-07): time between hits = attackCycleMs / RATE
  hitDelayPercent: 50                 # UNVERIFIED (UNK-07): hit frame at this share of the cycle
  manaRegenPerMinute: 60              # UNVERIFIED (UNK-26): mana a caster regains per minute
  # Combat and work constants.
  minimumDamage: 1                    # UNVERIFIED (UNK-08)
  resistanceScale: 1000               # UNVERIFIED (UNK-08): building damage x 1000 / (1000 + RESISTANCE) (manual ch. 4); owner
                                      # decision: 100 made castles (1000) practically immune to melee; capture uses RESISTANCE alone
  meleeReachPx: 8                     # UNVERIFIED (UNK-07/11): edge-to-edge reach of hand-to-hand attacks
  interactionReachPx: 32              # UNVERIFIED (UNK-17/18): worker reach to a node, drop-off or site
  acquireIntervalMs: 200              # UNVERIFIED: target scan cadence of idle armed units
  nodeSearchRadiusTiles: 12           # UNVERIFIED (UNK-17): where a worker looks for the next node of a resource
  queueCapacity: 10                   # UNVERIFIED (UNK-20): production queue length
  constructionRefundPercent: 100      # UNVERIFIED: refund of a cancelled construction site
  productionRefundPercent: 100        # UNVERIFIED: refund of a cancelled queued unit
  researchRefundPercent: 100          # UNVERIFIED: refund of a cancelled research or upgrade
  # GAME-03: repair, fire, ruins, walls, gates (ADR 0043).
  repairTimePercent: 100              # UNVERIFIED (UNK-18): a full repair by one peasant takes this share of the build time
  burnThresholdPercent: 50            # UNVERIFIED (UNK-42): buildings below this share of their hit points burn
  burnDamagePerMinute: 60             # UNVERIFIED (UNK-42): hit points a burning building loses per minute
  wallContinueRadiusTiles: 6          # UNVERIFIED: builders move on to the next segment of a dragged wall within this
  maxWallSegments: 64                 # UNVERIFIED: most segments one dragged wall places
  repairCostPercent: 50               # UNVERIFIED (UNK-18): a full repair costs this share of the construction cost, pro rata (owner decision)
  repairerFalloffPercent: 25          # UNVERIFIED (UNK-18): repairers on one building add 100%, 75%, 50%, 25%, then nothing (owner decision)
  gateOpenReachPx: 32                 # UNVERIFIED: an automatic gate opens for its owner's units this close
  gateCloseReachPx: 64                # UNVERIFIED: ... and closes when none is this close (hysteresis)
  gateChangeIntervalMs: 1000          # UNVERIFIED: least time between two changes of one gate (owner decision)
  maxGateChangesPerTick: 4            # engine bound: gate changes applied per tick (the rest wait); 16 cost 15 ms p99 (review)
  # GAME-04: capture (ADR 0044; ⚠ HYPOTHESIS UNK-19 for the EMIT influence).
  capturePointsPerSecond: 10          # UNVERIFIED (UNK-19): capture points per capturing peasant per second
  minimumCaptureResistance: 1         # UNVERIFIED (UNK-19)
  captureResetMs: 5000                # UNVERIFIED (UNK-19): progress is lost after this long without a capturer
  influenceRadiusTiles: 16            # UNVERIFIED (UNK-19): EMIT fades linearly to 0 at this distance

# World systems (M3 stream F, ADRs 0100-0106; docs/mechanics/m3-placeholders.md, stream F). Nothing here is in an original
# table except where noted; every value is UNVERIFIED until captured.
world:
  # GAME-12 fog and visibility (ADR 0101).
  defaultSightTiles: 2                # UNVERIFIED: sight of a kingdom's unit or building whose table row has none
  nightSightPercent: 100              # UNVERIFIED (UNK-09): sight at night (100 = night does not change sight)
  memoryRefreshTicks: 4               # engine: a seen structure's last-seen state is refreshed every 4 ticks (staggered)
  # GAME-13 diplomacy (ADR 0102).
  diplomacyChangeIntervalMs: 10000    # engine bound (anti flip-flop): least time between two changes towards one kingdom
  tributeIntervalMs: 1000             # engine bound: least time between two tributes of one kingdom
  maxTributeAmount: 100000            # engine bound: most of one resource in one tribute
  stockpileCap: 1000000000            # engine bound: overflow guard of every stockpile
  # GAME-14 trade and tavern (ADR 0103; UNK-28).
  tradeProfitPerTileBasisPoints: 100  # UNVERIFIED (UNK-28): profit per tile between the docks (1% of the load per tile)
  tradeMinDistanceTiles: 8            # UNVERIFIED: closer docks give no profit (anti trade loop)
  tradeMaxProfitPercent: 300          # UNVERIFIED: most profit of one delivery
  tradeDockMs: 2000                   # UNVERIFIED: time to unload and load at a dock
  convertRatio: 10                    # manual ch. 5 §7: "you give ten times more than you receive"
  gambleOdds: [2, 3, 5, 10]           # UNVERIFIED (UNK-28): the proportions a player may choose
  gambleHouseEdgePercent: 10          # UNVERIFIED (UNK-28): win chance = (1 - edge) / odds
  maxGambleStake: 10000               # engine bound
  loanStartAmount: 1000               # manual ch. 5 §10: the first loan is 1,000
  loanStepAmount: 200                 # manual ch. 5 §10: then 1,200
  loanGrowDelayMs: 120000             # UNVERIFIED (UNK-28): "after some time"
  loanInterestPercent: 0              # UNVERIFIED (UNK-28): the manual names no interest
  # GAME-15 gateways and nature (ADR 0104).
  claimReachPx: 16                    # UNVERIFIED: a touch claims a gateway or a wild cow from this close
  claimIntervalMs: 500                # engine: claim scan cadence
  guardRadiusTiles: 10                # UNVERIFIED: guarding Nature units return home beyond this
  wanderRadiusTiles: 6                # UNVERIFIED: animals wander this far from home
  wanderIntervalMs: 8000              # UNVERIFIED: mean time between two wander moves
  # GAME-16 day/night and weather (ADR 0105; UNK-09, UNK-32).
  dayLengthMs: 720000                 # UNVERIFIED (UNK-32): one day-night cycle
  dayStartMinute: 600                 # UNVERIFIED: a match starts at 10:00
  nightStartMinute: 1140              # UNVERIFIED: night from 19:00
  nightEndMinute: 360                 # UNVERIFIED: to 06:00
  weatherPeriodMs: 180000             # UNVERIFIED (UNK-09): weather comes and goes in 3-minute periods
  weatherChancePercent: 25            # UNVERIFIED: share of periods with weather
  weather: { grass: rain, summer: rain, snow: snow, desert: clear }   # the rain/snow flags of <SET>.TERRAIN.INI (structural facts)
  # GAME-17 victory and scoring (ADR 0106; UNK-29).
  scoreGatherDivisor: 10              # UNVERIFIED (UNK-29): 1 point per 10 resources gathered
  scoreKillDivisor: 10                # UNVERIFIED (UNK-29): 1 point per 10 resources of value killed or destroyed
  scoreBuildDivisor: 10               # UNVERIFIED (UNK-29): 1 point per 10 resources of value built or trained
  scorePerTechnology: 100             # UNVERIFIED (UNK-29)
  victoryIntervalTicks: 20            # engine: victory is evaluated once per second
  deathmatchStartingResources: high   # UNVERIFIED: a Deathmatch starts every kingdom on the High level
  # GAME-19 cheats (UNK-30).
  cheatSmallResources: 2000           # UNVERIFIED (UNK-30): hmdvaleva
  cheatLargeResources: 5000           # UNVERIFIED (UNK-30): hmpetleva

# Terrain types of the M2 test maps (the terrain-set conversion of §9.1 replaces this list with the original sets).
terrain:
  - { key: grass, passable: [foot, mounted, large, air] }
  - { key: water, passable: [ship, air], water: true }

legacy:
  # Table prefixes: DATA/<civ> UNITS.TXT, DATA/<civ> BUILDINGS.TXT; also the `[civ]` sections of OBJECTS/*.INI.
  civilizations: [euro, asia, arab, comm]
  # Every unit and building of the tables (M3: GAME-01...06). Classes in both tables (towers) are buildings that take
  # their armament and hit points from the unit table.
  units: all
  buildings: all
  # Cost suffixes (GAME-01; "m" = mana is paid by the caster, not from the stockpile).
  costSuffixes: { f: food, w: wood, s: stone, g: gold, i: iron, m: mana }
  # Producer column of the unit tables -> building class (common units are trained in every civilization's building).
  producers: { Gate: magicgateway, Castle: castle, Barracks: barrack, Workshop: workshop, Harbor: harbor, "Mage Tower": magetower, Cathedral: cathedral, Mosque: mosque, Market: market, Farm: farm, Monastey: shaolinn, "War Guild": academy }
  # Resource nodes: amount from RES.INI [Others]. Fish patches sit on water and have no footprint (ADR 0042).
  resourceNodes:
    res_gold: { resource: gold, amount: golden rocks }
    res_stone: { resource: stone, amount: rocks }
    fishpatch: { resource: food, amount: fish patch, footprint: false }
  # ⚠ HYPOTHESIS (ADR 0042): cows keep their milk as max_manna; it becomes the food they hold.
  milkClasses: [cow]
  # Technology trees per civilization: [depend] prerequisites, [required] buildings, [orders] gated orders (ADR 0040).
  techTrees: { euro: "data/techtree euro.ini", asia: "data/techtree asia.ini", arab: "data/techtree arab.ini" }
  # Starting-resource levels -> RES.INI sections.
  startingResources: { low: Low, medium: Medium, high: High }
  # Civilization prefixes of class names in BONUS.INI.
  bonusCivPrefixes: { e: euro, a: asia, r: arab }
  # GAME-10 (ADR 0094): item object classes -> item kind (OBJECTS/ITEM*.INI; armor shares the generic ITEM class, see
  # comm.item_armor); who may carry each comes from its [enter] list.
  items: { item: weapon, item_flag: flag, item_health: potion, item_magic: spellbook, item_plusplus: plusplus, item_scroll: scroll, item_soul: soul, resitem: resource }
  # GAME-11: objects outside the tables imported with their cost and fog_range (crusade anchor, magic vision's revealer).
  objects: [CrusadeAnchor, fog_revealer]
  # Hash of what the compiler reads from the tables of the clean reference build; another value means a modified
  # installation (a warning in the import and ruleset reports, not an error). Changes with the lists above.
  referenceEdition: GOG v1.10 EN
  referenceDataHash: "6E4A7EB7A913D5E6"

# ---- templates ---------------------------------------------------------------------------------------------------

^Unit:
  Mobile: { locomotor: foot }
  Collision: { radius: 7 }            # UNVERIFIED (UNK-11): collision radius in px
  CorpseOnDeath: {}
  PopulationCost: { amount: 1 }       # GAME-05: 1 population per unit in classic
  Experience: {}                      # GAME-08: units gain experience in combat (manual ch. 5 §2.1)

^Building:
  Armor: { defence: 0 }               # RESISTANCE (from the table) reduces damage instead, see gameplay.resistanceScale
  Repairable: {}                      # GAME-03: peasants repair buildings
  Burnable: {}                        # GAME-03: badly damaged buildings burn (threshold and damage UNVERIFIED, UNK-42)
  RuinOnDeath: {}                     # GAME-03: ruins (a decal that never blocks, ORIG-01)

^Resource: {}

^Cavalry:
  Mobile: { locomotor: mounted }
  Collision: { radius: 10 }           # UNVERIFIED (UNK-11)

^Ship:
  Mobile: { locomotor: ship }
  Collision: { radius: 16 }           # UNVERIFIED (UNK-11)
  Repairable: {}                      # GAME-03: peasants repair ships (manual ch. 5)
  -CorpseOnDeath:                     # ships sink

^Siege:
  Mobile: { locomotor: large }
  Collision: { radius: 12 }           # UNVERIFIED (UNK-11)
  Repairable: {}                      # GAME-03: peasants repair siege weapons (manual ch. 5)
  -CorpseOnDeath:

# Peasants (manual §5.4: build, repair, capture, harvest...).
^class.peon:
  Armament: { autoAcquire: false }    # UNVERIFIED: idle peasants do not start fights
  Builder: { civilizations: [own, comm] }
  Capturer: {}                        # GAME-04
  Briber: {}                          # GAME-11: order bribe (Bribery)
  BribeImmune: {}                     # TDD GAME-11: peasants cannot be bribed
  Harvester:
    capacity: 10                      # UNVERIFIED (UNK-17)
    gatherMs: { food: 1000, wood: 1000, stone: 1000, gold: 1000, iron: 1000 }   # UNVERIFIED (UNK-17): per unit

^class.fishing_boat:
  inherits: [^Ship]
  Armament: { projectile: arrow }     # UNVERIFIED (UNK-22)
  Harvester:
    capacity: 20                      # UNVERIFIED (UNK-17)
    gatherMs: { food: 1000 }          # UNVERIFIED (UNK-17)
^class.galleon: { inherits: [^Ship], Trader: { capacity: 200, access: water, technology: te_traderoutes }, Armament: { damage: cannon, projectile: cannon } }   # UNVERIFIED (UNK-28, UNK-22)
^class.hulk: { inherits: [^Ship], Trader: { capacity: 150, access: water, technology: te_traderoutes }, Armament: { damage: cannon, projectile: cannon } }      # UNVERIFIED (UNK-28, UNK-22)
^class.xebec: { inherits: [^Ship], Trader: { capacity: 100, access: water, technology: te_traderoutes }, Armament: { projectile: arrow } }     # UNVERIFIED (UNK-28); BONUS.INI arrow_attack lists xebecs
^class.catapult: { inherits: [^Siege], Armament: { damage: cannon, projectile: stone } }    # UNVERIFIED (UNK-22): stones land where the target stood
^class.hcatapult: { inherits: [^Siege], Armament: { damage: cannon, projectile: stone } }   # UNVERIFIED (UNK-22)
^class.ballista: { inherits: [^Siege], Armament: { projectile: bolt } }                     # UNVERIFIED (UNK-22)

# The tables give armored chariots and caravans no SPEED.
^class.chariot: { Mobile: { speed: 4 }, Armament: { rate: 3 } }   # UNVERIFIED (UNK-12, UNK-07): the tables give armored chariots no SPEED and no RATE
^class.trader:                             # caravans: cycle between two markets (GAME-14, ADR 0103)
  Mobile: { speed: 4 }                     # UNVERIFIED (UNK-12)
  Trader: { capacity: 100, access: land, technology: te_traderoutes }   # UNVERIFIED (UNK-28): load per trip

^class.knight: { inherits: [^Cavalry] }
^class.heavy_cavalry: { inherits: [^Cavalry] }
^class.horse_samurai: { inherits: [^Cavalry] }

# Cows (GAME-02): peasants milk them (the food they hold regrows) and butcher them for meat; Arab peasants steal enemy
# cows after Cow Poaching (manual ch. 6).
^class.cow:
  ResourceNode:
    regenMs: 4000                     # UNVERIFIED (UNK-17): milk regrows one unit per 4 s
    gatherMs: 1500                    # UNVERIFIED (UNK-17): milking time per unit
    keepWhenEmpty: true
  SpawnOnDeath: { type: comm.meat }
  Capturable: { instant: true, technology: te_cowpoaching }
  ClaimOnTouch: { by: any }           # UNVERIFIED: a wild (Nature) cow joins the first kingdom whose unit touches it (GAME-15)
  Animal: { wanders: true }           # UNVERIFIED: wild cows wander around their spot
^class.bear:
  Animal: { wanders: true, guards: true }   # UNVERIFIED: bears roam their area and return when lured away
# Magic gateways (manual ch. 5 §4.4.2): neutral until a military unit touches them; they summon dwarves, orcs, ghosts and
# skeletons (producer column "Gate"; ghosts and skeletons by the gateway's command card, MENU.INI [magic_gateway]).
^class.magicgateway:
  ClaimOnTouch: { by: military }
  -Burnable:
  -RuinOnDeath:
^class.ghost: { Producible: { by: [comm.magicgateway] } }
^class.skeleton: { Producible: { by: [comm.magicgateway] } }
# Trade docks and the tavern (GAME-14, ADR 0103).
^class.market: { TradeDock: { access: land } }
^class.tavern: { Tavern: {} }
# Spies and ninjas see cloaked units near them (GAME-12; radius UNVERIFIED).
^class.spy: { Detector: { radius: 5 } }
^class.ninja: { Detector: { radius: 5 } }

# Drop-offs (GAME-02; manual §5.4.1.2 and ch. 6: castle stores all resources, farm food, lumbermill wood; storage per
# civilization; the harbor stores fish). Lumber mills and storages send their builders gathering (1.05).
^class.castle:
  DropOff: { resources: [food, wood, stone, gold, iron] }
  ProtectedDelete: {}                 # GAME-04: Shift + Del
  Holder: { healPerMinute: 120 }      # UNVERIFIED (UNK-24): garrisoned units "heal themselves quickly" (strategy guide)
^class.farm:
  DropOff: { resources: [food] }
^class.lumber:
  DropOff: { resources: [wood], autoGather: true }
^class.storage:
  DropOff: { resources: [stone, gold, iron], autoGather: true }
^euro.storage:
  DropOff: { resources: [gold, iron] }          # manual ch. 5: "a place for storing iron and gold"
^asia.storage:
  DropOff: { resources: [gold, stone] }         # manual ch. 5: "storing gold and stone"
^arab.storage:
  DropOff: { resources: [iron, gold, stone] }   # manual ch. 5: "storing iron, gold and stone"
^class.harbor:
  DropOff: { resources: [food], access: [water] }   # UNVERIFIED: only boats deliver here
  Building: { placement: coast }
  TradeDock: { access: water }        # GAME-14: ships trade between harbors

# Guilds are deletable only with Shift + Del (GAME-04).
^class.cathedral: { ProtectedDelete: {}, CrusadePreacher: {} }   # GAME-11: crusades are preached at the cathedral
^class.mosque: { ProtectedDelete: {} }
^class.shaolinn: { ProtectedDelete: {} }
^class.magetower: { ProtectedDelete: {} }
^class.tcguild: { ProtectedDelete: {} }
^class.academy: { ProtectedDelete: {} }

# Fields produce unlimited food (manual §5.5) and need constant care: neglected, they decay and disappear.
^class.field:
  ResourceNode: { resource: food, amount: unlimited }
  DropOff: { autoGather: true }       # UNVERIFIED: the builder starts farming the new field
  Decay: { afterMs: 60000, healthPerMinute: 30 }   # UNVERIFIED (UNK-17)
  -Burnable:
  -RuinOnDeath:

# Walls are dragged as lines; gates open; bridges carry land units over water (GAME-03, ADR 0043).
^class.wall_wood:
  Wall: {}
  -Burnable:
  -RuinOnDeath:
^class.wall_stone:
  Wall: {}
  -Burnable:
  -RuinOnDeath:
^class.gate_wood:
  Building: { width: 3, height: 1 }   # UNVERIFIED (UNK-02): no footprint box in the data
  Gate: { passage: ["010"] }          # UNVERIFIED: the middle tile opens
  -Burnable:
^class.gate_stone:
  Building: { width: 3, height: 1 }   # UNVERIFIED (UNK-02)
  Gate: { passage: ["010"] }
  -Burnable:
^class.bridge:
  Building: { placement: bridge }
  Bridge: {}
  -Burnable:
  -RuinOnDeath:

# ---- GAME-07...11: combat, experience, holders, items, magic (ADRs 0090-0095) ----------------------------------------
# Projectiles per shooter (TDD §10 GAME-07: arrow, bolt, cannon, rocket arrow, stone). Which unit fires which is not in
# a table: the BONUS.INI group arrow_attack names the arrow shooters; the rest follows the manual's descriptions.
^class.archer: { Armament: { projectile: arrow } }
^class.longbowman: { Armament: { projectile: arrow } }
^class.horse_archer: { Armament: { projectile: arrow } }
^class.tower_wood: { Armament: { projectile: arrow } }
^class.tower_wood2: { Armament: { projectile: arrow } }
^class.tower_stone: { Armament: { projectile: arrow } }
^class.tower_stone2: { Armament: { damage: cannon, projectile: cannon } }        # cannon tower
^class.tower_rocket: { Armament: { damage: cannon, projectile: rocket_arrow } }  # UNVERIFIED (UNK-22)
^class.mage: { Armament: { projectile: magic } }                                 # UNVERIFIED: the mage's bolt (OBJECTS MAGIC)
^class.priest: { Armament: { projectile: magic } }                               # exorcism (order exorcism = attack)
^class.dragon: { Armament: { projectile: flame_ball } }                          # UNVERIFIED (OBJECTS FLAME_BALL)
^class.crusader: { BribeImmune: {} }                                             # TDD GAME-11: crusaders cannot be bribed
^class.dummy:
  TrainingDummy: {}                   # GAME-08: training against dummies (Tactics); they take no damage
  -Burnable:
  -RuinOnDeath:
^class.outpost:
  Holder: { healPerMinute: 120 }      # UNVERIFIED (UNK-24): "units garrisoned ... heal themselves quickly" (strategy guide)
^class.jihad_warrior:
  ConvertsFrom: { classes: [peon], order: become_jihadw }   # manual ch. 5: Jihad warriors are made from peasants
  Armament: { rate: 3 }               # UNVERIFIED (UNK-07): the table gives an ATTACK but no RATE
^euro.priest: { Armament: { rate: 2 } }   # UNVERIFIED (UNK-07): RATE 0 in the table, but priests attack (exorcism)
^arab.priest: { Armament: { rate: 2 } }   # UNVERIFIED (UNK-07): no RATE in the table
^class.carpet:
  Mobile: { locomotor: air, speed: 5 }    # UNVERIFIED (UNK-12): the table gives magic carpets no SPEED
  Collision: { radius: 12 }               # UNVERIFIED (UNK-11)
^asia.priest:
  ConvertsFrom: { classes: [monk], order: become_priest }   # TDD E.2: Asian priests from monks
^class.magicworkshop:
  ItemCrafter: { items: [comm.item, comm.item_armor, comm.item_health, comm.item_magic, comm.item_plusplus] }   # manual ch. 5 §6.1
^Item: {}

# ---- entries not in the unit/building tables ----------------------------------------------------------------------

# One tree per tile (§9.1). Trees come from the terrain sets (TREES.INI), which hold no amount.
comm.tree:
  new: true                           # not in the tables: a new entry (ADR 0031)
  inherits: [^Resource]
  Legacy: { class: tree, civ: comm }
  Building: { width: 1, height: 1 }
  ResourceNode: { resource: wood, amount: 100 }   # UNVERIFIED (UNK-17): wood per tree

# Meat left by a slaughtered cow (GAME-02): a footprint-less pile that rots (never blocks, ORIG-01/05).
comm.meat:
  new: true
  inherits: [^Resource]
  Legacy: { class: meat, civ: comm }
  ResourceNode: { resource: food, amount: 100 }   # UNVERIFIED (UNK-17)
  Lifetime: { ms: 120000 }                        # UNVERIFIED (UNK-17)

# Ambient birds (OBJECTS BIRD.INI / EAGLE.INI, teren = 0; not in the tables): they fly around, nobody fights them.
comm.bird:
  new: true
  Legacy: { class: bird, civ: comm }
  Mobile: { locomotor: air, speed: 5 }          # UNVERIFIED
  Health: { max: 10 }                           # UNVERIFIED
  Animal: { wanders: true, ambient: true }
comm.eagle:
  new: true
  Legacy: { class: eagle, civ: comm }
  Mobile: { locomotor: air, speed: 6 }          # UNVERIFIED
  Health: { max: 10 }                           # UNVERIFIED
  Animal: { wanders: true, ambient: true }

# ---- technology effects (GAME-06, ADR 0040) ------------------------------------------------------------------------
# Costs, times, prerequisites and which building researches what come from the tables. The effects are not in any
# table (the original hard-codes them): the manual (ch. 6) says what each technology does; every magnitude below is
# UNVERIFIED (UNK-21). Technologies that only unlock units, buildings, spells or orders need no effect: their trees do
# that. Stats marked (GAME-08/09/11/14) are kept in the modifier tables for the later systems that consume them.

te_fields: { Technology: { effects: [{ stat: gatherRate, percent: 25, classes: [field] }] } }        # UNVERIFIED (UNK-21)
