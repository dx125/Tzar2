# Ship cannon levels (UPGRADES.INI to_ship_level2-6): bought per galleon in order; each adds attack (UNVERIFIED UNK-21).
comm.galleon:
  Researcher: { upgrades+=: [to_ship_level3, to_ship_level4, to_ship_level5, to_ship_level6] }
to_ship_level2: { Upgrade: { effects: [{ stat: attack, add: 5 }] } }                                    # UNVERIFIED (UNK-21)
to_ship_level3: { Upgrade: { after: [to_ship_level2], effects: [{ stat: attack, add: 5 }] } }           # UNVERIFIED (UNK-21)
to_ship_level4: { Upgrade: { after: [to_ship_level3], effects: [{ stat: attack, add: 5 }] } }           # UNVERIFIED (UNK-21)
to_ship_level5: { Upgrade: { after: [to_ship_level4], effects: [{ stat: attack, add: 5 }] } }           # UNVERIFIED (UNK-21)
to_ship_level6: { Upgrade: { after: [to_ship_level5], effects: [{ stat: attack, add: 5 }] } }           # UNVERIFIED (UNK-21)
