spell_berserk: { new: true, Spell: { effect: confuse, durationMs: 20000, mana: 50, range: 8, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }   # manual: Confusion, "hostile to all"
spell_magicvision: { new: true, Spell: { effect: reveal, summon: comm.fog_revealer, mana: 40, range: 30, cooldownMs: 5000, castMs: 500 } }
# Mastery (TECH-028; ReTzar's reading of the original, 0x473bf0): an Asian priest teaches an Asian peasant, monk, ninja or
# priest of a lower level than its own one point of experience (100 here, a level's worth: UNVERIFIED, UNK-23).
spell_raiseexp: { new: true, Spell: { effect: experience, amount: 100, mana: 50, range: 6, cooldownMs: 3000, castMs: 500, targets: { civ: asia, classes: [peon, monk, ninja, priest] } } }
# The curse and hypnosis (ReTzar's reading of the original, 0x4e5841, 0x473887): the curse halves the attack and takes the
# defence of every enemy unit within the caster's sight of the point for 30 s; hypnosis hands the unit to the caster's
# kingdom for 30 s. The curse leaves out what the original calls machines (0x2719: golems, siege engines, carpets, ships,
# ghosts, skeletons, fishing boats). Their mana, range, cooldown and cast time are UNVERIFIED.
spell_curse:
  new: true
  Spell:
    effect: curse
    amount: 50
    durationMs: 30000
    mana: 30
    range: 8
    cooldownMs: 3000
    castMs: 500
    targets: { category: unit, except: [troll, catapult, hcatapult, ballista, carpet, galleon, hulk, xebec, ghost, skeleton, fishing_boat] }
spell_hypnotize: { new: true, Spell: { effect: hypnotize, durationMs: 30000, mana: 40, range: 8, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }   # books only
raisedead: { new: true, Spell: { effect: raiseDead, summon: comm.skeleton, count: 5, radius: 3, mana: 40, range: 8, cooldownMs: 5000, castMs: 1000, targets: { category: unit, except: [troll, catapult, hcatapult, ballista, carpet, galleon, hulk, xebec, ghost, skeleton, fishing_boat, bat, mage, dwarf, ork, jinn, dragon] } } }   # targets: the corpses that rise
cloak: { new: true, Spell: { effect: cloak, target: self, durationMs: 60000, cooldownMs: 1000 } }                       # ninjas (ADR 0095)
murder: { new: true, Spell: { effect: kill, mana: 50, range: 0, cooldownMs: 10000, castMs: 500, targets: { category: unit } } }   # ninjas; heroes are immune

