# Potions (ADR 0186): a single potion adds health, levels, mana, attack or defence (the editor's list; the maps' potions:
# red 46 hit points or 10 levels, green 3 or 4 levels, blue mana). Which colour the workshop gives attack and defence is
# ours (UNVERIFIED).
comm.item_health:
  Item:
    health: 100                                                             # potion: UNVERIFIED (UNK-25)
    looks: [item_potion1, item_potion2, item_potion3, item_potion4, item_potion5, item_potion6, item_potion7, item_potion8]
    crafts: [health item_potion2, levels item_potion3, mana item_potion4, attack item_potion6, defence item_potion5]
