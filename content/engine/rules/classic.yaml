spell_raiseexp: { new: true, Spell: { effect: experience, amount: 100, mana: 50, range: 6, cooldownMs: 3000, castMs: 500, targets: { category: unit } } }   # Mastery: mana into experience
spell_curse: { new: true, Spell: { effect: curse, amount: 25, durationMs: 30000, mana: 30, range: 8, cooldownMs: 3000, castMs: 500, targets: { category: unit } } }
spell_hypnotize: { new: true, Spell: { effect: freeze, durationMs: 10000, mana: 40, range: 8, cooldownMs: 5000, castMs: 500, targets: { category: unit } } }   # on no command card
raisedead: { new: true, Spell: { effect: raiseDead, summon: comm.skeleton, count: 5, radius: 3, mana: 40, range: 8, cooldownMs: 5000, castMs: 1000 } }
cloak: { new: true, Spell: { effect: cloak, target: self, durationMs: 60000, cooldownMs: 1000 } }                       # ninjas (ADR 0095)
