schema: tzar2-rules/1
prefix: ECO
title: Resources and gathering
rules:
  ECO-001:
    rule: A gatherer's load appears all at once when its work is done (10 wood after the gathering time of 10), not unit by unit.
    source: [owner 2026-10-20 (third play-test)]
    status: tested
    adr: [0180]
  ECO-002:
    rule: Gathering broken off before the load is complete gives nothing.
    source: [owner 2026-10-20 (third play-test), 'community ReTzar src/gameplay.rs (0x4ad1cc, 0x4ae2a0)']
    status: tested
    adr: [0180, 0251]
    note: The original fills the whole load at the end of the work cycles (six chops for wood, a mine's take at once), so a peasant called away before then carries nothing; milk fills unit by unit (ECO-003).
  ECO-003:
    rule: Milk fills the pail unit by unit.
    source: [owner 2026-10-20 (third play-test)]
    status: tested
    adr: [0180]
  ECO-004:
    rule: When a node is used up the gatherer goes on to another node of the same resource close by that it can reach, choosing one near the way back to the drop-off rather than one deeper in.
    source: [owner 2026-10-20 (third play-test)]
    status: tested
    note: How the original scores the next node is not known; Tzar2 adds the way from the node to the nearest drop-off.
    adr: [0180]
  ECO-005:
    rule: A peasant left without work takes up work by itself after a while - idle 30 seconds, it takes up the work of the nearest of its kingdom's peasants within twice its sight that chops, mines, tends cows, builds, repairs or captures (not one digging a field).
    source: [owner 2026-10-20 (third play-test), 'community ReTzar src/gameplay.rs (take_up_work 0x4ae440, filter 0x44fa30)']
    status: tested
    note: The global audit of 2026-11-07 read the 30 s in the original's code (cmp 0x7530 at 0x4ae449 in Tzar.exe). The third play-test's observation stands - an idle peasant does go to work - but the original only joins another peasant's work; Tzar2 had it seek a site, a damaged building or a resource within 12 tiles after 10 s. A computer kingdom's peasant asks its player instead (0x4ae4a5); Tzar2's computer peasants still find work by themselves (idleWorkAfterMs, idleWorkRadiusTiles, AI-003).
    adr: [0180]
  ECO-006:
    rule: Workers walk up to what they work on (the node, the drop-off, the site) before they work or unload.
    source: [owner 2026-10-20 (before the second play-test)]
    status: implemented
  ECO-007:
    rule: A cow taken by a kingdom stops wandering; a milker at a dry cow goes to another cow or field nearby, or waits for the milk to regrow.
    source: [owner 2026-10-20 (before the second play-test)]
    status: implemented
  ECO-008:
    rule: Units can walk over fields, farmers work on the field's own tiles, and nothing can be built on a field.
    source: [owner 2026-10-20 (before the second play-test), 'community ReTzar src/gameplay.rs (0x42e600: the Dig program walks to the field''s cell x + 1, y + 1)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: The farmer works on the field's middle tile; when another unit stands there, it digs where it stopped on the field. A farmer coming back from the drop-off keeps its field against idle peasants looking for work. Until the tenth play-test a farmer that stopped anywhere on the field dug there, so one back from a farm beside its field dug at the field's edge.
  ECO-009:
    rule: There are four resources in the stockpile, gold (golden rocks), stone (rocks), wood (trees) and food (fields, cows, fish); mana belongs to each caster.
    source: [manual Resources]
    status: implemented
    note: Iron exists in the data but not on the screen (UNK-14).
  ECO-010:
    rule: Peasants cut wood, mine gold and stone, farm fields and tend cows; fishing boats fish at fish patches; peasants never fish.
    source: [manual Resources]
    status: tested
  ECO-011:
    rule: A rock holds a limited amount of gold or stone, shown in the selection view when it is clicked; a used-up node disappears.
    source: [manual Resources]
    status: tested
  ECO-012:
    rule: Fields give unlimited food but need constant care. A field nobody works for a minute withers, losing 10 of its 100 hit points every 5 seconds and showing its growth stage, and disappears at 0; its farmer grows it back by 10 a dig, and it bears food again only once whole.
    source: [manual Resources, 'community ReTzar src/gameplay.rs (decay_fields 0x44d1e0, every 5000 ms after 60 s; growth 0x44cc70; the field_grow picture at row health × 4 / 100, 0x44c880)', 'data IMAGES.INI field_grow rows 4, e_peon_dig anim_time 1196', owner 2026-11-06 (tenth play-test)]
    status: tested
    adr: [0276]
    note: Tzar2 let a neglected field lose 30 hit points a minute (UNK-17), showed it ripe to the end and never grew it back; the tenth play-test saw fields that did not wither.
  ECO-013:
    rule: Each load goes to the finished building nearest to where it was gathered that takes it, even one built after the worker's first trip; the castle takes everything, the farm food, the lumber mill wood, the harbor fish.
    source: [manual Civilizations (Castle Farm Lumbermill Harbor), owner 2026-10-21 (fourth play-test)]
    status: tested
  ECO-014:
    rule: Every civilization's storage takes gold and stone, as the lumber mill takes wood; it stores nothing of its own.
    source: [owner 2026-10-21 (answers)]
    status: tested
    note: The manual's per-civilization lists (with iron) are not the game's.
  ECO-015:
    rule: A peasant carries 10 wood, stone or gold; a load of milk or meat from a cow is 50.
    source: [capture capture-20261018-222649]
    status: tested
    adr: [0170]
  ECO-016:
    rule: A peasant gathers one unit of a resource in 0.9 s.
    source: [capture capture-20261019-232318]
    status: tested
    adr: [0175]
  ECO-017:
    rule: Cows are made at the farm after Domestication; peasants milk them, and a cow that is killed leaves meat.
    source: [manual European Buildings (Farm), owner 2026-10-20]
    status: tested
  ECO-018:
    rule: Peasants of every civilization tend cows and carry milk alike.
    source: [owner 2026-10-21 (answers)]
    status: tested
    note: The manual's list of the Asian peasant's work leaves out milk; the owner confirms they milk as the others do.
  ECO-019:
    rule: Arabian peasants with Cow Poaching take enemy cows.
    source: [manual Arabian technologies (Cow Poaching)]
    status: tested
  ECO-020:
    rule: Cows and fishing boats are the best sources of food, fields the cheapest.
    source: [guide Economy]
    status: implemented
    note: Follows from the gathering rates, which are placeholders for fields and fish (UNK-17).
  ECO-021:
    rule: Only one peasant tends each field.
    source: [help ITEMS.TXT HT_TEND_FIELDS]
    status: tested
    note: A field's ResourceNode takes one worker (workers 1). A peasant sent to a field someone already works goes to the nearest free field, or stands idle; of two sent at once, the one with the lower entity index keeps it.
  ECO-022:
    rule: A peasant can tend more than one cow, milking them in turn and taking the milk to the farm or the castle.
    source: [help ITEMS.TXT HT_TEND_COWS]
    status: implemented
  ECO-023:
    rule: A peasant with a load sent to one of its kingdom's stores (a right click on it) delivers the load there, not at the nearest store, and the order ends. A scenario's default Object Order on a store is that right click.
    source: ['community ReTzar src/gameplay.rs (Return Goods, program 0x35, 0x4adc20)', 'community ReTzar src/gameplay/scripting.rs (default order, 0x4bb1a4)']
    status: tested
    note: bigisland's "Azim leaves gold" puts the gold into the village's stockpile this way. Tzar2 has no right click for it in the client yet; the Harvest command on a store does it. The other default orders stay a move (UNK-57).
  ECO-024:
    rule: A peasant that changes hands keeps the load it carries; only its task ends.
    source: ['community ReTzar src/gameplay.rs (transfer_owner, 0x5050a0)']
    status: tested
  ECO-025:
    rule: A field is ready the moment it is placed, at full health; the peasants who placed it farm it at once.
    source: ['community ReTzar src/gameplay.rs (0x44c7a0: a field is born complete and ripe; 0x48f603: its peasants dig it at once)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: Data, the trait ReadyAtOnce of the field; Tzar2 had built fields as sites.
  ECO-026:
    rule: A peasant carrying a load sent to other work goes straight to it; when it begins work on another resource it drops the old load on the ground as a bag of that resource, which any peasant can take up again. A peasant that dies drops its load too.
    source: ['community ReTzar src/gameplay.rs (0x4aea70 the load dropped as a resource item; 0x4ae2a0 as the new work begins; 0x4ff350 before taking a bag of another kind; 0x4acc44 at death)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: 'The bag is OBJECTS RESITEM in the picture of its resource (item_food, item_wood, item_stone, item_gold); it keeps what it holds in the item (ItemState.Resource, which was padding, so saves stay). A bag the map placed holds what its picture shows. Before, the peasant took the load home first (the sixth play-test). Tzar2 tells loads apart by resource only: milk and a field''s food are both food, while the original drops one for the other. The bags were not drawn until the eighth play-test: their pictures were not loaded for the match. Until the tenth they drew their type's picture, the original's empty item (item_none, a slot's corners), not their own look.'
  ECO-027:
    rule: A cow's milk is its mana and comes back as mana does - 2 a second for a kingdom's cow (more with Concentration), 1 for Nature's - but not while it is milked.
    source: ['community ReTzar src/gameplay.rs (the mana timer 0x502ea2 and its gate 0x504e30, milked 0x4ed2c0)']
    status: tested
    adr: [0280]
    note: The global audit of 2026-11-07 replaced one unit every 4 s (UNK-17). A milker waiting by an empty cow does not stop it. How fast the pail fills stays as measured (ADR 0170); ReTzar reads 3 a milk cycle of 900 ms, slower than the owner's capture.
  ECO-028:
    rule: A field's load comes after a countdown of 12 to 18 digs of the peasant (1.2 s each), drawn as the dig starts; a field short of its health is grown back first.
    source: ['community ReTzar src/gameplay.rs (the dig 0x4acff7, 0x4ad088, 0x4ac180)', 'data IMAGES.INI e_peon_dig (anim_time 1196)']
    status: missing
    adr: [0280]
    note: Found by the global audit of 2026-11-07; Tzar2 gives a field's load after the peasant's 0.9 s a unit (UNK-17), about twice as fast. The countdown is built (ResourceNode loadCyclesMin, loadCyclesMax, cycleMs) but not turned on - with it the farms' food halves and Tzar2's computer, whose pacing was set on the faster fields, sends no wave within 10 minutes in any AI test; the owner decides, and the AI's farming follows first.
  ECO-029:
    rule: A fishing boat takes up to 4 fish every 1.4 seconds until it holds 50; a fish patch starts with 500 and goes when emptied, and one nobody fishes grows by 5 % every 10 seconds, up to 2000.
    source: ['community ReTzar src/gameplay.rs (fishing 0x4e911e, 0x4e92be, 0x451050; fish_patches, timer 0x4216)', 'data RES.INI fish patch']
    status: tested
    adr: [0280]
    note: The global audit of 2026-11-07 replaced 20 a trip at 1 a second (UNK-17). The original's patch also drifts a cell now and then; Tzar2's stays.
