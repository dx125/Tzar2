schema: tzar2-rules/1
prefix: HUD
title: The screen
rules:
  HUD-001:
    rule: An order button's hint gives its name, its hotkey, its price and what it still requires ("Create Knight - 'K' ( Gold:70 Food:120 ) Requires Stable, Plate Armor").
    source: [owner 2026-10-21 (third play-test; the original's hint), 'strings STRINGS3.INI [misc] req3']
    status: deviation
    note: Tzar2 shows a box with the name and a hotkey key cap, the price with the resource icons (what is short in red), the time, the order's description and the requirements; the owner preferred it to the original's single line (2026-10-21).
  HUD-002:
    rule: A hint goes away when the pointer leaves its button, when the selection changes or the button empties, and when a dialog opens; it never stays on the screen.
    source: [owner 2026-10-21 (third play-test)]
    status: implemented
  HUD-003:
    rule: An upgrade (towers, walls, gates, ships) is ordered from the same card as units and keeps its button with its count while being made.
    source: [owner 2026-10-21 (third play-test)]
    status: implemented
  HUD-004:
    rule: Names too long for the line wrap beside the stats instead of running under them.
    source: [owner 2026-10-21 (third play-test)]
    status: implemented
  HUD-005:
    rule: A selection of many units shows one icon per type with how many are selected and their average health.
    source: [owner 2026-10-20 (second play-test), manual The Selection View]
    status: implemented
    note: The manual says only the health is shown for several units.
  HUD-006:
    rule: Portraits wear the colour of the unit's kingdom.
    source: [owner 2026-10-20 (first play-test)]
    status: implemented
  HUD-007:
    rule: A selected unit is marked by the corners of its selection box, like a structure.
    source: [data IMAGES.INI selection, owner 2026-10-20 (before the second play-test)]
    status: implemented
  HUD-008:
    rule: Researched technologies and owned upgrades leave the card; orders that a technology unlocks appear once it is researched.
    source: ['data TECHTREE [orders]', owner 2026-10-20 (first play-test)]
    status: implemented
  HUD-009:
    rule: The interface can be placed along the bottom, the left or the right of the screen.
    source: [manual The Interface, data LAYOUT.INI LAYOUT1024H LAYOUT1024L LAYOUT1024R]
    status: missing
    work: STATUS work queue 12 (M8, owner decision 2026-10-21)
  HUD-010:
    rule: The resource bar at the top shows food, wood, stone and gold, the population against its limit, and the CHAT, DIPLOMACY and MENU buttons.
    source: [manual The Resource Bar]
    status: partial
    note: DIPLOMACY says "not available yet" and CHAT works only in multiplayer.
  HUD-011:
    rule: The chat screen opens with the CHAT button or Enter; the message goes to the allies, the enemies, everyone, or players picked from a list that shows each one's stance.
    source: [manual Chat Screen, manual Hot Keys]
    status: partial
    note: Multiplayer only, as a chat line where Tab cycles everyone, allies and enemies; there is no list of players to pick from.
    adr: [0168]
  HUD-012:
    rule: The diplomacy screen (DIPLOMACY, F5) shows each player's civilization and lets you choose ally, enemy or neutral towards him, offer shared vision, resources and unit control, and set allied victory; each button shows whether the other player agreed.
    source: [manual Diplomacy Screen, manual Hot Keys]
    status: missing
    note: The simulation has stances, sharing and allied victory (ADR 0102); the screen is not built.
  HUD-013:
    rule: The tribute screen (TRIBUTE, F6) sends gold, food, stone or wood to another player; a left click on the amount raises it and a right click lowers it; SEND or CANCEL.
    source: [manual The Tribute Screen, manual Hot Keys]
    status: missing
    note: The simulation has tribute (ADR 0102); the screen is not built.
  HUD-014:
    rule: The clock is a globe showing the time of day.
    source: [manual The Clock]
    status: implemented
    adr: [0173]
  HUD-015:
    rule: The minimap is a top-down view of the whole map with the units as dots in their kingdoms' colours, the trees and cliffs, and a white frame around the view; a click moves the view there, and with units selected a click there sends them.
    source: [manual The Mini Map]
    status: implemented
    note: Units are sent with a right click on the minimap.
  HUD-016:
    rule: The selection view shows the selected object's picture, name, kingdom, health, attack, mana, power, range, resistance (buildings), units inside, defence, time and level.
    source: [manual The Selection View]
    status: partial
    note: The kingdom, power, the number of units inside and the level are not shown.
  HUD-017:
    rule: The eye by the orders bar, lit when the selected object carries items, opens its inventory in the orders bar, where an item can be used or dropped.
    source: [manual The Inventory, manual Hints About Gameplay]
    status: missing
    note: Use and drop act on the first item; there is no inventory view.
  HUD-018:
    rule: In an inventory a left click uses an item, a right click drops it, Ctrl makes either instant, Alt+click makes it the default item, and < and > turn its pages.
    source: [manual Hot Keys]
    status: missing
  HUD-019:
    rule: Arrows by the orders bar reveal further order buttons when there are more than fit.
    source: [manual The Orders Bar]
    status: implemented
    note: A card of more than eight orders gets pages of seven and a page button.
  HUD-020:
    rule: The question mark on the orders bar opens the online help, whose topics explain every unit, building and technology and how to play.
    source: [manual The Orders Bar, data ORDERS.INI onlinehelp, help ITEMS.TXT]
    status: missing
    note: The help's 407 topics are in the original's HELP/ITEMS.TXT.
  HUD-021:
    rule: A selected castle or outpost shows, under its own health, a bar of the health of the units inside.
    source: [guide Important tips]
    status: missing
  HUD-022:
    rule: The kingdom of a spy is shown as its true kingdom to its owner.
    source: [patch 1.05 (TZAR110.TXT)]
    status: missing
    note: Spies cannot impersonate yet (MAG).
  HUD-023:
    rule: When a unit picked out of a selection dies, it is no longer picked out.
    source: [patch 1.09 (TZAR110.TXT)]
    status: implemented
  HUD-024:
    rule: Magic carpets show their selection, and a double click on a dragon selects the dragons.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
  HUD-025:
    rule: The fish patch a kingdom's boats are fishing is marked with a blue selection.
    source: [patch 1.05 (TZAR110.TXT)]
    status: missing
  HUD-026:
    rule: Messages tell the player what happens (a unit or technology is ready, an attack, a lack of resources or room) and Home goes to the last event, Page Up and Down through the earlier ones.
    source: [manual Hot Keys]
    status: implemented
  HUD-027:
    rule: The ` key shows the health bars while held, and Ctrl+` switches them on or off.
    source: [manual Hot Keys]
    status: implemented
  HUD-028:
    rule: The \ key shows the trees translucent so that units under them can be seen.
    source: [manual Hot Keys]
    status: partial
    note: Trees are drawn at 45 % opacity, not with the original's look.
  HUD-029:
    rule: An order shows only when its condition holds; the quest order only when there are quests.
    source: [data ORDERS.INI enable, data EQUATIONS.INI]
    status: missing
    note: The quest order is always there.
  HUD-030:
    rule: The minimap paints terrains, trees and cliffs in the colours of the terrain set's data.
    source: ['data TERRAIN.INI [minidatargb]']
    status: partial
    note: Tzar2 takes each tile's colour from its picture.
  HUD-031:
    rule: Selection marks and the selection box are drawn in the terrain set's selection colour (white in every set).
    source: ['data TERRAIN.INI [colors]']
    status: unclear
    note: Tzar2 draws own units green, enemies red and Nature yellow, and the box green; whether the original colours them by owner is to be confirmed.
  HUD-032:
    rule: A working peasant is named by its job, woodcutter, farmer, miner or builder.
    source: ['strings STRINGS.INI [peons]']
    status: missing
  HUD-033:
    rule: With nothing selected the card offers the kingdom's lists of heroes, spies and items, the quests, AI assistance, the next idle peasant and the online help.
    source: ['data MENU.INI [ownership] [ownership_ai]', 'data ORDERS.INI view_heroes view_spys view_items view_ai']
    status: partial
    note: The quests and the next idle peasant work; the lists of heroes, spies and items open empty, as the original fills them at run time.
