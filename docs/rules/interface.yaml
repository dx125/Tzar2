schema: tzar2-rules/1
prefix: HUD
title: The screen
rules:
  HUD-001:
    rule: An order button's hint gives its name, its hotkey, its price and what it still requires ("Create Knight - 'K' ( Gold:70 Food:120 ) Requires Stable, Plate Armor").
    source: [owner 2026-10-21 (third play-test; the original's hint), 'strings STRINGS3.INI [misc] req3']
    status: deviation
    note: Tzar2 shows a box with the name and a hotkey key cap, the price with the resource icons (what is short in red), the time, the order's description and the requirements; the owner preferred it to the original's single line (2026-10-21).
  HUD-002:
    rule: A hint goes away when the pointer leaves its button, when the selection changes or the button empties, and when a dialog opens; it never stays on the screen.
    source: [owner 2026-10-21 (third play-test)]
    status: implemented
  HUD-003:
    rule: An upgrade (towers, walls, gates, ships) is ordered from the same card as units and keeps its button with its count while being made.
    source: [owner 2026-10-21 (third play-test)]
    status: implemented
  HUD-004:
    rule: Names too long for the line wrap beside the stats instead of running under them.
    source: [owner 2026-10-21 (third play-test)]
    status: implemented
  HUD-005:
    rule: A selection of many units shows one icon per type with how many are selected and their average health.
    source: [owner 2026-10-20 (second play-test), manual The Selection View]
    status: implemented
    note: The manual says only the health is shown for several units.
  HUD-006:
    rule: Portraits wear the colour of the unit's kingdom.
    source: [owner 2026-10-20 (first play-test)]
    status: implemented
  HUD-007:
    rule: A selected unit is marked by the corners of its selection box, like a structure.
    source: [data IMAGES.INI selection, owner 2026-10-20 (before the second play-test)]
    status: implemented
  HUD-008:
    rule: Researched technologies and owned upgrades leave the card; orders that a technology unlocks appear once it is researched.
    source: ['data TECHTREE [orders]', owner 2026-10-20 (first play-test)]
    status: implemented
  HUD-009:
    rule: The interface can be placed along the bottom, the left or the right of the screen.
    source: [manual The Interface, data LAYOUT.INI LAYOUT1024H LAYOUT1024L LAYOUT1024R]
    status: deviation
    note: Tzar2 has one hybrid layout and no switch (the owner, 2026-10-24, fifth play-test; it replaces the side panels as a setting of 2026-10-21) - the top bar of LAYOUT1024H, the minimap and the day globe in LAYOUT1024L's corner, the selection view, the three boxes and the orders (two rows) with the info area in the middle of the bottom; the world view runs under them to the screen's edges.
  HUD-010:
    rule: The resource bar at the top shows food, wood, stone and gold, the population against its limit, and the CHAT, DIPLOMACY and MENU buttons.
    source: [manual The Resource Bar]
    status: implemented
    note: DIPLOMACY opens the diplomacy screen (HUD-012) and CHAT the chat screen (HUD-011), in single player too; the bar is the HUD's art (LAYOUT.INI).
  HUD-011:
    rule: The chat screen opens with the CHAT button or Enter; the message goes to the allies, the enemies, everyone, or players picked from a list that shows each one's stance.
    source: [manual Chat Screen, manual Hot Keys, data IMAGES/SCREENS/D_CHAT, 'community ReTzar src/hud.rs (Panel::Chat)']
    status: tested
    note: The chat screen (D_CHAT, ReTzar's places) has the line, ALL, ALLY, ENEMY and CUSTOM; CUSTOM opens the large window with a row per other kingdom (a check, its colour and name, a shield of the player's stance, whose place on the row is ours, UNVERIFIED). CHAT opens it in every game; in single player Enter opens it too, and its line takes the cheat codes. In multiplayer Enter still opens the overlay's chat line, where Tab cycles everyone, allies and enemies (ADR 0168). The window stands over the game, which shows dimmed behind it, says who the line goes to and which keys send and close it (the sixth play-test: it stood on a black screen, its buttons across its frame).
    adr: [0168]
  HUD-012:
    rule: The diplomacy screen (DIPLOMACY, F5) shows each player's civilization and lets you choose ally, enemy or neutral towards him, offer shared vision, resources and unit control, and set allied victory; each button shows whether the other player agreed.
    source: [manual Diplomacy Screen, manual Hot Keys, 'strings STRINGS.INI [diplomacy]']
    status: tested
    note: On the D_DIPLOMACY art; the screen sends its changes on ACCEPT. Where the parts sit on the panel and which race icon is which civilization are ours. The shared victory check is COMMON CHK: its upper frame is green (offered), the lower one red (not offered), by its pixels.
  HUD-013:
    rule: The tribute screen (TRIBUTE, F6) sends gold, food, stone or wood to another player; a left click on the amount raises it and a right click lowers it; SEND or CANCEL.
    source: [manual The Tribute Screen, manual Hot Keys, 'strings STRINGS.INI [tribute]']
    status: tested
    note: On the D_ADVANCED art, one row per kingdom with the four resources. A click moves an amount by 100 (ours, UNVERIFIED). One SEND carries every amount in one tick; the engine's one-second limit between tributes holds between ticks. TRIBUTE on the diplomacy screen opens it and SEND or CANCEL go back there.
  HUD-014:
    rule: The clock is a globe showing the time of day.
    source: [manual The Clock]
    status: implemented
    adr: [0173]
  HUD-015:
    rule: The minimap is a top-down view of the whole map with the units as dots in their kingdoms' colours, the trees and cliffs, and a white frame around the view; a click moves the view there, and with units selected a click there sends them.
    source: [manual The Mini Map]
    status: implemented
    note: Units are sent with a right click on the minimap.
  HUD-016:
    rule: The selection view shows the selected object's picture, name, kingdom, health, attack, mana, power, range, resistance (buildings), units inside, defence, time and level.
    source: [manual The Selection View]
    status: tested
    note: KINGDOM shows the kingdom's name; LEVEL every experienced unit's, the enemy's too, but traders' (ReTzar's reading of the original's view); POWER an item's on the ground (ReTzar shows it for potions). INSIDE shows for the player's own holders only (what the original shows of an enemy's is UNVERIFIED).
  HUD-017:
    rule: The eye by the orders bar, lit when the selected object carries items, opens its inventory in the orders bar, where an item can be used or dropped.
    source: [manual The Inventory, manual Hints About Gameplay, 'community ReTzar src/hud.rs (holder_enabled)']
    status: tested
    note: The eye (ORDERS holder) sits in the middle of the three boxes left of the orders bar, the arrows above and below it; which box holds which is ours. The focused unit's items show, else the first selected unit's. Of the art's four frames the eye is grey (the fourth) and does nothing while no selected unit carries items, lit (the third) while the inventory is open, open (the second) under the pointer, closed (the first) otherwise, as ReTzar draws the original's holder button (the fifth play-test found it lit with nothing selected).
  HUD-018:
    rule: In an inventory a left click uses an item, a right click drops it, Ctrl makes either instant, Alt+click makes it the default item, and < and > turn its pages.
    source: [manual Hot Keys]
    status: tested
    note: An item whose spell needs a target waits for a click on the world, as the card's orders do; Ctrl uses it at once. A dropped item falls where its carrier stands.
  HUD-019:
    rule: Arrows by the orders bar reveal further order buttons when there are more than fit.
    source: [manual The Orders Bar]
    status: tested
    note: A card of more than eight orders gets pages of eight, turned by the arrows (ORDERS left, right) above and below the eye.
  HUD-020:
    rule: The question mark on the orders bar opens the online help, whose topics explain every unit, building and technology and how to play.
    source: [manual The Orders Bar, data ORDERS.INI onlinehelp, help ITEMS.TXT, help HK.TXT, help HELP_STR.INI, data HELP/HELP_SCR]
    status: tested
    note: The kingdom's card opens it (P, MENU.INI [ownership]; the original's onlinehelp has no picture, Tzar2 shows it as a button). Chapters on the left (technologies, units, buildings, items, commands, how to, what is, hot keys), the topic's picture, title and text in the large panel, its links (built in, researched in, requires, allows, see also, what a building makes) in the middle one, the civilization selector and the pointer's hint in the bottom one; BACK goes through the pages seen. Where the original puts these on HELP_SCR/BACKGR is UNVERIFIED (no screenshot of its help); the orders bar's question mark itself is not drawn yet.
  HUD-021:
    rule: A selected castle or outpost shows, under its own health, a bar of the health of the units inside.
    source: [guide Important tips]
    status: implemented
    note: A thin bar under the holder's health shows the average health of the units inside, for every holder of the player.
  HUD-022:
    rule: The kingdom of a spy is shown as its true kingdom to its owner.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
    adr: [0184]
    note: Its owner sees it in the copied look and its own colour; other kingdoms see the copied unit and kingdom.
  HUD-023:
    rule: When a unit picked out of a selection dies, it is no longer picked out.
    source: [patch 1.09 (TZAR110.TXT)]
    status: implemented
  HUD-024:
    rule: Magic carpets show their selection, and a double click on a dragon selects the dragons.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
  HUD-025:
    rule: The fish patch a kingdom's boats are fishing is marked with a blue selection.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
    note: The frame carries each worker's work target; the patches the player's harvesting ships work get blue corners, the selection's shape (the original's exact blue is UNVERIFIED).
  HUD-026:
    rule: Messages tell the player what happens (a unit or technology is ready, an attack, a lack of resources or room) and Home goes to the last event, Page Up and Down through the earlier ones.
    source: [manual Hot Keys]
    status: implemented
  HUD-027:
    rule: The ` key shows the health bars while held, and Ctrl+` switches them on or off.
    source: [manual Hot Keys]
    status: implemented
  HUD-028:
    rule: The \ key shows the trees translucent so that units under them can be seen.
    source: [manual Hot Keys]
    status: partial
    note: Trees are drawn at 45 % opacity, not with the original's look; neither the data nor ReTzar says how the original does it.
    work: UI review screenshot 8 (docs/reviews/2026-10-ui-review.md)
  HUD-029:
    rule: An order shows only when its condition holds; the quest order only when there are quests.
    source: [data ORDERS.INI enable, data EQUATIONS.INI]
    status: tested
    note: The card reads an order's ENABLE through EQUATIONS.INI; the one condition the data has, QuestCount (view_quests), hides the quest order while no quest is open. A condition the card does not know keeps its order.
  HUD-030:
    rule: The minimap paints terrains, trees and cliffs in the colours of the terrain set's data.
    source: ['data TERRAIN.INI [minidatargb]']
    status: tested
    note: A tile takes the colour of the terrain most of its four corners have (ties the top-left one's), which is Tzar2's choice; the map holds terrains per corner. Without the section the tile's picture gives the colour.
  HUD-031:
    rule: Selection marks and the selection box are drawn in the terrain set's selection colour (white in every set).
    source: ['data TERRAIN.INI [colors]']
    status: unclear
    note: Tzar2 draws own units green, enemies red and Nature yellow, and the box green; whether the original colours them by owner is to be confirmed.
    work: UI review screenshot 9 (docs/reviews/2026-10-ui-review.md)
  HUD-032:
    rule: A working peasant is named by its job, woodcutter, farmer, miner or builder.
    source: ['strings STRINGS.INI [peons]']
    status: tested
    note: Also explorer, invader, fighter, cowherd, collector and passenger.
  HUD-033:
    rule: With nothing selected the card offers the kingdom's lists of heroes, spies and items, the quests, AI assistance, the next idle peasant and the online help.
    source: ['data MENU.INI [ownership] [ownership_ai]', 'data ORDERS.INI view_heroes view_spys view_items view_ai', 'community ReTzar src/hud.rs (0x49f1fc, 0x49d590)']
    status: tested
    note: The kingdom's card shows with nothing selected. The quests, AI assistance, the next idle peasant and the lists of heroes, spies (and ninjas) and carried items work; an entry selects the unit (an item, its carrier) and shows it. A hero is a promoted unit or one with a name of its own; heroes inside the kingdom's buildings are listed too, and their entry selects the building. The online help opens with P (HUD-020). Not done - the original also lists the heroes of kingdom 1 when the player is its ally.
  HUD-034:
    rule: The hint of a category of the build menu lists the letters of the buildings in it.
    source: [owner 2026-10-21 (fourth play-test)]
    status: deviation
    note: The original's categories have no letter of their own (MENU.INI); the owner asked to see shortcuts for them too, and the letters of what is inside work from the build menu (CTRL-029).
  HUD-035:
    rule: A building's card offers every order of its menu, those without a letter too; the guilds, the temples and the mage towers research there.
    source: ['data MENU.INI (e_warguild, cathedral, e_tcguild, e_magetower)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: MENU.INI lists that research as bare lines (te_heroism) with no letter; the card had skipped them, so the Warriors' Guild was empty and the other guilds, the temples and the mage towers lacked their research. A bare word that is no order (capturekeys) is a flag of the menu, not a button.
