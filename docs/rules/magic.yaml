schema: tzar2-rules/1
prefix: MAG
title: Magic, religion and spies
rules:
  MAG-001:
    rule: Only mages cast spells; each spell needs its technology and costs mana, which every caster has on its own and which comes back over time.
    source: [manual Production Of Units, help ITEMS.TXT WI_SPELLS]
    status: tested
    note: The mana costs and ranges are ReTzar's (MAG-023), there are no cooldowns (MAG-025) and the regeneration is 2 a second (MAG-026).
  MAG-002:
    rule: European mages cast lightning and freeze, make units invisible and summon bats and stone golems.
    source: [manual European Units (Mage)]
    status: tested
    note: The spells' strength is a placeholder (UNK-26).
  MAG-003:
    rule: Asian mages turn units to stone, make whirlpools that destroy ships, cast flame bolts, summon dragons and turn mana into experience.
    source: [manual Asian Units (Mage)]
    status: tested
    note: The spells' strength is a placeholder (UNK-26).
  MAG-004:
    rule: Arabian mages summon magic carpets and jinn, raise the dead as skeletons, and cast magic vision and rain of fire.
    source: [manual Arabian Units (Mage)]
    status: tested
    note: The spells' strength is a placeholder (UNK-26).
  MAG-005:
    rule: Rain of fire burns everyone under it, the caster's own units included.
    source: [manual Hints About Gameplay]
    status: tested
  MAG-006:
    rule: Raise the dead works on corpses, never on buildings.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
  MAG-007:
    rule: Confusion makes the units it hits hostile to everyone for a while.
    source: [manual Asian technologies (Confusion)]
    status: tested
  MAG-008:
    rule: Hypnosis gives the unit to the caster's kingdom for 30 s, which commands it and whose side it fights on, while it keeps its own kingdom's colours and population; then it goes back. A new hypnosis restarts the time. Only spell books cast it (v1.10 puts the manual's Hypnotism on no command card).
    source: [manual Asian Buildings (Mage Tower), data ORDERS.INI spell_hypnotize, 'community ReTzar src/gameplay.rs (0x473887, 0x4e59b2, 0x4e5c4b)']
    status: tested
    adr: [0250]
    note: The original changes only the unit's command and side; Tzar2 hands the unit over, so for those 30 s its attack, defence and hit points follow the caster's technologies.
  MAG-009:
    rule: Priests heal units (with Healing) and bless them (Bless raises their attack for a while); Medicine lets them heal from farther; Arabian priests also exorcise, which Inquisition makes stronger.
    source: [manual Civilizations (Priest), manual Researching Technologies]
    status: tested
  MAG-010:
    rule: Priests are very good against mages and magic creatures.
    source: [manual Hints About Gameplay, guide Unit Discussion]
    status: tested
    note: From BONUS.INI (the test reads an imported package, local only).
  MAG-011:
    rule: Asian priests are made from monks.
    source: [manual Asian Units (Priest)]
    status: tested
    note: ConvertsFrom monk, order become_priest (the test reads an imported package, local only); the conversion itself is the Jihad warriors' (MAG-019).
  MAG-012:
    rule: Spies (with Espionage) can impersonate any man of another kingdom, of any civilization, from next to him; not machines, flyers or magic creatures. The spy becomes that unit, with all its stats, under its own player's control, and the spy itself is gone; its old kingdom still sees one of its own. Revealing turns it back into a spy. Fighting keeps the disguise; a spy of the copied kingdom unmasks it when it comes close enough in front of it, towers do not.
    source: [manual European Units (Spy), data ORDERS.INI impersonate reveal_self, 'data MENU.INI [spy_add]', help ITEMS.TXT C_IMPERSONATE C_REVEAL, 'data BONUS.INI [groups] machines ships magic_creatures', owner 2026-10-21 (answers), owner 2026-10-21 (disguise meter), capture capture-20261021-203846, owner 2026-10-21 (impersonation takes the unit over), owner 2026-10-21 (a spy unmasks only what it faces), owner 2026-10-22 (unmasked from 4 tiles at a meter of 8), capture capture-20261022-011438]
    status: tested
    adr: [0184]
    note: Batch J (manual.yaml spy-disguise) showed the takeover with a peasant of kingdom 2, a third kingdom's spy never unmasking, and kingdom 2's spies unmasking at about 3.4 tiles with a fresh meter and only right next to it with a full one; Tzar2 uses 4 tiles for an empty meter down to 1 for a full one, in front of the spy (the facing direction or the two next to it). Spies handed over with hmkingdom never unmasked anything, a cheat artefact. The mage is in BONUS.INI's magic_creatures but is a man, and the chariot is not among the machines; the owner confirmed that both can be copied. A revealed spy's meter goes on counting in the original; Tzar2 shows 100.
  MAG-013:
    rule: Spies and ninjas see through each other's invisibility, and a cloaked ninja can drop its cloak (uncloak).
    source: [patch 1.05 (TZAR110.TXT), 'data MENU.INI [ninja_cloaked] uncloak', data ORDERS.INI uncloak]
    status: tested
    note: Uncloak is on the cloaked ninja's own card (MENU.INI ninja_cloaked), not a spy's order; the card switches to it while the unit is cloaked.
  MAG-014:
    rule: Ninjas (Asians, with Ninjas) cloak themselves and murder units.
    source: [manual Asian Units (Ninja)]
    status: tested
  MAG-015:
    rule: European and Arabian peasants, with Bribery, bribe enemy units over to their kingdom; peasants and crusaders cannot be bribed.
    source: [manual Researching Technologies (Bribery), help ITEMS.TXT HT_BRIBE, patch 1.05 (TZAR110.TXT)]
    status: tested
    note: The price is a placeholder (UNK-26).
  MAG-016:
    rule: With Fanaticism and Crusade the cathedral preaches a crusade; the crusaders appear at an anchor placed no farther than 4 tiles from the cathedral.
    source: [manual Researching Technologies (Crusade), patch 1.09 (TZAR110.TXT), community ReTzar src/gameplay.rs (0x439760)]
    status: tested
    note: A crusade takes every crusader gathered (16 at the start), one arriving every 500 ms.
    adr: [0190]
  MAG-017:
    rule: After all crusaders have died a full crusade needs some time; one preached earlier brings fewer crusaders for the same price.
    source: [patch 1.09 (TZAR110.TXT), community ReTzar src/gameplay.rs (0x422ca0 and 0x43a010)]
    status: tested
    note: Each cathedral gathers a crusader every 12, 8, 4 or 1 s by the time played, up to 16 + 4 per full crusade (36); after the crusaders have died the count starts again from 4.
    adr: [0190]
  MAG-018:
    rule: A crusader dying in a ship or a building, or impersonated by a spy who then reveals himself, is counted out of the crusade.
    source: [patch 1.06 (TZAR110.TXT)]
    status: tested
    note: Deaths in ships and buildings count (the test: a ship); a spy in a crusader's look never joins a crusade (ADR 0184), so its reveal leaves the count right.
  MAG-019:
    rule: With Fanaticism and Jihad, Arabian peasants become Jihad warriors.
    source: [manual Arabian Units (Jihad Warrior)]
    status: tested
  MAG-020:
    rule: Units under a stone spell take no damage.
    source: [community TDD GAME-11]
    status: tested
  MAG-022:
    rule: Healing, freezing, the curse and raise dead do not take on machines (golems, siege engines, magic carpets, ships, ghosts, skeletons, fishing boats), and creatures that leave no body (bats, golems, carpets, mages, dwarves, orcs, jinns, ghosts, skeletons, dragons) cannot be raised.
    source: ['community ReTzar src/gameplay.rs (0x2719, 0x271c)']
    status: tested
    adr: [0254]
  MAG-023:
    rule: Each spell has the original's range and mana. Ranges in tiles - fire rain 14; lightning, freeze and confusion 12; heal 3 (5 with Medicine); the golem, carpet, dragon and jinn summons 4; bats and whirlpool 16; magic vision anywhere; stone 20; flame bolt 18; Mastery 1; the rest 8. Mana - fire rain 100, heal 4, freeze 60, confusion and raise dead 70, magic vision 30, Mastery 10, the rest 50; summons cost their creature's mana.
    source: ['community ReTzar src/gameplay.rs (0x4721e0, 0x4723e0)']
    status: tested
    adr: [0260]
    note: The ranges are counted edge to edge here; how the original measures them (cells between centres or edges) is not settled.
  MAG-024:
    rule: The spells have the original's strength. Heal gives 6 hit points; bless adds 5 attack to the friendly units within 4 tiles for 30 s; lightning deals 150; freeze holds every unit within 3 tiles of its impact for 20 s, without defence, and deals up to 40 but never kills; invisibility lasts 45 s; stone 2 to 5 minutes; confusion takes every unit within 2 tiles for 20 s; the flame bolt deals 60; magic vision lasts 60 s; raise dead raises every body within 8 tiles of the caster.
    source: ['community ReTzar src/gameplay.rs (0x472ff1, 0x4e5809, 0x472e83, 0x432590, 0x4734a1, 0x473913, 0x473250, 0x473b44, 0x4735ac, 0x47367c)']
    status: tested
    adr: [0261, 0263]
    note: Fire rain is twenty fireballs of 40, one every 170 ms, each falling 375 ms on a random tile within 2 of the point and hitting what meets the 5 by 5 tiles around it; the whirlpool forms on water only, deals 20 to every ship on its 3 by 3 tiles each 250 ms, wanders a tile every 2 s and is gone after 30 s (ADR 0263). The cooldowns and cast times stay UNVERIFIED (UNK-26). The original's heal casts again while the unit is hurt; Tzar2's casts once.
  MAG-025:
    rule: A caster waits for nothing between its spells but its mana; a spell costs no time of waiting after it is cast.
    source: ['community ReTzar src/gameplay.rs (0x4e1c30, 0x4e1d2e)']
    status: tested
    adr: [0266]
    note: Tzar2 had a cooldown of 1.5 to 5 s per spell (UNVERIFIED); the classic ruleset now has none, the field stays for other rulesets. Not done - a caster short of mana should take the order, walk into range and only then stand idle, looking again in 2 s (0x4e1c30); Tzar2 refuses the order at once (its maximum is raised to the cost all the same, MAG-027).
  MAG-026:
    rule: Once a second a kingdom's caster regains 2 mana and a neutral one 1; each Concentration adds 4 for the kingdom.
    source: ['community ReTzar src/gameplay.rs (0x502ea2)']
    status: tested
    adr: [0267]
  MAG-027:
    rule: A caster ordered to cast a spell that costs more than its whole pool has its pool raised to the cost; a summon costs its creature's mana.
    source: ['community ReTzar src/gameplay.rs (0x4e1c30, 0x4e1d0a, 0x4723e0)', 'data the manna of the summoned creatures (bat 25, jinn 300, carpet 500, stone golem 600, dragon 800), above every caster''s pool of 100']
    status: tested
    adr: [0267]
    note: The pump picture plays over the caster (the ManaRaised event, ReTzar 0x4e1d0a).
  MAG-028:
    rule: A ninja's murder is one blow of fifteen times its attack, through the target's defence, which spends all its mana; it takes any unit, the Messiah too, and a ninja with 60 mana ordered to attack a unit murders it with its first blow.
    source: ['community ReTzar src/gameplay.rs (0x4e076a, 0x437250, 0x4eb950, 0x4e197d)', 'guide Campaign Discussion (Mission 18)']
    status: tested
    adr: [0268]
    note: The mana the murder order needs (50) is UNVERIFIED.
  MAG-021:
    rule: A spy's name in the selection view carries its disguise meter, "Spy (N)", up to 100. In its own look it shows 100; a new look starts it at 0, and it gains a point every 1.25 s; the fuller it is, the closer the copied kingdom's spies must come to unmask it, right next to it at 100.
    source: [owner 2026-10-21 (disguise meter), capture capture-20261021-203846, capture capture-20261022-011438]
    status: tested
    adr: [0184]
    note: Measured in batch J (manual.yaml spy-disguise). Tzar2 lets the copied kingdom's spy unmask within 4 tiles for an empty meter down to 1 for a full one, in proportion (gameplay.unmaskReachFreshPercent, unmaskReachFullPercent). The owner's description adds "or trains", which is not modelled.
