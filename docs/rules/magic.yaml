schema: tzar2-rules/1
prefix: MAG
title: Magic, religion and spies
rules:
  MAG-001:
    rule: Only mages cast spells; each spell needs its technology and costs mana, which every caster has on its own and which comes back over time.
    source: [manual Production Of Units, help ITEMS.TXT WI_SPELLS]
    status: tested
    note: Mana costs, cooldowns and the regeneration rate are placeholders (UNK-26).
  MAG-002:
    rule: European mages cast lightning and freeze, make units invisible and summon bats and stone golems.
    source: [manual European Units (Mage)]
    status: tested
    note: The spells' strength is a placeholder (UNK-26).
  MAG-003:
    rule: Asian mages turn units to stone, make whirlpools that destroy ships, cast flame bolts, summon dragons and turn mana into experience.
    source: [manual Asian Units (Mage)]
    status: tested
    note: The spells' strength is a placeholder (UNK-26).
  MAG-004:
    rule: Arabian mages summon magic carpets and jinn, raise the dead as skeletons, and cast magic vision and rain of fire.
    source: [manual Arabian Units (Mage)]
    status: tested
    note: The spells' strength is a placeholder (UNK-26).
  MAG-005:
    rule: Rain of fire burns everyone under it, the caster's own units included.
    source: [manual Hints About Gameplay]
    status: tested
  MAG-006:
    rule: Raise the dead works on corpses, never on buildings.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
  MAG-007:
    rule: Confusion makes the units it hits hostile to everyone for a while.
    source: [manual Asian technologies (Confusion)]
    status: tested
  MAG-008:
    rule: Hypnotism (Asian, from Concentration) is a spell of the Asian mages.
    source: [manual Asian Buildings (Mage Tower)]
    status: unclear
    note: Neither the manual nor the game's text says what it does; Tzar2 makes it hold the unit like freeze.
  MAG-009:
    rule: Priests heal units (with Healing) and bless them (Bless raises their attack for a while); Medicine lets them heal from farther; Arabian priests also exorcise, which Inquisition makes stronger.
    source: [manual Civilizations (Priest), manual Researching Technologies]
    status: tested
  MAG-010:
    rule: Priests are very good against mages and magic creatures.
    source: [manual Hints About Gameplay, guide Unit Discussion]
    status: implemented
    note: From the bonus table.
  MAG-011:
    rule: Asian priests are made from monks.
    source: [manual Asian Units (Priest)]
    status: implemented
  MAG-012:
    rule: Spies (with Espionage) can impersonate any man of another kingdom, of any civilization, from next to him; not machines, flyers or magic creatures. The spy becomes that unit, with all its stats, under its own player's control, and the spy itself is gone; its old kingdom still sees one of its own. Revealing turns it back into a spy. Fighting keeps the disguise; another kingdom's spy close by unmasks it, towers do not.
    source: [manual European Units (Spy), data ORDERS.INI impersonate reveal_self, 'data MENU.INI [spy_add]', help ITEMS.TXT C_IMPERSONATE C_REVEAL, 'data BONUS.INI [groups] machines ships magic_creatures', owner 2026-10-21 (answers), owner 2026-10-21 (disguise meter), capture capture-20261021-203846, owner 2026-10-21 (impersonation takes the unit over)]
    status: partial
    adr: [0184]
    note: Tzar2 still leaves the copied unit with its kingdom and gives the spy only its look (ADR 0184); taking the unit over is next (STATUS work queue 3). Batch J's first run showed it with the spy's own kingdom's peasant (the peasant's place, portrait, attack and card under the name "Spy (N)"); the owner confirmed it for another kingdom's units. Only the copied kingdom's spies unmask it: in batch J's third run, a spy in its own kingdom's peasant's look was never unmasked by kingdom 2's spy, not even while they fought. The data gives no distance; Tzar2 uses the spy's detector radius (5 tiles, UNVERIFIED) until batch J's fourth run measures it. The mage is in BONUS.INI's magic_creatures but is a man, and the chariot is not among the machines; the owner confirmed that both can be copied.
    work: STATUS work queue 3
  MAG-013:
    rule: Spies and ninjas see through each other's invisibility, and a cloaked ninja can drop its cloak (uncloak).
    source: [patch 1.05 (TZAR110.TXT), 'data MENU.INI [ninja_cloaked] uncloak', data ORDERS.INI uncloak]
    status: tested
    note: Uncloak is on the cloaked ninja's own card (MENU.INI ninja_cloaked), not a spy's order; the card switches to it while the unit is cloaked.
  MAG-014:
    rule: Ninjas (Asians, with Ninjas) cloak themselves and murder units.
    source: [manual Asian Units (Ninja)]
    status: tested
  MAG-015:
    rule: European and Arabian peasants, with Bribery, bribe enemy units over to their kingdom; peasants and crusaders cannot be bribed.
    source: [manual Researching Technologies (Bribery), help ITEMS.TXT HT_BRIBE, patch 1.05 (TZAR110.TXT)]
    status: tested
    note: The price is a placeholder (UNK-26).
  MAG-016:
    rule: With Fanaticism and Crusade the cathedral preaches a crusade; the crusaders appear at an anchor placed no farther than 4 tiles from the cathedral.
    source: [manual Researching Technologies (Crusade), patch 1.09 (TZAR110.TXT)]
    status: tested
    note: The number of crusaders is a placeholder (UNK-26).
  MAG-017:
    rule: After all crusaders have died a full crusade needs some time; one preached earlier brings fewer crusaders for the same price.
    source: [patch 1.09 (TZAR110.TXT)]
    status: partial
    note: Tzar2 refuses a crusade during the wait instead of bringing fewer crusaders.
  MAG-018:
    rule: A crusader dying in a ship or a building, or impersonated by a spy who then reveals himself, is counted out of the crusade.
    source: [patch 1.06 (TZAR110.TXT)]
    status: implemented
    note: Deaths in ships and buildings count; a spy in a crusader's look never joins a crusade (ADR 0184), so its reveal leaves the count right.
  MAG-019:
    rule: With Fanaticism and Jihad, Arabian peasants become Jihad warriors.
    source: [manual Arabian Units (Jihad Warrior)]
    status: tested
  MAG-020:
    rule: Units under a stone spell take no damage.
    source: [community TDD GAME-11]
    status: tested
  MAG-021:
    rule: A spy's name in the selection view carries its disguise meter, "Spy (N)", up to 100. In its own look it shows 100; a new look starts it at 0, and it gains a point every 1.25 s; at 100 the spy can hardly be unmasked.
    source: [owner 2026-10-21 (disguise meter), capture capture-20261021-203846]
    status: tested
    adr: [0184]
    note: Measured in batch J's first run (manual.yaml spy-disguise). How the meter weighs against the unmasking spy is not measured yet; Tzar2 lets another kingdom's spy unmask it within (100 - meter) % of its detector radius (UNVERIFIED). The owner's description adds "or trains", which is not modelled.
