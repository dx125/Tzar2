schema: tzar2-rules/1
prefix: SCN
title: Scenario scripts
rules:
  SCN-001:
    rule: A count of objects by type or category over several kingdoms adds up the objects of all of them and compares the total with the count; the specification's Any or All plays no part in it.
    source: ['community ReTzar src/gameplay/scripting.rs (select: a selection by class counts the listed kingdoms together)']
    status: tested
    note: saa12's "belowfiftytroops" (military units of kingdoms 1 and 6, at most 50) spawned 70 reinforcements every second for as long as the player alone had fewer than 50, thousands of units, while the counts were compared per kingdom (UNK-54).
  SCN-002:
    rule: A rule tests its condition again every second; a rule with Keep Rule runs its actions again each second its condition holds.
    source: ['community ReTzar src/gameplay/scripting.rs (PERIOD 1000 ms, 0x4b6a70, 0x4bd770)']
    status: tested
    note: TriggerOptions.IntervalMs, 1000 ms.
  SCN-003:
    rule: A map's sound sources each keep their own timer - every so many seconds, looped, at random times between two, or once after a delay - heard from their object or their point; one still sounding waits a second, one whose object left the game falls silent, and one not yet appeared is not heard.
    source: ['community ReTzar src/gameplay.rs (map_sounds: message 0x2009, 0x502953, the timer started at loading 0x505580)', 'editor-manual Custom sounds']
    status: tested
    adr: [0284]
    note: Until ADR 0284 the editor stored the sources and the game never played them. Tzar2 counts game time, paused with the game; the original counts real seconds scaled by the game speed when a timer is set. A looped sound is started again as soon as it ends (looked at every 2 s), not played as a looping stream.
  SCN-004:
    rule: A map's own pictures, sounds and music are those its scenario shows and plays - the pictures and sounds of its scrolls and story screens, the voices of its phrases, its music list - and a placed object shows its own portrait and title.
    source: ['editor-manual User resources', 'community ReTzar src/frontend/gameplay.rs (a phrase bubble shows its speaker''s large portrait)', 'community ReTzar src/world.rs (label: a named object with its subtitle)']
    status: implemented
    adr: [0284]
    note: Until ADR 0284 the client looked for them in the base package only and found none. A phrase without a picture of its own shows its speaker's large portrait. The map's music list plays shuffled, song after song; only MIDI songs play (the client has no OGG music yet).
  SCN-005:
    rule: $difficulty reads the game's difficulty - 0 easy, 1 normal, 2 hard, as chosen on the campaign screen or the custom map's setup - whatever the current object; writing it changes nothing.
    source: ['community ReTzar src/gameplay/scripting.rs (Global::Difficulty = the game rules'' difficulty; set_global ignores it)', 'data Campaign/Tzar.wcm (enemy waves at (6-$difficulty) * 60000 ms, a computer kingdom''s gift of 2300 + $difficulty * 400 food)']
    status: tested
    adr: [0287]
    note: Read 0 before ADR 0287, so the main campaign played its normal and hard missions with the easy waves and gifts. A campaign save now keeps its difficulty (it resumed at normal).
  SCN-006:
    rule: $candelobjects = 0 forbids the human player to delete objects, another value allows it again; reading it gives 0.
    source: ['community ReTzar src/script/expr.rs ($candelobjects, write only, 0x5cf6b0 = !value)', 'community ReTzar src/frontend/mission.rs (delete_selection does nothing while it is set)']
    status: tested
    adr: [0287]
    note: The main campaign sets it in five missions. Tzar2 refuses the human kingdoms' Delete commands in the simulation (ScenarioForbids) and the game says so; computer kingdoms are not bound.
  SCN-007:
    rule: $canusediplomacy = 0 closes diplomacy and tribute to the human player, another value opens them again; reading it gives 0.
    source: ['community ReTzar src/script/expr.rs ($canusediplomacy, write only, 0x5877a0)', 'community ReTzar src/frontend/gameplay.rs (the diplomacy window, and the tribute window over it, stay closed)']
    status: tested
    adr: [0287]
    note: No original map sets it. Tzar2 refuses the human kingdoms' diplomacy and tribute commands and does not open their windows.
  SCN-008:
    rule: $isselected of an object reads 1 while the human player has it selected, else 0.
    source: ['community ReTzar src/gameplay/scripting.rs (Property::IsSelected: selected by the local player; $flags has it as bit 0)', 'data Campaign/TzarTutorial.wcm (its first lessons wait for $isselected == 1)']
    status: tested
    adr: [0287]
    note: Read 0 before ADR 0287, so the tutorial's selection lessons never went on. The selection is the interface's, so the client tells the simulation what the player selects (a ScenarioSelect command), only for a scenario that reads $isselected or $flags. $flags models only that bit; $program (the order) still reads 0.
  SCN-009:
    rule: A campaign map gives each computer kingdom the AI its kingdom table sets - the economy, war, both or none - and @setai(kingdom, mode) changes it during play (0 none, 1 economy, 2 war, 3 both); a map whose computers the custom setup chose plays them whole.
    source: ['community ReTzar src/gameplay/ai.rs (State::start: a computer player only for kingdoms whose ai_mode & 3 is not 0; command: none, eco, war, full)', 'community ReTzar src/gameplay/scripting.rs (Function::SetAi, 0x4b82e0 -> 0x404460)', 'data Campaign/Tzar.wcm (@setai(2, 3), @setai(4, 2); many kingdoms with no AI or one half)']
    status: tested
    adr: [0288]
    note: Before ADR 0288 every computer kingdom of a campaign ran its whole AI from the start, so the story's idle kingdoms built and attacked. @setai leaves a human kingdom's own computer (AI assistance) alone; one on a kingdom without a computer does nothing (the original makes one).
  SCN-010:
    rule: Player Lose defeats the listed kingdoms and makes every other kingdom still in the match a winner, which ends it; Player Win makes the listed ones winners and defeats the others.
    source: ['community ReTzar src/gameplay/scripting.rs (Action::Lose and Action::Win: listed == win -> won, else lost, for kingdoms 1-8; end)']
    status: tested
    adr: [0288]
    note: Before ADR 0288 Player Lose only defeated the listed kingdoms and the match went on (UNK-50). The rescue kingdom wins nothing.
  SCN-011:
    rule: '@settime(hour) sets the day clock to that hour, minute 0, and it runs on from there; an hour of 24 or more does nothing; it gives 1.'
    source: ['community ReTzar src/gameplay/scripting.rs (Function::SetTime, 0x4b86e3 -> 0x42b520: the low byte, under 24)', 'data Campaign/Tzar.wcm (@settime(22), @settime(21))']
    status: tested
    adr: [0288]
    note: Tzar2 keeps the shift in the trigger state; the clock only moves when the game has day and night.
  SCN-012:
    rule: '@god(1) makes the current object take no damage and @god(0) ends it; @build() finishes the current object when it is a construction site, as any finished site.'
    source: ['community ReTzar src/gameplay/scripting.rs (Function::God 0x4b869f: the object''s god flag, 1 with an object, else 0; Function::Build 0x4b83a0: 999999 of building)', 'data Campaign/Tzar.wcm (@god(1), @build())']
    status: tested
    adr: [0288]
  SCN-013:
    rule: '@rnd(a, b) gives a value from a to b, both included, and a when b is below a; @str gives 1; @kingdomcanrescue gives 1 for a kingdom that exists; @getdiplomacy(a, b) gives the relation word of a towards b - 0x40 ally, 0x20 neutral, 0x10 enemy, plus what a offers b: 1 vision, 2 resources, 4 units.'
    source: ['community ReTzar src/gameplay/scripting.rs (call: Rnd a + random(max(1, b - a + 1)), Str, KingdomCanRescue, GetDiplomacy = relation)']
    status: tested
    adr: [0288]
    note: Tzar2 swapped reversed @rnd bounds and read @getdiplomacy as 0 ally, 1 enemy, 2 neutral (UNK-53, UNK-64). No original map calls @getdiplomacy or @str.
  SCN-014:
    rule: Explore Area shows the human player the ground round the area's middle for the time given, 4 seconds when the time is 0, within (width + height) / 4 tiles when that is 1 to 31, else 8.
    source: ['community ReTzar src/gameplay/scripting.rs (Action::Explore, 0x4bc3dc; 4000 ms for 0 at 0x435069; else the fog revealer''s fog_range)']
    status: tested
    adr: [0288]
    note: Before ADR 0288 an Explore Area of 0 ms showed the area for one tick (UNK-56).
