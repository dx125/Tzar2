schema: tzar2-rules/1
prefix: ITEM
title: Items
rules:
  ITEM-001:
    rule: Items lie on the map; units pick them up with the pick-up order or a right click on them, and carry them in an inventory of pages.
    source: [manual Items, manual Hints About Gameplay, help ITEMS.TXT HT_USE_ITEMS]
    status: tested
    note: The inventory cannot be viewed (HUD-017).
  ITEM-002:
    rule: A weapon raises its carrier's attack and armour its defence.
    source: [manual Items, manual Hints About Gameplay]
    status: tested
  ITEM-003:
    rule: A spell book lets any unit carrying it cast its spell, for a number of charges.
    source: [manual Items, help ITEMS.TXT WI_SPELLS]
    status: tested
  ITEM-004:
    rule: A scroll holds a text of the story, shown when it is used.
    source: [manual Items]
    status: implemented
  ITEM-005:
    rule: A potion heals its carrier.
    source: [manual Items]
    status: tested
  ITEM-006:
    rule: A resource item gives its resources to the kingdom.
    source: [manual Items]
    status: tested
  ITEM-007:
    rule: Some items must be used at a place; the Fire Rain book makes fire rain where the player clicks, on everyone there, own units included.
    source: [manual Hints About Gameplay]
    status: implemented
    note: The inventory (HUD-017) picks the book; its targeted spell waits for the click.
  ITEM-008:
    rule: Only the Arabians make items, in the magic workshop after Witchcraft; the player picks the kind (books, potions, or weapons and shields) and the item, and how much gold to spend; better items cost more and take longer.
    source: [manual Producing Items, help ITEMS.TXT HT_CREATE_ITEMS, owner 2026-10-21 (answers)]
    status: tested
    note: The D_BUILD panel has the three kind toggles, the item, the gold, CANCEL and BUILD, as the owner's screenshot shows; a book shows its spell's picture. Where the toggles sit on the horizontal panel is ours.
  ITEM-009:
    rule: Magic books made in the magic workshop cost four times more and take twice as long.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
  ITEM-010:
    rule: A soul item kills a unit or makes it go berserk. Soul Bind leaves the target with its owner and puts a soul bound to it in the caster's inventory; item_kill strikes the bound unit dead (heroes too), item_berserk sends it berserk for 20 s, and the soul stays; it goes when its unit dies. A soul bound to nobody does nothing.
    source: [data ORDERS.INI item_kill item_berserk, 'data MENU.INI [item_soul]', 'community ReTzar src/gameplay.rs (0x473403, 0x465340, 0x4e219f)']
    status: tested
    adr: [0255]
    note: The TDD's "a hero is not killed" came from no source; the original's soul strikes 10,000. A soul on the ground can be commanded by anyone in the original; Tzar2's orders come from the inventory only (a click kills, Ctrl + click sends berserk).
  ITEM-011:
    rule: The items of a dead unit fall to the ground.
    source: [community TDD GAME-10]
    status: tested
  ITEM-012:
    rule: A unit that picks up a magic book has yellow stars floating above it.
    source: [patch 1.09 (TZAR110.TXT)]
    status: tested
    note: Three of the original's magic stars float over the unit's head.
  ITEM-013:
    rule: The Curse spell book works.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
  ITEM-014:
    rule: Two units reaching an item at once never both get it.
    source: [community TDD ORIG-11]
    status: deviation
    note: Fixes the original's item cloning (TDD §5, ORIG-11).
  ITEM-015:
    rule: The random items of a map take their strength from the data (treasure, weapons, armour, potions).
    source: ['data RES.INI [TreasuryItem] [WeaponItem] [ArmourItem] [PotionItem]']
    status: missing
  ITEM-016:
    rule: Each kind of item the magic workshop makes has several items, books of different spells, potions of different effects, and weapons for attack or defence (swords, bows, shields).
    source: ['data IMAGES.INI item_book1-3 item_potion1-8 item_sword1-3 item_bow1-3 item_shield1-3', 'strings STRINGS3.INI [orders_names] book_itm potion_itm power_itm', 'strings STRINGS3.INI [tzaredit] health3 exp3 manna3 defence3 attack3 sword3 shield3 bow3', owner 2026-10-21 (answers)]
    status: tested
    adr: [0186]
    note: Each item keeps its own effect, spell and look. The workshop makes a book of any of 20 spells, a potion of health, levels, mana, attack or defence, and a sword, bow or shield (power items, ITEM_PLUSPLUS). Maps give their items the numbers of their records. Which spells and potion colours the workshop offers, a book's minimum gold (goldreq) and how gold becomes a potion's amount are UNVERIFIED.
  ITEM-017:
    rule: The random map generator places weapons and shields, spell books and potions, R(1, 10) plus a 32nd of the side of each, each item with its own picture and strength - a book one of seven spells with 1 to 5 charges, a bow, shield or sword 5 to 15, a potion of health or mana 10 to 50, or of levels, attack or defence 2 to 8.
    source: ['community ReTzar src/random_map.rs (0x4b5b14, 0x4b5c50)']
    status: tested
    adr: [0264]
    note: The items' distance from the castles is ours; the book's value of 1 to 3 is kept as its power (UNVERIFIED what the original does with it).
