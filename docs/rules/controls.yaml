schema: tzar2-rules/1
prefix: CTRL
title: Selection, mouse and pointers
rules:
  CTRL-001:
    rule: A click takes the unit whose picture's middle is nearest the point, within 30 pixels each way, among the units on the clicked tile and the tiles round it; else the newest object on the clicked tile, a unit standing there or a building or mine whose picture takes the tile; else a tree there. Orders find their target the same way.
    source: [owner 2026-10-20 (first play-test), owner 2026-10-25 (sixth play-test), 'community ReTzar src/selection.rs (0x4e4280, 0x44e900, 0x44ea10, 0x44e400)']
    status: tested
    note: So a unit is picked anywhere on its figure, a building under a tree's crown wins over the tree (a peasant sent to build went to cut the tree), and a click between two units takes the nearer, not the one drawn in front. Ties go to the unit further left, then higher up, then the newest. A building is picked only on the tiles of its footprint its picture takes, not on a roof drawn above them, as in the original.
  CTRL-002:
    rule: Holding the right or middle mouse button drags the map; a right click gives its order when the button is released.
    source: [owner 2026-10-20 (first play-test)]
    status: implemented
  CTRL-003:
    rule: A right click on an enemy unit or building makes the selected armed units attack it; creatures of Nature are attacked too, resources never.
    source: [manual "Commanding Units" (Attack)]
    status: tested
    adr: [0179]
  CTRL-004:
    rule: A right click on a resource sends the selected units that can gather it to gather it; the others move there.
    source: [manual "Commanding Units" (Harvest), owner 2026-10-21 (third play-test)]
    status: tested
    adr: [0179]
  CTRL-005:
    rule: A right click on an own unfinished building sends the selected peasants to help build it.
    source: [owner 2026-10-20 (third play-test)]
    status: tested
    adr: [0179, 0180]
  CTRL-006:
    rule: A right click on an own damaged building or vehicle sends the selected peasants to repair it.
    source: [manual "Commanding Units" (Repair), manual "Repairing A Building"]
    status: tested
  CTRL-007:
    rule: A right click on an enemy building sends the selected peasants to capture it, while armed units attack it.
    source: [manual "Commanding Units" (Capture building)]
    status: tested
    adr: [0179]
  CTRL-008:
    rule: A right click on an own ship or other holder that takes them loads the selected units into it.
    source: [manual "Units" (transporting units across water), manual "Commanding Units" (Load)]
    status: tested
    adr: [0179]
  CTRL-009:
    rule: Over an item, with units selected, the pointer turns into the hand; a click picks the item up.
    source: [manual "Commanding Units" (Pick item)]
    status: tested
    adr: [0179]
  CTRL-010:
    rule: A right click on an own unit makes the selected units follow it; a herd of cows gathers round the clicked cow.
    source: [owner 2026-10-21 (third play-test)]
    status: tested
    adr: [0179]
  CTRL-011:
    rule: A right click on the ground moves the selection there, and with Ctrl it is a move-advance (fight on the way); Alt makes it a move-sneak and Shift adds a waypoint (ORD-004 and ORD-005).
    source: [manual "Commanding Units" (Move and Move-advance)]
    status: tested
  CTRL-012:
    rule: Over the world the pointer shows what a right click would do there for the selection, by the strongest action any selected unit has (attack, capture, repair, gather, pick up, move).
    source: [manual "Commanding Units" (the cursor changes to each order's cursor), owner 2026-10-21 (third play-test), owner 2026-10-24 (fifth play-test), owner 2026-10-25 (sixth play-test), 'community ReTzar src/gameplay.rs (click_cursor, 0x4f45b0, 0x42da60) and src/frontend/orders.rs (0x43a8c1)']
    status: tested
    adr: [0179]
    note: The pointers are the original's (OrderCursors). Over an object, the shovel for cutting, mining, farming and building a site; the repair pointer for a repair; the spell for a capture; the hand for an item; the move pointer for boarding; the attack pointer for an attack, the attack-type one with Alt. Walking, following, milking, fishing and carrying home keep the arrow. A card's order waiting for its target shows the original's pointer for it, the repair pointer for capture and build, the patrol path for patrol and explore. Tzar2's own saw and pickaxe are gone. With Shift the attack shows the attack-set pointer (CTRL-026, Tzar2's choice); the original shows it for an attack on the ground. The sixth play-test saw the shovel over repair and build. Over a site it is the original's (its table at 0x42da60 gives Build, 0xd, the shovel and Repair, 0x18, the hammer); over a building to repair it came from a tree whose crown covered the building and took the pointer, which CTRL-001 has since fixed.
  CTRL-013:
    rule: The hand pointer means picking up an item only; it does not show over anything else.
    source: [manual "Commanding Units" (Pick item), owner 2026-10-21 (third play-test), 'community ReTzar src/gameplay.rs (click_cursor: capture shows cs_magicharm)']
    status: tested
    adr: [0179]
    note: A capture shows the spell pointer under the pointer (cs_magicharm) and the repair pointer while the card's capture order waits, as the original does.
  CTRL-014:
    rule: Every pointer clicks at its own hotspot.
    source: [data IMAGES.INI cs_* hotspot]
    status: implemented
    adr: [0179]
  CTRL-015:
    rule: The default pointer is the golden spearhead.
    source: [data IMAGES.INI s_def, owner 2026-10-20 (second play-test)]
    status: implemented
  CTRL-016:
    rule: A move order plays the red cross animation where the ground was clicked.
    source: ['data IMAGES.INI [cursor]', owner 2026-10-20 (third play-test)]
    status: implemented
    adr: [0179]
  CTRL-017:
    rule: An order on an object (a building to enter, repair or attack) is confirmed by an animation around the object.
    source: [owner 2026-10-20 (third play-test)]
    status: tested
    note: As ReTzar reads the original (0x5008c0, 0x502a3b, 0x4f2528) the target shows a one-pixel frame one pixel inside its selection, on at 0, 200 and 400 ms for 100 ms each; red for an attack, a capture and the card's orders, blue for a guard, green for the other right clicks.
    adr: [0179]
  CTRL-018:
    rule: The ghost of a building being placed has no fill and wears the kingdom's colours; only the cells that block it turn red.
    source: [owner 2026-10-20 (first and second play-tests)]
    status: implemented
  CTRL-019:
    rule: A left click selects a unit, a box dragged with the left button selects the units inside it, and Shift+click adds a unit to the selection or takes it out.
    source: [manual Selecting And Grouping Units, manual Hints About Gameplay, 'community ReTzar src/frontend/mission.rs (0x4f4998, 0x4f4ef8)']
    status: tested
    note: The box shows once the pointer has moved 8 pixels and selects once it has moved 16; a shorter drag is a click (the sixth play-test - a click in a close group often selected several units).
  CTRL-020:
    rule: Ctrl and a digit give the selection that number; the digit selects the group again; the number shows in the corner of the selection.
    source: [manual Selecting And Grouping Units, manual Hot Keys]
    status: implemented
    note: The group's digit is drawn in the corner of each selected unit's marks.
  CTRL-021:
    rule: A double click (or a Ctrl+click) on a unit selects all units of its kind on the screen.
    source: [manual Selecting And Grouping Units]
    status: tested
    note: The hot keys list gives Ctrl+double click as "same kind and same state"; Tzar2 follows the hot keys.
  CTRL-022:
    rule: A right click cancels the placement of a building or an item and most orders waiting for a target.
    source: [manual Hints About Gameplay]
    status: implemented
  CTRL-023:
    rule: The image of the building being placed is green, without the kingdom's colours.
    source: [manual Constructing A Building, manual Commanding Units (Build), owner 2026-10-21 (answers), owner 2026-10-25 (sixth play-test)]
    status: implemented
    note: It is the building's shadow, its shape in green with its light kept faintly, not the finished building tinted (the sixth play-test); where it cannot stand the shadow is red and the cells that block it turn red (CTRL-018). A wall's shadow joins the walls next to it (PRES-010).
  CTRL-024:
    rule: Holding Alt or Ctrl while placing a gate turns the direction of the gate to be built.
    source: [manual Common Buildings (Wood Gate and Stone Gate), help ITEMS.TXT HT_BUILD_WALLS_GATES, community ReTzar src/world/starting.rs (0x498373)]
    status: tested
    note: Alt or Ctrl turns a gate's ghost through its four facings; a gate is 7 x 1 across and 1 x 6 down, the cells of its drawbridge picture, with a door of three tiles.
    adr: [0189, 0192]
  CTRL-025:
    rule: The waypoints of the selection appear while Shift is held.
    source: [manual Commanding Units (Move)]
    status: tested
    note: While Shift is held the selection's way shows, with a flag (wp_flag) on each point and marks on the objects it attacks or guards in turn.
    adr: [0189]
  CTRL-026:
    rule: Shift+right click on several enemies one after another makes the selection attack them in turn; Alt+right click on an object attacks every object of its type.
    source: [manual Commanding Units (Attack)]
    status: tested
    note: Shift queues each enemy after the unit's current order; Alt takes every object of the type and owner on the screen, nearest first, up to 17.
    adr: [0189]
  CTRL-027:
    rule: With Guard, Shift picks several objects to guard one after another and Alt picks every object of the clicked type.
    source: [manual Commanding Units (Guard)]
    status: tested
    note: Tzar2 guards the set in turn, the next object once the guarded one is gone. How the original shares a guard between them is not known.
    adr: [0189]
  CTRL-028:
    rule: Shift+click on an order button of a building queues five, and Shift+right click takes five off.
    source: [owner 2026-10-21 (answers)]
    status: tested
  CTRL-029:
    rule: In the build menu the letters of the buildings in its categories (guilds, common, rare) work directly, without opening the category.
    source: [data MENU.INI capturekeys]
    status: tested
  CTRL-030:
    rule: The build mode stays after a building is placed, its shadow following the pointer for more of the same, until a right click or Esc; the build menu stays open.
    source: [owner 2026-10-25 (sixth play-test)]
    status: implemented
    note: ReTzar reads the original as keeping the placement going only with Shift held (0x4fb169); the owner remembers the mode staying, and Tzar2 follows the owner. Shift still queues the site after the builder's work. Without builders selected the mode ends.
