schema: tzar2-rules/1
prefix: WAR
title: Combat
rules:
  WAR-001:
    rule: Every unit has its own attack, defence and hit points; attack is the damage dealt, defence lowers the damage taken, and resistance lowers the damage a building takes.
    source: [manual Production Of Units, manual The Selection View]
    status: tested
    note: The damage formula and its rounding are placeholders (UNK-08).
  WAR-002:
    rule: Some units have bonuses or penalties against others, from the bonus table; catapults are very good against ships, towers, catapults and buildings, pikemen against chariots and mounted units, macemen against catapults and ballistas, arrows bad against pikemen and chariots, priests very good against mages and magic creatures, dwarves excellent against buildings.
    source: [manual Hints About Gameplay, guide Unit Discussion, data BONUS.INI]
    status: tested
  WAR-003:
    rule: Each unit attacks at its own rate and range; ranged units shoot arrows, bolts, stones, cannon balls or rockets that fly to the target.
    source: [manual The Selection View, data UNITS.TXT, capture capture-20261018-155421]
    status: tested
  WAR-004:
    rule: Catapult stones land where the target stood and hurt what is near; a peasant who steps away as the stone falls is not hit.
    source: [guide Economy]
    status: tested
  WAR-005:
    rule: The computer's catapults throw one stone at a time.
    source: [patch 1.10 (TZAR110.TXT)]
    status: implemented
  WAR-006:
    rule: A ballista bolt flies fast.
    source: [patch 1.09 (TZAR110.TXT)]
    status: implemented
    note: Its speed is a placeholder (UNK-22).
  WAR-007:
    rule: Idle soldiers attack enemies that come into sight; peasants do not.
    source: [manual Diplomacy (Enemy)]
    status: tested
  WAR-008:
    rule: Towers attack enemies in range by themselves once they are finished.
    source: [manual Common Buildings]
    status: tested
  WAR-009:
    rule: A ghost may let out a banshee scream that lowers the attack and defence of the enemies around it. After each blow, in 71 draws of 1001, it casts a free curse on the enemy units within its sight; the curse halves their attack and takes all their defence for 30 s, and leaves out golems, siege engines, carpets, ships, ghosts, skeletons and fishing boats.
    source: [guide Unit Discussion, 'community ReTzar src/gameplay.rs (0x4ee780, 0x4e5841, 0x2719)']
    status: tested
    adr: [0250]
  WAR-010:
    rule: The Messiah (campaign) is immune to magic. Freeze, turn to stone, confusion, hypnosis and the curse do not take on it, and magic deals it no damage, spells and souls or the attacks of mages, dragons, priests and the Messiah.
    source: [guide Campaign Discussion (Mission 18), 'community ReTzar src/gameplay.rs (0x4ef200, apply_damage category 3)']
    status: tested
    adr: [0250, 0255]
  WAR-011:
    rule: Units with a bonus against other kinds, as listed in the guide, (footmen against pikemen, archers and jihad warriors; orcs against hand-to-hand units; ronin against peasants; satraps and samurai against machines; warships against warships; cannon and rocket towers against warships) get it from the bonus table.
    source: [guide Unit Discussion, data BONUS.INI]
    status: implemented
  WAR-012:
    rule: Hand-to-hand units other than priests fight badly against bats and dragons.
    source: [guide Unit Discussion]
    status: implemented
    note: From the bonus table.
  WAR-013:
    rule: Siege weapons hurt every unit where their shots land, their own kingdom's included.
    source: [help ITEMS.TXT WI_SIEGE_WEAPON]
    status: tested
    note: Catapult stones (catapult and heavy catapult) have friendly fire. Ballista bolts strike only their target, and the towers' and ships' cannon shells still spare their own side (they are not siege weapons in the help).
  WAR-014:
    rule: An attack's blow lands at the frame of its animation that the data marks (the action row), so each unit strikes at its own moment of the swing.
    source: [data IMAGES.INI actionrow]
    status: tested
    note: The importer reads the attack animation (OBJECTS image_attack) and lands the blow at the share of the swing that the frames before the action row take, by their delays (footman 840 of 1,398 ms, archer 943 of 1,200); ranged units loose their missile then. The action row is counted from 0, which is not checked against a capture (one frame, about 80-140 ms). Types without the data keep half the cycle (hitDelayPercent, UNK-07).
  WAR-015:
    rule: A unit or tower that takes on an enemy by itself chooses by the target's kind first (a peasant capturing or building a tower near, a site not begun near, fighters, towers, mages, then peasants, guilds, barracks and other buildings; walls never), then the one attacking what it guards, the one in reach, the better matchup, the one about two others attack, the weaker, the nearer.
    source: ['community ReTzar src/gameplay/combat.rs (0x412730, 0x4129d0, 0x412bf0)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: 'The categories and their priorities are data (combat.targetPriority, siegeTargetPriority for catapults, targetMages, targetTrainers, targetSeats; the human kingdom''s table: the sim does not tell a computer''s kingdom apart, and Tzar2 marks no walls for a breach). Bridges and gates are never chosen, nor a building another unit of the kingdom strikes already. In reach is Tzar2''s own reach test (the original counts cells); a tower looks only within its range. A confused unit still takes the nearest.'
  WAR-016:
    rule: A unit whose target falls, or that cannot reach it while another enemy is in reach, takes on the next target at once; with nobody in sight it stops, and an order queued with Shift comes first.
    source: ['community ReTzar src/gameplay.rs (0x42df70)', owner 2026-10-25 (sixth play-test), owner 2026-10-29 (eighth play-test)]
    status: tested
    note: "Cannot reach is a walk that gave up, one that made no progress since its last plan (two seconds), three walks in a row that ended short of the target (other units in the way), or no place left round a building to strike it from (the original's walk to the building fails then, 0x451cc0); then the unit takes an enemy it reaches now, or once the walk gave up or ended short the best other one in sight. The eighth play-test: in a fight among buildings knights stood behind the others round a barracks, their walks ending short again and again, while other enemies were near."
  WAR-017:
    rule: A unit or building that is hit, and a unit that takes on an enemy by itself, calls for help; the fighters and towers of its kingdom and its allies within three tiles, and its guards wherever they are, answer the attacker.
    source: ['community ReTzar src/gameplay.rs (0x413950, 0x413410)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: 'An idle helper takes the better of the attacker and its own best target; one on a move-advance, a sneak or a patrol turns at once; one fighting by itself changes only for a better target, and one on the player''s order keeps it; a tower answers within its range, a unit standing its ground within its reach. The original calls at most every 100 ms per victim (Tzar2 once per tick) and reaches six tiles for a computer''s kingdom (Tzar2 three for all, combat.helpRadiusTiles).'
