schema: tzar2-rules/1
prefix: TECH
title: Technologies and upgrades
rules:
  TECH-001:
    rule: Technologies are researched in buildings for gold and time, one at a time per building, and each only once per kingdom, even in a lagging multiplayer game.
    source: [manual Researching Technologies, manual Hints About Gameplay, patch 1.09 (TZAR110.TXT)]
    status: tested
  TECH-002:
    rule: Each civilization has its own technology tree; technologies unlock units, buildings, orders and further technologies.
    source: [manual Researching Technologies, data TECHTREE]
    status: tested
  TECH-003:
    rule: Feudalism (Europeans and Asians) and Slavery (Arabians) make peasants cheaper.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Each cuts a peasant's food to 80 % (0x4d4159).
    adr: [0191]
  TECH-004:
    rule: Architecture makes building faster and allows stone walls, gates and bridges.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: A building's TIME goes to 70 % (0x4d347e), here a 43 % faster rate.
    adr: [0191]
  TECH-005:
    rule: Learning lets units gain experience and allows the warriors' guild.
    source: [manual Researching Technologies, guide Important tips, strings STRINGS.INI orders_add te_learning]
    status: tested
    note: The manual says Learning "increases the amount of experience that can be gained"; the guide and the game's own text say it lets units gain experience at all, which Tzar2 follows.
  TECH-006:
    rule: Rotating Fields and Irrigation (Asians) make fields give more food.
    source: [manual Researching Technologies, help ITEMS.TXT HT_TEND_FIELDS, community ReTzar src/gameplay.rs (0x4ae720)]
    status: tested
    note: Rotating Fields adds 2 to a peasant's load of food from fields, Irrigation 4.
    adr: [0190]
  TECH-007:
    rule: Horsemanship (Arabians) makes mounted units cheaper.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Only horse archers and heavy cavalry, every cost to 75 % (0x4d3a2d).
    adr: [0191]
  TECH-008:
    rule: Temper Iron raises sword attack; Scimitar (Arabians) raises it again and allows satraps.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Each adds 1 to the attack of hand-to-hand units (0x4de7d0).
    adr: [0191]
  TECH-009:
    rule: Scale Armor and then Chain Mail raise the defence of infantry.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Scale Armor adds 1 and Chain Mail 2 to the defence of the units on foot (0x4de880).
    adr: [0191]
  TECH-010:
    rule: Saw, Stone Mining, Gold Mining and Ore Flotation (Arabians) make gathering wood, stone and gold more productive.
    source: [manual Researching Technologies, help ITEMS.TXT HT_CHOP_WOOD, help ITEMS.TXT HT_MINE, community ReTzar src/gameplay.rs (0x4ae720)]
    status: tested
    note: Each adds 2 to a peasant's load of its resource; Ore Flotation makes a gold or stone mine lose half of each load.
    adr: [0190, 0191]
  TECH-011:
    rule: Crossbow raises the attack of arrows; Chemistry (Asians) gives flaming arrows with more attack.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Each adds 1 to the attack of bows, ballistas, xebecs and the arrow towers (0x4de7d0).
    adr: [0191]
  TECH-012:
    rule: Engineering raises the attack of catapults and heavy catapults.
    source: [manual Researching Technologies, patch 1.09 (TZAR110.TXT), community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: It adds 5 to catapults, cannon ships and cannon and rocket towers (0x4de7d0).
    adr: [0191]
  TECH-013:
    rule: Gunpowder (Asians) raises the attack of cannon towers.
    source: [strings STRINGS.INI orders_add te_gunpowder, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: It adds 10.
    adr: [0191]
  TECH-014:
    rule: Heroism lets units gain unlimited experience and become heroes.
    source: [manual Researching Technologies]
    status: tested
  TECH-015:
    rule: Leadership makes the units around a hero gain experience along with him.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: The original shares the whole of it with the units below level 11 within the hero's sight; here within 4 tiles (UNK-23).
    adr: [0191]
  TECH-016:
    rule: Honor raises the attack of heroes fighting other heroes.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Hero against hero, 50 % more.
    adr: [0191]
  TECH-017:
    rule: Warfare, Tactics and Sun Tzu's Book (Asians) make units learn faster.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: A level needs 70, 50 and 35 % of the points; each needs the one before, and the kingdom has the lowest (combat.experienceSpeeds).
    adr: [0191, 0258]
  TECH-018:
    rule: Body Building makes hit points grow as a unit gains experience.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Five hit points a level.
    adr: [0191]
  TECH-019:
    rule: Landing Tactics lets ships carry 50 % more troops, once.
    source: [manual Researching Technologies, help ITEMS.TXT HT_USE_SHIPS, patch 1.05 (TZAR110.TXT)]
    status: tested
  TECH-020:
    rule: Fanaticism (Europeans and Arabians) and Buddhism (Asians) raise the resistance of all buildings.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Each adds half to the resistance (0x4d4064).
    adr: [0191]
  TECH-021:
    rule: Inquisition makes the priests' exorcism stronger; Medicine lets priests heal from farther away.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Inquisition adds 5 to the priests' attack; Medicine's reach is a placeholder (UNK-26).
    adr: [0191]
  TECH-022:
    rule: Supply Storage and Seafood (Asians) raise the population limit.
    source: [manual Researching Technologies, community ReTzar src/gameplay/cheats.rs (0x4d385a)]
    status: tested
    note: Each raises the kingdom's population limit by a quarter.
    adr: [0191]
  TECH-023:
    rule: Trade Taxes makes the markets produce resources over time.
    source: [manual Researching Technologies, strings STRINGS.INI orders_add te_tradetaxes, community ReTzar src/gameplay.rs (K+0x11a)]
    status: implemented
    note: It adds 2 to the base 40 of the trade profit, 5 % more; the manual's "produce resources" is not what the game does.
    adr: [0190]
  TECH-024:
    rule: Banking (Asians) adds resources to the treasury over time.
    source: [manual Researching Technologies, strings STRINGS.INI orders_add te_banking, community ReTzar src/gameplay.rs (K+0x11a)]
    status: implemented
    note: It adds 3 to the base 40 of the trade profit, 7.5 % more (7 % here).
    adr: [0190]
  TECH-025:
    rule: Riding Hordes (Arabians) raises the attack and defence of all mounted units.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Only horse archers and heavy cavalry, +2 attack and +1 defence.
    adr: [0191]
  TECH-026:
    rule: Kung-Fu (Asians) raises the attack of peasants, monks and priests.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: The original gives peasants +1 attack, not monks or priests.
    adr: [0191]
  TECH-027:
    rule: Meditation (Asians) makes monks cheaper, and Philosophy makes new monks start at a higher level.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Meditation cuts the Asian monk's costs to 75 %; Philosophy makes monks and priests start at level 2.
    adr: [0191]
  TECH-028:
    rule: Mastery (Asians) lets priests teach kung-fu units and turn mana into experience. The Asian priest's spell teaches an Asian peasant, monk, ninja or priest of a lower level than its own.
    source: [manual Researching Technologies, 'data MENU.INI [a_priest] spell_raiseexp', community ReTzar src/gameplay.rs (0x473bf0)]
    status: tested
    adr: [0253]
    note: The original teaches one point of its experience; Tzar2's experience has another scale (UNK-23) and teaches 100.
  TECH-029:
    rule: Tournaments (Asians) lets kung-fu units share their experience. Every 75 points of experience the kingdom's units learn teach each of its Asian peasants, monks, ninjas and priests one more; what goes over 75 is lost.
    source: [manual Researching Technologies, community ReTzar src/gameplay.rs (0x4de900)]
    status: tested
    adr: [0253]
  TECH-030:
    rule: Jewelry (Asians) lets the markets sell and buy items, the same items in every market.
    source: [manual Researching Technologies, patch 1.09 (TZAR110.TXT), 'data TECHTREE ASIA.INI market_items', 'community ReTzar src/gameplay.rs (0x479c34, 0x47a254, 0x47a1e1)']
    status: tested
    adr: [0259]
    note: One market of the kingdom gets an offer a second after it stands and then every minute (a book, a power item, a book or a potion, each with a random record); the newest 8 stay; any market of the kingdom sells an offer for 4 times its value in gold, at one of its corners, and buys a carried book, power item or potion for its value. An offered potion of experience gives one level here.
  TECH-031:
    rule: Piracy gives boarding units an attack bonus, and Boarding Ram lets ships board others.
    source: [manual Asian Buildings (Harbor), strings STRINGS.INI orders_add te_piracy te_boardingram]
    status: unclear
    note: The manual and the game's texts name them, but the original's data has no such technologies: they look cut from the game.
  TECH-032:
    rule: Concentration (Asians) makes mana come back faster.
    source: [manual Researching Technologies, community ReTzar src/simulation.rs (0x4d33d0)]
    status: tested
    note: Mana comes back 2 a second, 4 more with Concentration (0x502ea2).
    adr: [0191]
  TECH-033:
    rule: Technologies of spells and summons (Bat, Stone Golem, Invisibility, Lightning, Freeze, Whirlpool, Flame Bolt, Dragon, Turn To Stone, Confusion, Magic Carpet, Jinn, Rain of Fire, Magic Vision, Necromancy, Healing, Bless) make their spell possible.
    source: [manual Researching Technologies, 'data TECHTREE [orders]']
    status: tested
  TECH-034:
    rule: Witchcraft (Arabians) allows the mage workshop and making items.
    source: [manual Researching Technologies]
    status: implemented
  TECH-035:
    rule: Towers, walls, gates and ships are upgraded in place, in order, each upgrade needing its technology; a galleon buys its cannon levels one after another.
    source: [manual Common Buildings, manual Ships, data UPGRADES.INI]
    status: tested
  TECH-036:
    rule: Each cannon level of a ship, up to level six, makes its cannons fire more often.
    source: [help ITEMS.TXT HT_UPGRADE_SHIPS, community ReTzar src/gameplay.rs (0x4e8f00)]
    status: tested
    note: The firing period goes 3000, 2400, 1900, 1500, 1200, 800 by the level.
    adr: [0190]
