schema: tzar2-rules/1
prefix: EXP
title: Experience and heroes
rules:
  EXP-001:
    rule: Units gain experience in combat; each level adds one point of attack and half a point of defence, and a veteran beats several new units of its kind.
    source: [manual Production Of Units, manual Hints About Gameplay]
    status: tested
    note: How experience is earned and the curve are placeholders (UNK-23).
  EXP-002:
    rule: Each level needs more experience than the last.
    source: [guide Important tips]
    status: tested
  EXP-003:
    rule: Units gain no experience from fighting allies.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
  EXP-004:
    rule: With Tactics, soldiers train on dummies built by peasants to gain their first levels.
    source: [manual Production Of Units, manual Common Buildings (Dummy), guide Important tips]
    status: tested
  EXP-005:
    rule: Very experienced units become heroes and can be named.
    source: [manual Production Of Units]
    status: partial
    note: Units become named heroes at level 12 with Heroism; the player cannot name them.
  EXP-006:
    rule: Heroes keep their experience from one campaign mission to the next.
    source: [community TDD GAME-08]
    status: tested
  EXP-007:
    rule: Ctrl+] and Ctrl+[ select the units with more or less experience than the average of the selection (without a selection, those above 7 or below 8 on the screen).
    source: [patch 1.09 (TZAR110.TXT)]
    status: tested
