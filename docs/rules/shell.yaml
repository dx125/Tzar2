schema: tzar2-rules/1
prefix: SHELL
title: Menus, setup and pause
rules:
  SHELL-001:
    rule: The pause stops the whole game, animations, weather and sounds included; sounds playing are held and no work sound starts.
    source: [owner 2026-10-20 (play-tests 1 to 3)]
    status: implemented
    adr: [0179]
  SHELL-002:
    rule: SINGLE PLAYER opens the menu of campaign, custom map, random map, load game and back.
    source: [manual Single Player Screen, data MENU.INI S_SINGLEPLAYER]
    status: implemented
  SHELL-003:
    rule: The main screen offers single player, multiplayer, preferences, credits and quit.
    source: [manual Main Screen, 'community ReTzar src/menu.rs (the five slots at 270, 277 + 60 i)']
    status: implemented
    note: The five items fill the art's five carved slots; Tzar2 adds the editor and the asset viewer as small links at the bottom left (the owner, 2026-10-24); campaigns are in single player.
  SHELL-004:
    rule: The campaign screen lists the campaigns with a description, the chosen campaign's entry missions with a description, and PLAY and BACK.
    source: [manual Campaign Screen, 'community ReTzar src/menu.rs (the screen''s places; campaign_missions)']
    status: tested
    adr: [0133]
    note: In the original's places with its scroll bars; the entry missions are those the campaign starts with and those reached since; the difficulty sets the computers of its missions. Tzar2's own RESTART CAMPAIGN is gone (the owner's fifth play-test).
  SHELL-005:
    rule: The custom map screen lists the maps; PLAY opens the setup of the chosen map and BACK returns to the single player screen.
    source: [manual Custom Map Screen]
    status: implemented
  SHELL-006:
    rule: The setup of a custom map shows the players with their names and colours and lets each choose the European, Arabian or Asian civilization.
    source: [manual Single Player Setup Screen, 'community ReTzar src/menu.rs (Screen::Setup), src/world.rs (GameSetup)']
    status: tested
    note: Each kingdom of the map has a row: colour, name, civilization (RANDOM is drawn at the start) and team 1-4. A team allies over the map's diplomacy. A kingdom given another civilization takes it for its units and buildings where the ruleset has their class for it (ReTzar reads the original's loader). With the map's settings the rows keep the map's choices.
  SHELL-007:
    rule: On the setup of a custom map the map's own settings apply until USE MAP SETTINGS is unchecked; then the number of kingdoms, game type, victory condition, difficulty, starting resources, No Fog and Explore can be changed.
    source: [manual Single Player Setup Screen, 'strings STRINGS.INI [sp_setupmap]', 'community ReTzar src/menu.rs (Screen::Setup), src/world.rs (GameSetup)']
    status: tested
    note: With the map's settings the difficulty is the map's. Without them, Starting Resources has Default (the map's stockpiles), and fewer kingdoms leave out the last ones in kingdom order with their objects (Not Appear objects stay for Appear Object). The original keeps some options locked by the map's header (ReTzar setup_locks); Tzar2 opens all of them (UNVERIFIED which header values lock).
  SHELL-008:
    rule: The difficulty of the computer kingdoms is Easy, Normal or Hard.
    source: [manual Single Player Setup Screen]
    status: implemented
  SHELL-009:
    rule: Starting resources are Low, Normal or High.
    source: [manual Single Player Setup Screen, data RES.INI]
    status: implemented
  SHELL-010:
    rule: The random map screen sets for each player an AI script (the small button by the name), the civilization, the number of kingdoms, the game type (Standard or Deathmatch), the victory condition, the difficulty, the starting resources, No Fog and Explore.
    source: [manual Random Map Screen, 'strings STRINGS.INI [sp_setuprnd]', 'community ReTzar src/menu.rs (Screen::Random)']
    status: tested
    note: Each kingdom also has a colour and a team (1-4). The victory condition's time limit runs 30-180 minutes by 30 and its score limit 200-2,000 by 200 (ReTzar). The AI button steps through the scripts; the original opens a list (D_CHOOSEAI, still to build). The captions sit where the original writes them (ReTzar), and Number of Players shows its range ("(2 - 6)"); the map preview of the old screen is gone, the five map options are in its place.
  SHELL-011:
    rule: A random map has a size (Medium, Large, Huge, Enormous, Real World), a type (Random, Archipelagos, Dry, Island, Continental, Lakes), a terrain set (Grass, Desert, Summer, Winter) and map resources (Low, Normal, High), and may have a guarded town, animals, gateways, magic items and cliffs.
    source: [manual Random Map Screen, 'community ReTzar src/menu.rs (Screen::Random)']
    status: tested
    note: Tiny and Small are offered too. The original's defaults (ReTzar, tzar.ini [SINGLE_RANDOM]) have the guarded town, animals, magic items and gateways on and cliffs off; the original's random terrain set is not offered.
  SHELL-012:
    rule: The settings of the random map screen are kept for the next time.
    source: [patch 1.09 (TZAR110.TXT), 'community ReTzar src/menu.rs (Screen::Random)']
    status: tested
    note: The original keeps them in tzar.ini [SINGLE_RANDOM]; Tzar2 in user://random-map.cfg, with the kingdoms' rows.
  SHELL-013:
    rule: The random map screen and the multiplayer options let each computer kingdom resign on its own (a flag) or never (a sword).
    source: [patch 1.09 (TZAR110.TXT), data IMAGES/AIRESIGN.BMP, 'community ReTzar src/menu.rs (Screen::Random)']
    status: tested
    note: One flag for every computer kingdom of the match. It starts up (the white flag), as Tzar2 played before; the original's first default is UNVERIFIED (ReTzar reads a missing tzar.ini AIRESIGN as the sword). The lobby shows it as a check.
    adr: [0262]
  SHELL-014:
    rule: The load game screen lists the saved games, filtered by campaign or single player game, and loads or deletes the chosen one.
    source: [manual Load Game Screen]
    status: tested
    adr: [0187]
    note: On D_LOAD; the control switches between single player games and campaigns (the original's demo type is not offered).
  SHELL-015:
    rule: The multiplayer screen takes the player's name, lets him create a game, search for games (with their information) and join one.
    source: [manual Multiplayer Screen]
    status: deviation
    note: IPX and direct TCP/IP give way to a relay with join codes and a LAN browser (TDD ORIG-07, ADR 0168).
    adr: [0168]
  SHELL-016:
    rule: In the multiplayer setup each player has a ready flag (red or green), a colour, an AI script, a civilization and a team; settings can only change while not ready; there is a chat; only the creator has PLAY, active when everyone is ready.
    source: [manual Multiplayer Setup Screen]
    status: tested
    note: The AI script is the strategy of the kingdom's computer player (the standby AI of a player, ADR 0163), from AI.INI. Two wishes for one colour go to the lower slot (ADR 0232).
    adr: [0168, 0232]
  SHELL-017:
    rule: Only the player himself chooses his AI script in the multiplayer screen, and every player is told when the host changes one.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
    adr: [0232]
  SHELL-018:
    rule: The multiplayer settings choose a random or a custom map, the random map's options, the game type, the difficulty, the victory condition, the starting resources, No Fog, Explore, the population limit, and day and night and weather; with MAP SETTINGS only No Fog, Explore, day and night and weather can change.
    source: [manual Multiplayer Settings Screen]
    status: tested
    note: The difficulty is set per computer slot. A custom map is not sent; every player needs his own copy, found by its content hash (ADR 0233). The game types are Standard and Deathmatch (TDD); the multiplayer strings' King of the Hill and Capture the Flag are out of scope (decided 2026-10-22).
    adr: [0168, 0232, 0233]
  SHELL-019:
    rule: The preferences set the sound volume (off when unchecked) with unit speech, building sounds and nature sounds kept or not, the music volume or CD audio, the game speed, the scroll speed and the path depth, day and night and weather effects, and when the menu bar appears.
    source: [manual Preferences Screen]
    status: partial
    note: The checks by the sound and music volumes turn them off, as in the options' art; CD audio is shown and stays off (Tzar2 plays MIDI); the hardware cursor is the system's pointer. When the menu bar appears is missing, the path depth is dropped on purpose (TDD ORIG-03), and where weather and day/night sit waits for the owner's screenshot (UI review question 3).
  SHELL-020:
    rule: The credits screen shows the makers of the game.
    source: [manual Credits Screen, data CREDITSFNT.INI]
    status: tested
    note: The package's credits text scrolls up the S_CREDITS book's right page in the CREDITSFNT.INI fonts. The makers' portraits of S_CREDITS and the scroll speed (30 px/s, Tzar2's) wait for the owner's screenshot (UI review question 6).
  SHELL-021:
    rule: The in-game menu (F1, F10) offers instructions, load game, save game, options, restart, quit and back to game.
    source: [manual Menu Screen, manual Hot Keys]
    status: tested
    adr: [0187]
    note: INSTRUCTIONS (at the top of D_MENU, where ReTzar puts it) opens the online help at its hot keys (HK.TXT), as ReTzar does; what the original's "floating screen" of directives shows is UNVERIFIED.
  SHELL-022:
    rule: F2 opens the save dialog and F3 the load dialog.
    source: [manual Hot Keys]
    status: tested
    adr: [0187]
    note: Every single player game is saved by name (campaign missions, custom maps, random maps); multiplayer matches are not.
  SHELL-023:
    rule: Restarting a game resets the fog and the exploration.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
    note: A restart builds a new match.
  SHELL-024:
    rule: Plus and minus change the game speed during the game.
    source: [manual Hot Keys]
    status: implemented
  SHELL-025:
    rule: A loan cannot be taken while the game is paused.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
    note: Nothing runs while paused; commands wait for the next tick.
  SHELL-026:
    rule: The controls of the menu screens explain themselves in a hint line.
    source: [data LOCAL HELP.INI, data IMAGES/SCREENS/COMMON/BTN_HELP_B, 'community ReTzar src/menu.rs (hint_key, 0x45c800, 0x45c6c6)']
    status: tested
    note: As ReTzar reads the original, the help ball (BTN_HELP_B at the top left of the campaign, custom map, custom setup, random map and options screens, BTN_HELP_S on the load and save windows) turns hint mode on and off; in hint mode the screen takes no other press and the control under the pointer shows its HELP.INI text in a box below the pointer. The keys are the original's names of the controls (ReTzar). Tzar2's own options rows without an original counterpart have no hint, and the windows over the map (diplomacy, tribute, chat) have no ball yet.
  SHELL-027:
    rule: Quitting, resigning and disconnecting ask for confirmation. Leaving Tzar from the main menu asks "Exit Tzar - Are you sure you want to quit the game?"; the game menu's QUIT asks to resign in a single player game and to disconnect in a multiplayer one, with Yes and No.
    source: ['strings STRINGS.INI [q]', 'data IMAGES/SCREENS/D_MSGWND', 'community ReTzar src/menu.rs (Screen::Quit, Screen::Resign)']
    status: tested
  SHELL-028:
    rule: Esc opens the game menu when there is nothing left for it to cancel or deselect.
    source: [owner 2026-10-21 (fourth play-test)]
    status: deviation
    note: The original opens the menu only with the MENU button, F1 and F10; the owner asked for Esc too.
