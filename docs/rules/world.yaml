schema: tzar2-rules/1
prefix: WORLD
title: Terrain and movement
rules:
  WORLD-001:
    rule: Water (sea, rivers and lakes) can be crossed only by ships and by flying units such as bats, dragons and magic carpets.
    source: [manual Terrain]
    status: tested
  WORLD-002:
    rule: Trees and bushes cannot be walked through; once a tree is cut down, buildings can be put where it stood.
    source: [manual Terrain]
    status: implemented
  WORLD-003:
    rule: Rocks, mountains and cliffs cannot be walked through.
    source: [manual Terrain]
    status: tested
  WORLD-004:
    rule: Units walk and build over scenery such as tufts, bones, pebbles and branches.
    source: [manual Terrain]
    status: implemented
  WORLD-005:
    rule: There are four terrain sets, Grassland, Summer, Winter and Desert.
    source: [manual Terrain]
    status: implemented
  WORLD-006:
    rule: A bridge carries land units over water.
    source: [manual Common Buildings (Bridge)]
    status: tested
  WORLD-007:
    rule: How fast units move depends on the game speed and on the kind of unit.
    source: [manual Commanding Units, capture capture-20261019-163231]
    status: tested
    adr: [0171, 0172]
  WORLD-008:
    rule: A group moves at the speed of its slowest member.
    source: [capture capture-20261019-221300]
    status: tested
    adr: [0024]
  WORLD-009:
    rule: A chopped tree is never drawn on top of a building or a wall.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
  WORLD-010:
    rule: The bodies of the dead never block the way (a bug of the original where battlefields became walls).
    source: [community TDD ORIG-01]
    status: deviation
    note: Fixes a bug of the original (TDD §5, ORIG-01).
  WORLD-011:
    rule: Units find a way to any place they can reach, however long; there is no path depth to set.
    source: [manual Preferences Screen (path depth)]
    status: deviation
    note: The original limited the search depth (TDD §5, ORIG-03); Tzar2 always finds the way and drops the option.
  WORLD-012:
    rule: Each kind of unit walks at its own speed, which follows the stride of its walking animation.
    source: [data IMAGES.INI move_len, capture capture-20261019-163231, community ReTzar src/gameplay/movement.rs (0x49891b)]
    status: tested
    note: A step of a pixel lasts (32000 / move_len) >> 5 of the original's ms, which last 1.25 of ours; it gives the 18 measured classes their speed within 1 %. Measured speeds stay.
    adr: [0172, 0190]
  WORLD-013:
    rule: A random map grows as many trees as its terrain set's data gives for its size.
    source: ['data TERRAIN.INI [randomtreeset]', community ReTzar src/random_map.rs (0x4b2ab0)]
    status: tested
    adr: [0201]
    note: The original's plasma field and chances (ReTzar's reading) with Tzar2's random numbers, so forests have the original's shape and density but not its exact trees.
  WORLD-014:
    rule: Units crossing a bridge are drawn on it, as on the ground; the bridge never hides them.
    source: [owner 2026-10-21 (fourth play-test)]
    status: implemented
  WORLD-015:
    rule: A unit cannot stand where another unit stands.
    source: [owner 2026-10-21 (fourth play-test), 'data IMAGES.INI object', capture capture-20261022-110601]
    status: tested
    adr: [0188]
    note: A land unit's body is 7/16 of its object box (14 px for 32 x 32), so units keep 28 px apart and rest one to a tile, 32 px apart, as batch K measured; a compact group keeps its formation. The terrain keeps the old 7 px footprint, and units coming the other way squeeze past with it. A crowd around one target is not measured.
  WORLD-016:
    rule: Units of mutually allied kingdoms push idle ones aside and queue behind moving ones, as if they belonged to the same kingdom.
    source: ['community ReTzar src/gameplay/movement.rs (the step code tests no owner)']
    status: tested
    adr: [0220]
    note: The original's steps make no difference between kingdoms; the rebuild keeps enemies as hard obstacles (ADR 0025) and treats mutual allies as its own kingdom's units. Without it, heroes walking through an allied village bounce off its peasants.
  WORLD-017:
    rule: A unit that meets a blocked corner almost head-on slides past it at the step's full length, not only its tiny sideways part.
    source: [community observed in the rebuild (galleons at a coast corner)]
    status: tested
    adr: [0220]
    note: The threshold is 4x ratio (cross-component > 4 * along-component). UNVERIFIED against the original.
  WORLD-018:
    rule: Cliffs and walls stop every ground unit except the ninja, who climbs over a band of one or two cliff or wall tiles from ground to ground, never three.
    source: ['owner 2026-10-22 (rajba: only ninjas reach the mage plateau; original footage https://youtu.be/CxPm7ja1ujI?t=955)', 'community ReTzar src/gameplay/pathing.rs (0x4a99a0: walls and cliffs alike)', 'community ReTzar src/gameplay/movement.rs (0x4fad01: the wall pieces mark the cells a ninja climbs; 0x4ebc00: the jump)']
    status: tested
    adr: [0220]
    note: The ninja has its own locomotor, climber, which is infantry everywhere else ("foot" in data and technologies includes it). A cliff tile is open to it when, along a row, a column or a diagonal, its cliff run is at most two tiles with climbable ground at both ends; the original decides per step, so walking along the top of a long band is possible here and not there. Wall pieces (not gates or towers) count as climbed tiles when only walls block the tile; a cliff tile does not look at walls beside it (the original mixes them in one band). The jump picture (0x4ebd2d) is not drawn yet.
  WORLD-019:
    rule: Workers stand one to a tile next to what they work at, each taking a free place around it, so at most eight peasants cut at a tree and builders spread around a site; units at work are not pushed aside by others.
    source: ['owner 2026-10-24 (fifth play-test)', 'community ReTzar src/gameplay/movement.rs (0x451cc0, 0x451b40: the group takes the cells of the object''s edge one by one; 0x41fd70: a building''s rect is its footprint grown by one)']
    status: tested
    note: A worker takes the first tile of the footprint grown by one, from the one nearest to it and alternately ahead and behind around the edge, that it can stand on, that no other worker at the object walks to or holds and where no other unit stands. On its way it stops only there, not where it first touches the object. When every place at a node is taken it takes the next node with room. The original's paths go round occupied cells; Tzar2's do not know units, so a worker the crowd stops short of its tile works where it stopped when the object is in reach. Fields, cows, fish and ships keep their own rules.
