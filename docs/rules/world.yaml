schema: tzar2-rules/1
prefix: WORLD
title: Terrain and movement
rules:
  WORLD-001:
    rule: Water (sea, rivers and lakes) can be crossed only by ships and by flying units such as bats, dragons and magic carpets.
    source: [manual Terrain]
    status: tested
  WORLD-002:
    rule: Trees and bushes cannot be walked through; once a tree is cut down, buildings can be put where it stood.
    source: [manual Terrain]
    status: implemented
  WORLD-003:
    rule: Rocks, mountains and cliffs cannot be walked through.
    source: [manual Terrain]
    status: tested
  WORLD-004:
    rule: Units walk and build over scenery such as tufts, bones, pebbles and branches.
    source: [manual Terrain]
    status: implemented
  WORLD-005:
    rule: There are four terrain sets, Grassland, Summer, Winter and Desert.
    source: [manual Terrain]
    status: implemented
  WORLD-006:
    rule: A bridge carries land units over water.
    source: [manual Common Buildings (Bridge)]
    status: tested
  WORLD-007:
    rule: How fast units move depends on the game speed and on the kind of unit.
    source: [manual Commanding Units, capture capture-20261019-163231]
    status: tested
    adr: [0171, 0172]
  WORLD-008:
    rule: A group moves at the speed of its slowest member.
    source: [capture capture-20261019-221300]
    status: tested
    adr: [0024]
  WORLD-009:
    rule: A chopped tree is never drawn on top of a building or a wall.
    source: [patch 1.05 (TZAR110.TXT)]
    status: implemented
  WORLD-010:
    rule: The bodies of the dead never block the way (a bug of the original where battlefields became walls).
    source: [community TDD ORIG-01]
    status: deviation
    note: Fixes a bug of the original (TDD §5, ORIG-01).
  WORLD-011:
    rule: Units find a way to any place they can reach, however long; there is no path depth to set.
    source: [manual Preferences Screen (path depth)]
    status: deviation
    note: The original limited the search depth (TDD §5, ORIG-03); Tzar2 always finds the way and drops the option.
  WORLD-012:
    rule: Each kind of unit walks at its own speed, which follows the stride of its walking animation.
    source: [data IMAGES.INI move_len, capture capture-20261019-163231, community ReTzar src/gameplay/movement.rs (0x49891b)]
    status: tested
    note: A step of a pixel lasts (32000 / move_len) >> 5 of the original's ms, which last 1.25 of ours; it gives the 18 measured classes their speed within 1 %. Measured speeds stay.
    adr: [0172, 0190]
  WORLD-013:
    rule: A random map grows as many trees as its terrain set's data gives for its size.
    source: ['data TERRAIN.INI [randomtreeset]', community ReTzar src/random_map.rs (0x4b2ab0)]
    status: tested
    adr: [0201]
    note: The original's plasma field and chances (ReTzar's reading) with Tzar2's random numbers, so forests have the original's shape and density but not its exact trees.
  WORLD-014:
    rule: Units crossing a bridge are drawn on it, as on the ground; the bridge never hides them.
    source: [owner 2026-10-21 (fourth play-test)]
    status: implemented
  WORLD-015:
    rule: A unit cannot stand where another unit stands.
    source: [owner 2026-10-21 (fourth play-test), 'data IMAGES.INI object', capture capture-20261022-110601]
    status: tested
    adr: [0188]
    note: A land unit's body is 7/16 of its object box (14 px for 32 x 32), so units keep 28 px apart and rest one to a tile, 32 px apart, as batch K measured; a compact group keeps its formation. The terrain keeps the old 7 px footprint, and units coming the other way squeeze past with it. A crowd around one target is not measured. Since ADR 0270 land units stand one to a tile and step from tile to tile (WORLD-020); the bodies still give reach and the ships' and flyers' spacing.
  WORLD-016:
    rule: Units of mutually allied kingdoms push idle ones aside and queue behind moving ones, as if they belonged to the same kingdom.
    source: ['community ReTzar src/gameplay/movement.rs (the step code tests no owner)']
    status: tested
    adr: [0220]
    note: The original's steps make no difference between kingdoms; the rebuild keeps enemies as hard obstacles (ADR 0025) and treats mutual allies as its own kingdom's units. Without it, heroes walking through an allied village bounce off its peasants.
  WORLD-017:
    rule: A unit that meets a blocked corner almost head-on slides past it at the step's full length, not only its tiny sideways part.
    source: [community observed in the rebuild (galleons at a coast corner)]
    status: tested
    adr: [0220]
    note: The threshold is 4x ratio (cross-component > 4 * along-component). UNVERIFIED against the original.
  WORLD-018:
    rule: Cliffs and walls stop every ground unit except the ninja, who climbs over a band of one or two cliff or wall tiles from ground to ground, never three.
    source: ['owner 2026-10-22 (rajba: only ninjas reach the mage plateau; original footage https://youtu.be/CxPm7ja1ujI?t=955)', 'community ReTzar src/gameplay/pathing.rs (0x4a99a0: walls and cliffs alike)', 'community ReTzar src/gameplay/movement.rs (0x4fad01: the wall pieces mark the cells a ninja climbs; 0x4ebc00: the jump)']
    status: tested
    adr: [0220]
    note: The ninja has its own locomotor, climber, which is infantry everywhere else ("foot" in data and technologies includes it). A cliff tile is open to it when, along a row, a column or a diagonal, its cliff run is at most two tiles with climbable ground at both ends; the original decides per step, so walking along the top of a long band is possible here and not there. Wall pieces (not gates or towers) count as climbed tiles when only walls block the tile; a cliff tile does not look at walls beside it (the original mixes them in one band). The jump picture (0x4ebd2d) is not drawn yet.
  WORLD-019:
    rule: Workers stand one to a tile next to what they work at, each taking a free place around it, so at most eight peasants cut at a tree and builders spread around a site; workers coming to work do not push those at work aside. Soldiers attacking a building in hand-to-hand spread around it the same way.
    source: ['owner 2026-10-24 (fifth play-test)', 'community ReTzar src/gameplay/movement.rs (0x451cc0, 0x451b40: the group takes the cells of the object''s edge one by one; 0x41fd70: a building''s rect is its footprint grown by one)']
    status: tested
    note: A worker takes the first tile of the footprint grown by one, from the one nearest to it and alternately ahead and behind around the edge, that it can stand on, that no other worker at the object walks to or holds and where no other unit stands. On its way it stops only there, not where it first touches the object. A unit at work holds its place against the other workers of the same object and yields to everyone else, as an idle one does. Hand-to-hand attackers of a building take their tiles the same way (workers and attackers of one building share them), strike only from there and hold their places against each other; attacks on units keep their crowd. When every place at a node is taken it takes the next node with room. The original's paths go round occupied cells; Tzar2's do not know units, so a worker the crowd stops short of its tile works where it stopped when the object is in reach. Fields, cows, fish and ships keep their own rules. A worker works from a tile next to the structure it works at and no further (structureReachPx 18 with units one to a tile), and turns to face a site it builds (the sixth play-test); cows, ships, items and other targets without a footprint keep the interaction reach.
  WORLD-020:
    rule: Land units stand one to a tile and step from tile to tile; a unit waits behind one entering the tile it wants, goes round one standing there, and is never pushed.
    source: ['community ReTzar src/gameplay/movement.rs (0x4def20, 0x4debb0: a step takes the next cell at once; a unit entering it is waited for ten times 250 ms; a unit standing there is gone round)', owner 2026-10-25 (sixth play-test)]
    status: tested
    adr: [0270]
    note: 'A step takes as long in any of the eight directions and cuts no corner; a unit that has begun a step ends it, stopped or not. The routes, flow fields and arrival slots are Tzar2''s own; only the step is the original''s. The way round may go through units that make way (friends, and units of a kingdom that is not an enemy either way), dearer than free ground; with no other way, an idle one in the way walks to the nearest free tile off the way (within three steps) and goes back after two seconds, or, in a corridor, the two change places (the owner''s wish instead of shoving); such units head on pass each other (ORIG-02, the original''s units squeezed past on open ground). A unit stepping for six seconds without coming nearer its goal plans again. An idle unit that makes way steps off a walker''s goal tile (a trigger''s area); a unit jammed in a crowd of walkers for a second changes places with one that needs its tile; each unit''s own layer says where it may stand (a ninja climbs). Ships and flyers still move continuously (WORLD-015). Large units take their clearance''s square of tiles. A unit standing on the tile is gone round whether it has an order to walk or not (the eighth play-test: units waited behind ones that waited themselves, ReTzar 0x4dec92); going through friends that make way comes after the way round every unit (WORLD-021).'
  WORLD-021:
    rule: A unit held up by units in its way plans its way again with the tile of every unit as a wall, friends and units on the move too, near by first and then over the whole map, and walks round; only with no way round them at all do friends step aside for it.
    source: ['community ReTzar src/gameplay/movement.rs (0x4a9060: a unit blocked by an occupied cell, or that waited out one being entered, asks for a new path; 0x4debb0: a unit standing there or head on is searched round with flag 1) and src/gameplay/pathing.rs (0x4df540: occupied cells are walls, cells being entered too on a re-plan)', owner 2026-10-28 (seventh play-test), owner 2026-10-29 (eighth play-test)]
    status: tested
    adr: [0270]
    note: 'Units that keep their tiles are enemies, creatures of Nature, and friends at work or fighting where they stand; friends that make way are dearer ground, as in the near way round (WORLD-020). The search for the near way round looks 12 tiles each way; when it finds no way and gets not even half that far on, the whole map is searched (at most 8192 tiles, four units a tick) and the unit takes the way found as its path. It searches so once until it steps on or plans again; with no way at all it waits, settles near its goal or gives up as before. The seventh play-test: a unit stood about 20 s at a gap held by beasts before going round, as long as peasants worked in one. The eighth play-test: the back ranks did not go round the front ones that had stopped. Friends standing idle were dearer ground the way round went through, so a unit asked them to step aside, and in a crowd none could; now every unit is a wall first, as in the original, and the way through friends (WORLD-020) is what is left when there is no way round. A unit waits only behind one entering the tile it wants or making room; it waited behind any unit with an order to walk, those waiting themselves too, and crowds stood.'
