schema: tzar2-rules/1
prefix: BLD
title: Construction and repair
rules:
  BLD-001:
    rule: Any peasant of the kingdom helps build a site, whatever its civilization; placing a new site needs a peasant whose civilization builds that type.
    source: [owner 2026-10-20 (third play-test)]
    status: tested
    adr: [0180]
  BLD-002:
    rule: Only peasants put up buildings; each building is paid for with its resources when placed, and a kingdom may have more than one of each kind.
    source: [manual Buildings]
    status: tested
  BLD-003:
    rule: Some structures are upgraded in place to the next version, from wood tower to guard tower to stone tower to cannon tower, and from wood wall or gate to stone.
    source: [manual Buildings, manual Common Buildings]
    status: tested
  BLD-004:
    rule: The build menu of each civilization has three groups of buildings, guilds, common and rare.
    source: [manual Buildings, data MENU.INI e_build r_build a_build]
    status: implemented
  BLD-005:
    rule: A building is placed with a left click where it fits.
    source: [manual Constructing A Building]
    status: tested
  BLD-006:
    rule: Damaged buildings catch fire by their health - at half their hit points and below one small fire, below 36 % two, below 16 % two and a big one - and the fire is only pictures and a sound; it never burns a building down. Repaired above half, the fire goes out.
    source: [manual Repairing A Building, 'community ReTzar src/gameplay.rs (burn, 0x4200c0)']
    status: tested
    adr: [0280]
    note: The manual says burning buildings burn down unless repaired; the original's code takes no hit points for the fire - read in the GOG Tzar.exe, the fire routine 0x4200c0 only sets the fires, their timer 0x41efe9 only plays the fire sound every 500 ms, and the buildings' 2 s pulse 0x41f271 only moves the resistance - and the owner made the original the final source when the two disagree (the global audit, 2026-11-07). Tzar2 burnt them down at 60 hit points a minute below half (UNK-42).
  BLD-007:
    rule: Peasants repair buildings, siege weapons and ships.
    source: [manual Repairing A Building, manual Siege Weapons, manual Ships]
    status: tested
  BLD-008:
    rule: A ship being repaired comes to its repairers and stays.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
  BLD-009:
    rule: A destroyed ship sinks with the units aboard.
    source: [manual Ships]
    status: tested
  BLD-010:
    rule: Several peasants build a site faster together.
    source: [guide Economy]
    status: tested
  BLD-011:
    rule: A wall is laid by dragging with the left button held, from the tile pressed to the tile where the button comes up, as an L with the longer side first (the other side first with Alt); the builder begins at the row's end nearer to it and goes on along it.
    source: [community TDD GAME-03, 'community ReTzar src/gameplay.rs (0x4fb8f0: the row''s cells; 0x4fb19d: begun at the end nearer the builder) and src/frontend/mission.rs (0x4fb0be, 0x4fb169: dragged from the press, laid when the button comes up)', owner 2026-10-25 (sixth play-test)]
    status: tested
    adr: [0043]
    note: While the button is held the row shows each segment's green shadow, joined as it will stand, and a red tile where none can go. A segment goes on each tile that takes one, at most maxWallSegments tiles of the row, each paid when placed. A straight line has no other side.
  BLD-012:
    rule: Peasants who finish a storage or a lumber mill start gathering nearby by themselves.
    source: [patch 1.05 (TZAR110.TXT)]
    status: tested
  BLD-013:
    rule: A spy in a peasant's look cannot build.
    source: [patch 1.05 (TZAR110.TXT), owner 2026-10-21 (answers)]
    status: implemented
    adr: [0184]
    note: The patch's "obsessed by spies peasants" are spies impersonating peasants (the owner). A disguised spy keeps the spy's own abilities.
  BLD-014:
    rule: A destroyed building leaves a ruin.
    source: [community TDD GAME-03]
    status: tested
    adr: [0043]
  BLD-015:
    rule: A unit standing where a new building is placed is pushed out of the way.
    source: [community TDD GAME-03]
    status: tested
  BLD-016:
    rule: Only watch towers are built; every other tower but the rocket tower is an upgrade of them, needing Architecture and Cannon Towers.
    source: [help ITEMS.TXT HT_UPGRADE_TOWERS]
    status: implemented
  BLD-017:
    rule: Only wooden walls and gates are built; with Architecture they are upgraded to stone.
    source: [help ITEMS.TXT HT_BUILD_WALLS_GATES]
    status: implemented
  BLD-018:
    rule: A wall shows green where it can be laid; a gate can be placed over walls of any kingdom, built or not, which it replaces, or anywhere it fits, as long as the tiles before its door where the drawbridge comes down hold no building or tree.
    source: [help ITEMS.TXT HT_BUILD_WALLS_GATES, 'community ReTzar src/gameplay.rs (gate_site 0x456b50 over the footprint and gate_passage 0x457980; found_site 0x455e20)', owner 2026-11-04 (after the ninth play-test)]
    status: tested
    adr: [0273]
    note: Walls never stop a gate's site, whatever their direction or kingdom, and the walls on its tiles go when it is laid; walls before its door stay. The way before the door is two tiles in every facing but a wooden gate's facing 1, one tile (Gate.approachTiles). Tzar2 keeps asking land for the gate's own tiles, which the original does not. Before 2026-11-04 only the kingdom's own finished walls, the way before the door was not looked at, and two facings of four were refused (Build took argument 1 only as 0 or 1).
  BLD-019:
    rule: Holding Alt while placing a bridge turns it.
    source: [help ITEMS.TXT HT_BUILD_BRIDGES]
    status: tested
    note: Alt turns the ghost; a bridge down takes the cells of bridge_vert (6 x 11) and draws it.
    adr: [0189, 0192]
  BLD-020:
    rule: Deleting a building just after its construction began gives its cost back. A site removed before any work gives all of it back; after work began, half of the share still to be built (f = (1000 T − 1000 p) / (2 T) per mille of each resource, truncated).
    source: [help ITEMS.TXT HT_REMOVE, community ReTzar src/gameplay.rs (0x41d6a8)]
    status: tested
    adr: [0251]
  BLD-021:
    rule: Peasants repairing are shown at work, with the building animation and its sound.
    source: [owner 2026-10-21 (fourth play-test)]
    status: tested
  BLD-022:
    rule: Each repairer strikes a blow every 1.25 s that restores the building's maximum hit points / (4 x its TIME), rounded down (lumber mill 6, barracks 5, castle 16); every repairer strikes full blows, and repairs cost nothing.
    source: [owner 2026-10-21 (fourth play-test), owner 2026-10-21 (answers), owner 2026-10-21 (repair per building), capture capture-20261021-220250]
    status: tested
    adr: [0185]
    note: Batch J's third run (repair-mill, repair-barracks, repair-castle; manual.yaml repair). Our idle peasants came to help unasked. Whether Architecture speeds repairs, and how ships and siege weapons are repaired, are not measured; Tzar2 applies the same rule to them.
  BLD-025:
    rule: A peasant at work on a site that places another one builds it after its own, the sites in the order placed; one not at a site starts on the new one.
    source: ['community ReTzar src/gameplay.rs (0x48f160: a peasant at work on its Build program takes the new site after its own)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: The next site waits in the peasant's queue of orders (a Build waypoint); finished, cancelled or destroyed, its site gives way to the next one still unfinished, then to the rest of a dragged wall nearby.
  BLD-026:
    rule: Upgrading a wooden wall to stone upgrades its whole row, the walls and gates of its kingdom joined to it side by side, for the upgrade's price for each wall and ten times it for each gate.
    source: ['community ReTzar src/gameplay.rs (0x4fab10, 0x4fa710: the row through the cells left, right, above and below each segment; a gate counts ten)', owner 2026-10-26 (sixth play-test)]
    status: tested
    note: The row is taken when the order is given (the price) and again when the upgrade is done (what turns to stone); a gate turns by its own conversion. Pieces meeting only at a corner are not joined.
  BLD-028:
    rule: A destroyed wall or gate leaves its rubble on the ground for the rest of the match, a gate its drawbridge fallen; other buildings leave ruins that crumble away in seconds. None of it stops anyone, so a gate destroyed while closed lets everyone through.
    source: ['community ReTzar src/gameplay.rs (leave_debris 0x41db50: g{w|s}<n>_demol 0x4578c0 and walls_{wood|stone}_debris 0x4fbd10 lasting, debris<W>x<H> 0x41dba0; crumble 0x444bd0 a frame every 2000 ms)', 'data IMAGES.INI gw0_demol ... gs3_demol, walls_wood_debris, debris1x1 ... debris6x6, debris harbor, bridge_horz_demol', owner 2026-11-04 (after the ninth play-test)]
    status: tested
    adr: [0273]
    note: Tzar2 keeps the rubble with the decals (format 26), at most the decal cap, a piece rebuilt and destroyed again leaving one. A ruin shows a frame of its picture every two seconds and goes after the last; rubble rests on its last. Before 2026-11-04 no ruin was drawn, and walls left none.
  BLD-027:
    rule: A finished building of the kingdom can be taken down from its card over 5 to 10 seconds by its health, giving back 75 % of all it cost - its construction and every upgrade bought for it; the order asks once more before it is carried out, the tooltip says what comes back, and the castle and the guilds need Shift as for Delete.
    source: [owner 2026-10-25 (sixth play-test; a new feature), owner 2026-10-28 (seventh play-test)]
    status: tested
    note: Tzar2's own, not in the original (gameplay.dismantleRefundPercent, dismantleBaseMs, dismantleMaxMs, dismantleMsPerHealth). While it comes down it shows its site's pictures in reverse, its units come out at once, its queue is cancelled and refunded, and it neither trains, researches, shoots nor takes units in. What it cost is kept for each building built in the match (game.invested); one the map placed counts its type's price for the kingdom. The share does not depend on the building's health. The button is Tzar2's own picture (tools/art/dismantle-icon.py) - the build buttons' roof split apart over a hammer, the usual pictogram of demolishing in strategy games. No setting turns it off yet.
  BLD-029:
    rule: Every building of a kingdom's build menus can be placed once its requirements stand; the market needs the Merchants' Guild, which needs the tavern, as the church needs the cathedral.
    source: ['data ORDERS.INI [tcguild] ACTION = BUILD TCGuild', 'data TECHTREE EURO.INI, TECHTREE ASIA.INI, TECHTREE ARAB.INI [required] market = tcguild, tcguild = tavern', owner 2026-11-06 (tenth play-test)]
    status: tested
    note: The original names the guild's class in capitals; Tzar2 looked its type up case by case and offered neither the guild ("not available to this kingdom") nor, through it, the market. Every other BUILD and CREATE of ORDERS.INI names its class in lower case.
