schema: tzar2-rules/1
prefix: DIP
title: Diplomacy and victory
rules:
  DIP-001:
    rule: Each kingdom takes a stance towards each other one, ally, enemy or neutral, and the two stances may differ; an ally's units do not attack, an enemy's attack everything in sight, a neutral's attack only military units in sight.
    source: [manual Diplomacy, help ITEMS.TXT WI_DIPLOMACY]
    status: tested
  DIP-002:
    rule: A kingdom that treats another as an ally does not strike back when that one attacks it as an enemy.
    source: [manual Diplomacy]
    status: tested
  DIP-003:
    rule: Shared vision, shared resources and shared unit control each work when both kingdoms turn them on.
    source: [manual Diplomacy Screen]
    status: tested
    note: Set by scripts and the lobby only; the diplomacy screen is missing (HUD-012).
  DIP-004:
    rule: With allied victory, one ally reaching the victory condition wins for all allies, who also lose together.
    source: [manual Diplomacy, help ITEMS.TXT WI_ALLIED_VICTORY]
    status: tested
  DIP-005:
    rule: Tribute sends gold, food, stone or wood to any other kingdom.
    source: [manual Diplomacy (Tribute)]
    status: tested
    note: Sent by scripts only; the tribute screen is missing (HUD-013).
  DIP-006:
    rule: The victory conditions are standard (the last kingdom standing), destroy the castle, a score limit, a time limit, or none.
    source: [manual Single Player Setup Screen, community TDD GAME-17]
    status: tested
    note: The random map screen, the custom map setup (without the map's settings) and the multiplayer lobby choose them (SHELL-007, SHELL-010).
  DIP-007:
    rule: A Deathmatch game starts every kingdom rich.
    source: [manual Random Map Screen (game type)]
    status: implemented
    note: The starting level (High) is a placeholder. The random map screen and the multiplayer lobby choose Deathmatch (SHELL-010).
  DIP-008:
    rule: F4 shows the scores.
    source: [manual Hot Keys, help HK.TXT, 'community ReTzar src/hud.rs (clock), src/gameplay.rs (scores)']
    status: tested
    note: As ReTzar reads the original, F4 steps from nothing to the scoreboard and the clock, the clock alone, and back. The clock (h:mm:ss) sits at the view's top right; above its bottom right corner one line per kingdom, "name  own/team" (the team's is its members' mean), the best first, a defeated kingdom struck through, its colour in a square. The score is the original's (DIP-011).
    adr: [0106]
  DIP-009:
    rule: Computer kingdoms resign on their own when their AI flag allows it.
    source: [patch 1.09 (TZAR110.TXT), data AI/RESIGN.AI]
    status: tested
    note: On random maps and in multiplayer the AI resign flag decides (SHELL-013); computer kingdoms of a scenario or campaign map never resign (the flag is only on the random map and multiplayer screens and is off for a campaign mission: ReTzar src/world.rs GameRules.ai_resign; ADR 0220). An AI assisting a human never resigns for it.
  DIP-010:
    rule: A kingdom stays in the game while it has a unit or a building other than caravans, fishing boats, the training dummy, walls, gates, bridges and fields; its cows keep it in.
    source: ['community ReTzar src/gameplay/scripting.rs (0x442d10 the defeat test; 0x442bd0 the classes that keep a kingdom alive)', owner 2026-10-29 (eighth play-test)]
    status: tested
    note: 'The eighth play-test: no victory came when every enemy was beaten; two kingdoms had only cows left, at the edges of the map, where passing peasants had pushed them before NAT-007. The original keeps such a kingdom in the game too. Tzar2 counted caravans, fishing boats and the dummy as well. The original does not test a kingdom that has spies, hidden ones included (0x442d6c); a Tzar2 spy stays its kingdom''s unit in its disguise, so it keeps the kingdom in anyway.'
  DIP-011:
    rule: A kingdom scores 500 for each building it destroys and 200 for anything else it kills, its own and its allies' too, and what each load of gold or stone gives as it is taken from its mine; the score shown is (raw + 50) / 100. Under a score limit every kingdom is defeated once another one's score passes the limit; at a time limit the kingdom with the highest raw score, the first on ties, alone stays.
    source: ['community ReTzar src/gameplay.rs (wound 0x504cbe, the mine 0x443430 type 4 and 0x4b0076, scores 0x4f2903) and src/gameplay/scripting.rs (0x442d10, 0x442e30, shown_score 0x4435c0)']
    status: tested
    adr: [0280]
    note: The global audit of 2026-11-07 replaced Tzar2's placeholder formula (UNK-29). The original also scores the ruinpoints of a ruin a kingdom holds, every second, and 100 for a flag of capture the flag brought within six tiles of its castle; Tzar2 has neither object. A score limit can end the game for the leader's allies too, as the original's end test reads.
