schema: tzar2-rules/1
prefix: HOLD
title: Holders and transport
rules:
  HOLD-001:
    rule: Castles and outposts hold up to 50 units each.
    source: [patch 1.09 (TZAR110.TXT), data OBJECTS max_obj_in_holder]
    status: tested
  HOLD-002:
    rule: Ships carry units over water, 8 on a xebec, 16 on a hulk and 24 on a galleon; magic carpets carry 8 over water and land.
    source: [help ITEMS.TXT HT_USE_SHIPS, help ITEMS.TXT HT_USE_MAGIC_CARPETS, data OBJECTS max_obj_in_holder]
    status: tested
    note: The manual's "up to eight units" is the xebec's number.
  HOLD-003:
    rule: Units in a castle or an outpost heal quickly; Emerge brings them out.
    source: [guide Important tips, help ITEMS.TXT HT_GARRISON_UNITS, manual European Buildings (Outpost)]
    status: tested
    note: The healing rate is a placeholder (UNK-24).
  HOLD-004:
    rule: When a castle or outpost is hit, the units inside take a share of the damage, more from siege weapons and warships.
    source: [guide Important tips, data OBJECTS damage]
    status: tested
  HOLD-005:
    rule: Units inside a holder cannot be attacked and see nothing.
    source: [community TDD GAME-09]
    status: tested
  HOLD-006:
    rule: Units leave a building that is destroyed, but go down with a ship sunk at sea.
    source: [manual Ships, community TDD GAME-09]
    status: tested
  HOLD-007:
    rule: A holder takes only the kinds of units its data accepts; a European trader cannot board a magic carpet.
    source: ['data OBJECTS [accept]', patch 1.05 (TZAR110.TXT)]
    status: tested
  HOLD-008:
    rule: Ships, magic carpets and traders can load units, but only ships and carpets carry them over water.
    source: [help ITEMS.TXT WI_TRANSPORT, 'data TRADER.INI [accept] max_obj_in_holder']
    status: tested
    adr: [0252]
    note: Caravans take 8 infantry units (the import reads TRADER.INI's [accept]); the synthetic tables of CI now have it too.
  HOLD-009:
    rule: A unit inside a holder keeps its items.
    source: [community TDD GAME-10]
    status: tested
  HOLD-010:
    rule: Emerge brings everyone out of a building, each onto a free tile of the nearest ring round it that has one, picked at random; the player's units that come out are selected. Units leave a destroyed or dismantled building the same way.
    source: ['community ReTzar src/gameplay.rs (0x5037fa Emerge; 0x504890, 0x504550 a passenger steps off within 8 rings; 0x5073f0 the ring search; 0x453240 each joins the selection)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: 'The original tries 256 random tiles a ring; Tzar2 picks at random among the ring''s free tiles (Rng.Misc). Before, everyone came out on the one tile of the building''s edge nearest its middle and walked to the middle, in a heap at one side, and nobody was selected (the sixth play-test). Unloading a ship or a carpet at a place does not select (the original''s unload order does not).'
  HOLD-011:
    rule: The eye of a castle, an outpost, a ship, a carpet or a caravan lists the units inside; a click lets one out beside it, and with Ctrl it is also selected alone.
    source: ['community ReTzar src/hud.rs (0x49cc3e the button is live while the selected object holds something)', 'community ReTzar src/frontend/mission.rs (0x4a1830 a click on an occupant; 0x490ad0 it leaves)', 'community ReTzar src/gameplay.rs (0x504550 out with no place; 0x453340 with Ctrl the selection)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: 'A unit leaves a building as from Emerge (HOLD-010); a ship''s steps onto land within the exit radius, or stays when there is none. Before, the eye showed only a unit''s items and was grey for holders. The list of portraits in the selection view and Emerge to a place stay (ORD-015).'
