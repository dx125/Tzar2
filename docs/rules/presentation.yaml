schema: tzar2-rules/1
prefix: PRES
title: Animations, effects and sounds
rules:
  PRES-001:
    rule: Burning buildings show the original's big and small flames.
    source: [data IMAGES.INI fire_big fire_small, owner 2026-10-20 (before the second play-test)]
    status: implemented
  PRES-002:
    rule: Arrows, bolts, stones, cannon balls, rockets and spells fly as the original's pictures, and stones, shells, rockets and bolts leave its explosions.
    source: [data IMAGES.INI, owner 2026-10-20 (before the second play-test), 'community ReTzar src/frontend/effects.rs and src/gameplay.rs (0x431340, 0x4335e7, 0x43392a, 0x4e8dd3)']
    status: tested
    note: Pictures by kind and shooter, the arcs and shadows, the holes, splashes and blasts and the ships' muzzle flash follow ReTzar's reading. Still Tzar2's - the trails behind stones, shells and rockets are not drawn, and the flames of burning buildings keep their spots (PRES-002 does not cover them).
  PRES-003:
    rule: Milking has its own animation, and a peasant carrying a load walks with it (logs, gold, stone, food, a pail of milk, meat).
    source: [data IMAGES.INI image_milk and the carrying sheets, owner 2026-10-20]
    status: implemented
  PRES-004:
    rule: Units and buildings of another civilization that a kingdom owns look as in their own civilization.
    source: [owner 2026-10-20 (second play-test on the map "There is not enough room for two of us")]
    status: implemented
  PRES-005:
    rule: Units have their own animations for capturing and collecting meat (peasants), murder (ninjas), prayer (priests), casting (mages and priests) and other attack swings (footmen, macemen, peasants, bears, ninjas).
    source: [data OBJECTS image_capture image_meat image_murder image_pray image_spell image_attack2 image_attack3]
    status: tested
    note: Capturing and cutting meat (peasants), casting (mages and priests, image_spell; the Asian priest's prayer is the same picture) and the second swing on half the blows (footmen, macemen, peasants, bears, ninjas, priests; the original draws at random, 0x4e5720 by ReTzar's reading). the ninja's murder (image_murder, else the attack's; ADR 0268). the Asian peasant's third swing under Kung Fu (each of its three swings a third of the blows; ReTzar 0x4ae090).
  PRES-006:
    rule: A hero shows a hero's portrait.
    source: [data OBJECTS icon_hero]
    status: tested
    note: The selection view shows the type's icon_hero cell for a hero (HERO for every unit but the Asian ninja, whose data names FOOTMAN); the info area's icons of a multi-selection keep the types' own.
  PRES-007:
    rule: A unit plays its creation sound when it is made.
    source: [data OBJECTS sound_create]
    status: tested
    note: Played when a unit is trained or a building completed. In GOG v1.10 the key is empty for every type but the Arab blacksmith (destroy_building), so in practice only that one sounds.
  PRES-008:
    rule: Some animations start inside their sheet, at the row and column the data gives.
    source: [data IMAGES.INI startrow startcol, community ReTzar src/gameplay.rs (0x4fd450) and src/frontend/scene.rs (0x5017f0)]
    status: tested
    note: An attack turns its picture by startcol (a knight striking east shows column 4) and a swing starts on its startrow. Every other picture runs from its startrow from when the unit took it up; the client notes when (AnimationStarts), the sim does not need to.
  PRES-009:
    rule: Trees, stumps and bushes are drawn from the tree sheet of the terrain set, at the positions and with the shadows the data gives.
    source: [data TREES.INI, 'data TERRAIN.INI [trees] [treename]']
    status: tested
    note: The tree and its shadow hang from the terrain set's [trees] pos_tree and pos_shadow (ReTzar's reading, 0x43cc84), and a tree takes a picture of a kind [treename] and [treeterrain] let grow on its tile. Tzar2's trees carry no kind, so the picture is picked by the tree's place, not the map's. DATA/TREES.INI (bushes, chopped) is not read.
  PRES-010:
    rule: A wall's picture follows its neighbours of the same material, walls and gates of any kingdom - upright when joined above and below only, across when joined left and right only, a tower otherwise - and shows its damage; a wall's site has a picture of its own.
    source: ['data IMAGES.INI walls_wood_* walls_stone_*', 'community ReTzar src/world/walls.rs (0x4fb690, 0x4fbde0: the neighbours and the damage pictures) and src/world.rs (0x4fbce0: walls_wood_build, walls_stone_build)', owner 2026-10-25 (sixth play-test)]
    status: tested
    note: The neighbours are the tiles above, right, below and left of the wall (1, 2, 4, 8); 5 is walls_*_vert, 10 walls_*_horz, any other walls_*_tower, always the first column. A damaged wall shows the *_dest picture's row rows - floor(health x rows / most) - 1. A site shows walls_*_build by its progress. Only finished walls and gates join. The kingdom's flag on the towers (image_c) is not drawn.
