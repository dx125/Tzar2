name: Nightly

# TDD §24: nightly determinism matrix, benchmarks and the Windows Godot build.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GODOT_VERSION: 4.7.2

jobs:
  determinism:
    # TDD §8.8 / §22.2 determinism matrix (ADR 0017): every OS runs the golden-hash suite in Debug (overflow policy
    # Throw) and Release (Saturate) on net8 + net10, then a long synthetic match (4,000 units, 512², 6,000 ticks =
    # 5 min of game time, churn) with the per-tick hash stream; determinism-compare diffs the streams tick by tick.
    # The replay corpus joins this job once the gameplay systems produce one (M3+).
    name: Determinism - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet test tests/Tzar2.Determinism.Tests -c Release --logger "console;verbosity=normal"
      - run: dotnet test tests/Tzar2.Determinism.Tests -c Debug --logger "console;verbosity=normal"
      - name: Long synthetic match, per-tick hash stream
        run: >
          dotnet run -c Release --project src/Tzar2.Tools.Cli --
          bench --ticks 6000 --warmup 0 --churn 2 --workers 4 --hash-stream long-${{ matrix.os }}.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: long-hash-stream-${{ matrix.os }}
          path: long-${{ matrix.os }}.tsv

  determinism-compare:
    name: Determinism - identical long hash streams
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: long-hash-stream-*
          merge-multiple: true
      - name: Compare tick by tick
        run: |
          set -euo pipefail
          ref=long-ubuntu-latest.tsv
          for f in long-*.tsv; do
            if ! cmp -s "$ref" "$f"; then
              echo "::error::$f differs from $ref; first differing ticks:"
              diff "$ref" "$f" | head -20
              exit 1
            fi
          done
          echo "All $(ls long-*.tsv | wc -l) hash streams are identical ($(wc -l < "$ref") ticks)."

  spike-s2-determinism:
    # Open item of ADR 0007: the S2 harness (fixed-point sim + sandboxed Lua) on Windows x64 and Linux x64 next to the
    # local macOS arm64/Rosetta runs. Every configuration must produce the reference final hash AAE3D9913A101FAF (the
    # harness's value at its own commit 8a3da0c and on main; see the note in ADR 0007).
    name: Spike S2 determinism - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      S2_REFERENCE_HASH: AAE3D9913A101FAF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet build spikes/S2-determinism/Tzar2.Spikes.S2 -c Release
      - run: dotnet build spikes/S2-determinism/Tzar2.Spikes.S2 -c Debug
      - name: Run net8/net10 x Debug/Release and compare with the reference
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for cfg in Release Debug; do
            for tfm in net8.0 net10.0; do
              label="${{ matrix.os }}-$tfm-$cfg"
              dotnet "spikes/S2-determinism/Tzar2.Spikes.S2/bin/$cfg/$tfm/Tzar2.Spikes.S2.dll" --out s2-out --label "$label" > "s2-$label.txt"
              final="$(grep '^final' "s2-$label.txt" | cut -f2 | tr -d '\r')"
              echo "$label final=$final"
              if [ "$final" != "$S2_REFERENCE_HASH" ]; then
                echo "::error::S2 $label final hash $final differs from $S2_REFERENCE_HASH"
                status=1
              fi
            done
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-s2-${{ matrix.os }}
          path: s2-out

  benchmarks:
    # TDD §21 nightly gates (ADR 0080), each through tools/ci/check-bench.sh on the medians of three runs: an absolute
    # budget on the tick p99 (<= 12 ms; the 4-vCPU runner is weaker than the 6-core reference CPU of §4.3) and relative
    # ones against tools/ci/bench-baseline.tsv for the runner's CPU model (runners come with different CPUs), on the
    # calibration-normalized times (runners of one model differ in speed; ADR 0080 amendment 1): p50 within 10% and p99
    # within 30% of the row (provisional rows and an unknown CPU model are looser and warn). A failing gate does not stop
    # the later ones. Gating: s2 (the
    # §4.3 S2 proxy: 4,000 units on 512², 8 players, AI-like order rate), B3 (500 move orders planned within 3 ticks),
    # B4 (no stuck units, corpses never change passability; ADR 0026), gameplay (resources delivered, fights happen;
    # ADR 0039) and ai (8 legacy AIs: every AI gathers, builds, trains and fights; ADR 0052; one 20-minute run, checked
    # against single-run rows). The synthetic stress scenario (16 move orders per player every tick, churn 2) is informational with its
    # own budget (p99 <= 12 ms on the runner, and the same relative checks): warnings, never failures.
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet build -c Release src/Tzar2.Tools.Cli
      # Gated scenarios run three times; check-bench.sh checks the medians (the statistic the baselines use).
      - name: S2 proxy tick budget (t2 bench s2, 4,000 units on 512², 8 players)
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- bench --scenario s2 --workers 4 | tee "bench-s2-$run.txt"
          done
          tools/ci/check-bench.sh s2 12 bench-s2-1.txt bench-s2-2.txt bench-s2-3.txt
      - name: B3 maze mass move (t2 bench, 500 orders on a 512² maze)
        if: ${{ !cancelled() }} # every gate reports, even after an earlier one failed (ADR 0080 amendment 1)
        run: |
          set -euo pipefail
          for scenario in b3 b3-groups; do
            dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- bench --scenario "$scenario" --ticks 600 --workers 4 | tee "bench-$scenario.txt"
            tools/ci/check-bench.sh "$scenario" 12 "bench-$scenario.txt"
          done
      - name: Gameplay economy and combat at scale (t2 bench, 8 kingdoms, 2,400 soldiers, 480 peasants)
        if: ${{ !cancelled() }} # every gate reports, even after an earlier one failed (ADR 0080 amendment 1)
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- bench --scenario gameplay --players 8 --workers 4 | tee "bench-gameplay-$run.txt"
          done
          tools/ci/check-bench.sh gameplay 12 bench-gameplay-1.txt bench-gameplay-2.txt bench-gameplay-3.txt
      - name: AI against AI (t2 bench, 8 legacy AIs on 256², 20 minutes of game time; ADR 0051/0052)
        if: ${{ !cancelled() }} # every gate reports, even after an earlier one failed (ADR 0080 amendment 1)
        run: |
          set -euo pipefail
          dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- bench --scenario ai --players 8 --ticks 24000 --workers 4 | tee bench-ai.txt
          tools/ci/check-bench.sh ai 12 bench-ai.txt
      - name: B4 mass death then traffic (t2 bench)
        if: ${{ !cancelled() }} # every gate reports, even after an earlier one failed (ADR 0080 amendment 1)
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- bench --scenario b4 --workers 4 | tee "bench-b4-$run.txt"
          done
          tools/ci/check-bench.sh b4 12 bench-b4-1.txt bench-b4-2.txt bench-b4-3.txt
      - name: Synthetic stress, informational (t2 bench, 16 orders/player/tick, churn 2)
        if: ${{ !cancelled() }} # every gate reports, even after an earlier one failed (ADR 0080 amendment 1)
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- bench --ticks 2000 --warmup 200 --churn 2 --workers 4 | tee "bench-stress-$run.txt"
          done
          tools/ci/check-bench.sh stress 12 --informational bench-stress-1.txt bench-stress-2.txt bench-stress-3.txt
      - name: Benchmark summary
        if: always()
        run: |
          {
            echo '### t2 bench (ADR 0080)'
            echo '```'
            for f in bench-*.txt; do echo "== $f"; grep -E '^(scenario|cpu|tick ms|calibration|normalized|section ms)' "$f" || true; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-bench
          path: bench-*.txt
      - run: dotnet run -c Release --project tests/Tzar2.Benchmarks -- --filter "*" --exporters json markdown --artifacts BenchmarkDotNet.Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BenchmarkDotNet.Artifacts

  windows-godot:
    # The nightly Windows export (TDD §24), now the M7 package (ADR 0241): Godot headless export, signing when its
    # secrets exist, portable zip and installer, and the install/uninstall checks. Artifacts only, nothing is published.
    name: Windows Godot build
    uses: ./.github/workflows/windows-package.yml
    secrets: inherit

  mp-soak:
    # M6 (ADR 0167, TDD §22.7): a nightly slice of the multiplayer soak on Windows and Linux. Each match: two bot players
    # behind UDP proxies (200 ms RTT, jitter, 5 % loss) and two Hard AIs through the real relay, 5 minutes of game time
    # at 4x speed, half of the matches with a disconnect and rejoin (some after an AI takeover). Every match must end
    # with identical full-state hashes, no desync and verified replays. Replaces the spike S3 job (ADR 0009).
    name: Multiplayer soak - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet build src/Tzar2.Tools.Cli -c Release
      - name: Soak slice (20 matches)
        run: >
          dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli --
          soak --synthetic --matches 20 --parallel 2 --ticks 6000 --rtt 200 --loss 5 --disconnects 0.5
          --seed ${{ github.run_number }} --report soak-${{ matrix.os }}.json
      - name: Soak summary
        if: always()
        shell: bash
        run: |
          {
            echo '### t2 soak (ADR 0167)'
            echo '```'
            head -c 2000 soak-${{ matrix.os }}.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: soak-${{ matrix.os }}.json
