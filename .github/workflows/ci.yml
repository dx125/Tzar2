name: CI

# TDD §24: build + tests per PR on Windows (game incl. the Godot client) and headless core tests on Linux/macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  legal:
    name: No original game files (REQ-LEGAL-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: every blob added or modified in the pushed/PR range is checked, not only the final tree.
          fetch-depth: 0
      - name: Self-test of the guard
        run: tools/ci/test-check-no-original-files.sh
      - name: Check the tree and every commit in the range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            # A new branch has an all-zero "before"; the script then checks the whole history of PUSH_AFTER.
            push) range="${PUSH_BEFORE:-0000000000000000000000000000000000000000}..$PUSH_AFTER" ;;
            *) range="HEAD" ;;
          esac
          tools/ci/check-no-original-files.sh --range "$range"

  licenses:
    name: Dependency licenses (DEC-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet restore Tzar2.sln
      - run: dotnet tool install --global nuget-license --version 4.0.18
      - name: Check licenses of all (transitive) NuGet packages
        run: >
          nuget-license -i Tzar2.sln -t
          -a tools/ci/allowed-licenses.json
          -mapping tools/ci/license-url-mappings.json
          -ignore tools/ci/license-ignored-packages.json

  windows:
    name: Windows x64 - full build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Tzar2.sln includes src/Tzar2.Client; Godot.NET.Sdk/GodotSharp come from NuGet, no Godot binary is needed to compile it.
      - run: dotnet build Tzar2.sln -c Release
      - run: dotnet test Tzar2.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults

  capture-harness:
    # ADR 0030: the Win32 half of the capture harness (window capture, SendInput, ReadProcessMemory) on a real Windows
    # desktop, the scenario files, and the operator script's own checks. The original game is never involved.
    name: Capture harness - Windows self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet build src/Tzar2.Tools.Cli/Tzar2.Tools.Cli.csproj -c Release
      - name: Parse run-capture.ps1
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/capture/run-capture.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
      - name: Scenario files are valid
        run: src/Tzar2.Tools.Cli/bin/Release/net10.0/t2.exe fidelity scenarios
      - name: Self-test (own window, PrintWindow/BitBlt, SendInput, ReadProcessMemory)
        # Hosted runners may not deliver synthetic input to a foreground window; input checks warn instead of failing.
        run: src/Tzar2.Tools.Cli/bin/Release/net10.0/t2.exe fidelity selftest --allow-no-input
      - name: run-capture.ps1 stops cleanly on a folder without the game
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/capture/run-capture.ps1 -TzarPath $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 1) { Write-Host "expected exit code 1, got $LASTEXITCODE"; exit 1 }
          exit 0

  headless:
    name: Headless core - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DEC-14 (b): core determinism is checked on Linux x64 and macOS arm64 as insurance for the later ports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Tzar2.Headless.slnf is the solution without the Godot client.
      - run: dotnet build Tzar2.Headless.slnf -c Release
      - run: dotnet test Tzar2.Headless.slnf -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  server-docker:
    # TDD §19.7 / ADR 0161: the relay/lobby service builds as a Linux container, starts, answers its HTTP API, a UDP
    # browse query and a lobby creation, and stops cleanly on SIGTERM.
    name: Relay server - Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Build the image
        run: docker build -f src/Tzar2.Server/Dockerfile -t tzar2-server:ci .
      - name: Run it and probe the API
        run: |
          set -euo pipefail
          docker run -d --name relay -p 18080:8080 -p 47625:47625/udp tzar2-server:ci
          for i in $(seq 1 30); do curl -fsS localhost:18080/healthz && break; sleep 1; done
          curl -fsS localhost:18080/metrics | grep -q '^tzar2_lobbies 0$'
          test "$(curl -fsS localhost:18080/lobbies)" = "[]"
          dotnet build tests/Tzar2.Server.Tests -c Release
          TZAR2_RELAY=127.0.0.1:47625 dotnet test tests/Tzar2.Server.Tests -c Release --no-build --filter "FullyQualifiedName~ContainerProbe"
          docker stop -t 10 relay
          docker logs relay | tee relay.log
          grep -q '"event":"service.stop"' relay.log

  replay-corpus:
    # M6 exit criterion "replays verify on Windows and in the headless Linux/macOS core runs" (ADR 0164, 0167): a
    # single-player replay of three Hard AIs and two short multiplayer soak matches (impaired UDP, a disconnect and
    # rejoin each) are recorded on Linux; replay-verify re-simulates them on every OS.
    name: Replays - record a corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet build src/Tzar2.Tools.Cli -c Release
      - name: Single player, three computer kingdoms
        run: dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- replay record --synthetic --players 3 --ticks 2400 --out corpus/sp-3ai.t2rep
      - name: Multiplayer soak slice (2 matches, 200 ms RTT, 5 % loss, disconnect + rejoin)
        run: >
          dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli --
          soak --synthetic --matches 2 --parallel 2 --ticks 1600 --disconnects 1 --replays corpus --report soak-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: replay-corpus
          path: |
            corpus
            soak-ci.json

  replay-verify:
    name: Replays - verify on ${{ matrix.os }}
    needs: replay-corpus
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: replay-corpus
      - run: dotnet build src/Tzar2.Tools.Cli -c Release
      - name: Re-simulate every replay and compare every stored hash
        run: dotnet run -c Release --no-build --project src/Tzar2.Tools.Cli -- replay verify --synthetic corpus --report verify-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-verify-${{ matrix.os }}
          path: verify-${{ matrix.os }}.json

  determinism:
    # TDD §22.2 / ADR 0017: the sim golden hash on every OS. The test fails on any difference from the committed value;
    # the t2 bench run writes the per-tick hash stream, and determinism-compare diffs the streams across OSes.
    name: Determinism golden hash - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Golden hashes (Core + sim scenario, net8 and net10)
        run: dotnet test tests/Tzar2.Determinism.Tests -c Release --logger "console;verbosity=normal"
      - name: Sim scenario hash stream (t2 bench, must match the golden final hash)
        run: >
          dotnet run -c Release --project src/Tzar2.Tools.Cli --
          bench --map 128 --entities 2000 --players 4 --seed 1592598566 --orders 12 --churn 2
          --ticks 300 --warmup 0 --workers 4
          --expect-hash F0A9532388B6ED2C --hash-stream hash-stream-${{ matrix.os }}.tsv
      - name: Gameplay scenario hash stream (economy + combat, t2 bench, must match the golden final hash)
        run: >
          dotnet run -c Release --project src/Tzar2.Tools.Cli --
          bench --scenario gameplay --map 128 --players 4 --entities 480 --seed 1592598566
          --ticks 1600 --warmup 0 --workers 4
          --expect-hash C8071D19F6BAFD2E --hash-stream hash-stream-gameplay-${{ matrix.os }}.tsv
      - name: AI scenario hash stream (4 legacy AIs against each other, t2 bench, must match the golden final hash)
        run: >
          dotnet run -c Release --project src/Tzar2.Tools.Cli --
          bench --scenario ai --map 128 --players 4 --seed 1592598566
          --ticks 2400 --warmup 0 --workers 4
          --expect-hash 3C72EDE35D0EFBBE --hash-stream hash-stream-ai-${{ matrix.os }}.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: hash-stream-${{ matrix.os }}
          path: hash-stream-*${{ matrix.os }}.tsv

  determinism-compare:
    name: Determinism - identical hash streams on all OSes
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-stream-*
          merge-multiple: true
      - name: Compare tick by tick
        run: |
          set -euo pipefail
          ls -l hash-stream-*.tsv
          for kind in "" "gameplay-" "ai-"; do
            ref=hash-stream-${kind}ubuntu-latest.tsv
            for os in windows-latest ubuntu-latest macos-latest; do
              f=hash-stream-${kind}${os}.tsv
              if ! cmp -s "$ref" "$f"; then
                echo "::error::$f differs from $ref; first differing ticks:"
                diff "$ref" "$f" | head -20
                exit 1
              fi
            done
            echo "The ${kind:-synthetic-}hash streams of the 3 OSes are identical ($(wc -l < "$ref") ticks)."
          done
