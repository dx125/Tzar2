name: CI

# TDD §24: build + tests per PR on Windows (game incl. the Godot client) and headless core tests on Linux/macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  legal:
    name: No original game files (REQ-LEGAL-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: every blob added or modified in the pushed/PR range is checked, not only the final tree.
          fetch-depth: 0
      - name: Self-test of the guard
        run: tools/ci/test-check-no-original-files.sh
      - name: Check the tree and every commit in the range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            # A new branch has an all-zero "before"; the script then checks the whole history of PUSH_AFTER.
            push) range="${PUSH_BEFORE:-0000000000000000000000000000000000000000}..$PUSH_AFTER" ;;
            *) range="HEAD" ;;
          esac
          tools/ci/check-no-original-files.sh --range "$range"

  licenses:
    name: Dependency licenses (DEC-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet restore Tzar2.sln
      - run: dotnet tool install --global nuget-license --version 4.0.18
      - name: Check licenses of all (transitive) NuGet packages
        run: >
          nuget-license -i Tzar2.sln -t
          -a tools/ci/allowed-licenses.json
          -mapping tools/ci/license-url-mappings.json
          -ignore tools/ci/license-ignored-packages.json

  windows:
    name: Windows x64 - full build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Tzar2.sln includes src/Tzar2.Client; Godot.NET.Sdk/GodotSharp come from NuGet, no Godot binary is needed to compile it.
      - run: dotnet build Tzar2.sln -c Release
      - run: dotnet test Tzar2.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults

  headless:
    name: Headless core - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DEC-14 (b): core determinism is checked on Linux x64 and macOS arm64 as insurance for the later ports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Tzar2.Headless.slnf is the solution without the Godot client.
      - run: dotnet build Tzar2.Headless.slnf -c Release
      - run: dotnet test Tzar2.Headless.slnf -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  determinism:
    # TDD §22.2 / ADR 0017: the sim golden hash on every OS. The test fails on any difference from the committed value;
    # the t2 bench run writes the per-tick hash stream, and determinism-compare diffs the streams across OSes.
    name: Determinism golden hash - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Golden hashes (Core + sim scenario, net8 and net10)
        run: dotnet test tests/Tzar2.Determinism.Tests -c Release --logger "console;verbosity=normal"
      - name: Sim scenario hash stream (t2 bench, must match the golden final hash)
        run: >
          dotnet run -c Release --project src/Tzar2.Tools.Cli --
          bench --map 128 --entities 2000 --players 4 --seed 1592598566 --orders 12 --churn 2
          --ticks 300 --warmup 0 --workers 4
          --expect-hash 25418CEBC3F46249 --hash-stream hash-stream-${{ matrix.os }}.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: hash-stream-${{ matrix.os }}
          path: hash-stream-${{ matrix.os }}.tsv

  determinism-compare:
    name: Determinism - identical hash streams on all OSes
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-stream-*
          merge-multiple: true
      - name: Compare tick by tick
        run: |
          set -euo pipefail
          ls -l hash-stream-*.tsv
          ref=hash-stream-ubuntu-latest.tsv
          for f in hash-stream-*.tsv; do
            if ! cmp -s "$ref" "$f"; then
              echo "::error::$f differs from $ref; first differing ticks:"
              diff "$ref" "$f" | head -20
              exit 1
            fi
          done
          echo "All $(ls hash-stream-*.tsv | wc -l) hash streams are identical ($(wc -l < "$ref") ticks)."
